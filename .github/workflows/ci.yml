name: CI

on:
  push:
    branches: [main]
    # Skip CI when a push touches only non-code artifacts (lessons, docs,
    # markdown, ignore/license). Runs whenever ANY changed file is outside
    # these globs, so mixed code+docs changes are still fully gated.
    #
    # SYNC WARNING: what this list skips, .github/workflows/docs.yml picks up
    # via an identical `paths:` allowlist (#1375) -- it runs the three gates
    # that DO apply to markdown (lessons INDEX drift, prettier, yamllint). If
    # the two lists drift, files fall into a gap covered by neither workflow.
    # Edit both together.
    paths-ignore:
      - '**/*.md'
      - 'tasks/**'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
    # `edited` so that retargeting a stacked PR to main runs CI (#2204) --
    # that fires only `edited`. Other edits (title, body) skip every job via
    # the `if:` on `changes`; the CI Gate job below only re-checks the title.
    # NO path filter on pull_request (#2607): the `CI Gate` job lives in this
    # workflow and is the required check, so this workflow must run on every
    # PR head or the required check would never report. What the old
    # paths-ignore decided now comes from the `changes` job (same globs, in
    # scripts/lib/changedFilesGate.ts), and the push trigger above keeps its
    # paths-ignore.
  workflow_call:

# Least privilege (#2861): the workflow level grants read only; every job
# declares the scopes it needs. Guarded by
# scripts/lib/__tests__/ciPermissionsAndPins.test.ts.
permissions:
  contents: read

# Supersede a PR's stale run when it is pushed again (#2607). Guarded by
# scripts/lib/__tests__/ciConcurrency.test.ts.
#  - Cancels only on `pull_request`. This workflow triggers on push to main,
#    pull_request and workflow_call (nothing calls it today). Everything that
#    is not a pull_request gets a group unique to the run, so a push to main
#    is never cancelled or dropped from the queue.
#  - The PR group starts with `github.workflow` (#2840). In a called workflow
#    it is the caller's name, so a pull_request caller's run and the
#    standalone run (`CI`) get different groups and don't cancel each other.
#  - A no-op edit (title/body, not base) runs with every job skipped (#2204).
#    It gets its own group so it cannot cancel the real in-flight run and
#    leave a cancelled check on the head with only a skipped run beside it.
#    Same shape as docs.yml.
#  - A superseded run reports `cancelled`, and so does its `CI Gate` job, which
#    is not `success`. The newer run's `CI Gate` is the latest result on the
#    head, so cancelling never opens the gate (#2607: the gate no longer reads
#    other runs' check results, so the #2316 superseded-cancel rule is gone).
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
    && format('{0}-pr-{1}{2}', github.workflow,
    github.event.pull_request.number,
    github.event.action == 'edited' && !github.event.changes.base
    && format('-noop-{0}', github.run_id) || '')
    || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classify the diff (#2607). On `edited`, run only for a base change
  # (#2204); every other job `needs:` this one, so they all skip with it.
  # Needs no install: the script uses only fetch and the standalone tsx.
  changes:
    name: Changes
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Narrows the workflow-level token. The PR file list is public data on
    # this public repo, so contents: read is enough (CI proves it).
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Classify changed files (#2607)
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          version="$(node -p "require('./package.json').devDependencies.tsx")"
          npx --yes "tsx@${version}" scripts/ci-changes.ts

  # Quality Gates - Must pass before any other jobs
  quality-gates:
    name: Quality Gates
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      typescript-errors: ${{ steps.typescript.outputs.total_errors }}
      lint-errors: ${{ steps.lint.outputs.total_errors }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build dependency packages
        run: |
          npm run build:shared-contracts
          npm run build:analytics-core
          npm run build:collector-cli
          npm run build:mcp-server

      - name: Verify dual ESM/CJS emit (#1489)
        # tsc exiting 0 does NOT prove dist/cjs is CommonJS: node16/nodenext
        # derive the emit format from the source package.json ("type": "module"),
        # so a careless moduleResolution change writes ESM into dist/cjs and
        # still exits 0. dist/ is gitignored (R16), so the break would surface
        # as a consumer error, not a red build. Check the emitted bytes.
        run: npm run build:verify-emit

      - name: Typecheck collector-cli (#1109)
        # collector-cli is never built/typechecked in PR CI otherwise — its
        # type errors first surface in the scheduled data pipeline. Gate it
        # here so they fail the PR instead (epic #1194 AC2).
        run: npm run typecheck --workspace=@taverns-red/collector-cli

      - name: TypeScript Zero Error Check
        id: typescript
        run: |
          echo "Checking TypeScript compilation..."
          # NOTE: Uses the same tsconfig.json as local development for consistency.
          # Frontend: tsconfig.json (excludes tests, exactOptionalPropertyTypes: true)
          # This ensures CI/CD and local development have identical type checking behavior.
          # The excluded test tree is gated separately by the next step (#1368).

          # Run frontend typecheck
          set +e
          FRONTEND_OUTPUT=$(npm run typecheck:frontend 2>&1)
          FRONTEND_EXIT=$?
          set -e

          # Count errors
          FRONTEND_ERRORS=$(echo "$FRONTEND_OUTPUT" | grep -E "error TS[0-9]+" | wc -l | tr -d ' ')
          if [ -z "$FRONTEND_ERRORS" ]; then FRONTEND_ERRORS=0; fi

          # Use exit codes as fallback if grep found nothing but tsc failed
          if [ "$FRONTEND_EXIT" -ne 0 ] && [ "$FRONTEND_ERRORS" -eq 0 ]; then
            FRONTEND_ERRORS=1
          fi

          TOTAL_ERRORS=$FRONTEND_ERRORS

          echo "frontend_errors=$FRONTEND_ERRORS" >> "$GITHUB_OUTPUT"
          echo "total_errors=$TOTAL_ERRORS" >> "$GITHUB_OUTPUT"

          echo "## TypeScript Compilation Results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Component | Error Count | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------------|--------|" >> "$GITHUB_STEP_SUMMARY"

          if [ "$FRONTEND_ERRORS" -eq 0 ]; then FRONTEND_STATUS='✅ Pass'; else FRONTEND_STATUS='❌ Fail'; fi
          if [ "$TOTAL_ERRORS" -eq 0 ]; then TOTAL_STATUS='✅ **PASS**'; else TOTAL_STATUS='❌ **FAIL**'; fi

          echo "| Frontend | $FRONTEND_ERRORS | $FRONTEND_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Total** | **$TOTAL_ERRORS** | $TOTAL_STATUS |" >> "$GITHUB_STEP_SUMMARY"

          # Show actual errors if any
          if [ "$FRONTEND_ERRORS" -gt 0 ]; then
            echo "### Frontend Errors" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$FRONTEND_OUTPUT" | grep -E "error TS[0-9]+" | head -20 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$TOTAL_ERRORS" -gt 0 ]; then
            echo "❌ POLICY VIOLATION: TypeScript errors are not permitted"
            exit 1
          fi

          echo "✅ TypeScript compilation passed"

      - name: Typecheck the frontend test tree (#1368)
        # frontend/tsconfig.json EXCLUDES src/**/__tests__/** and *.test.*, and
        # Vitest transpiles with esbuild, which strips types rather than
        # checking them. Without this step nothing typechecks a test file: every
        # @ts-expect-error is inert and every fixture is free to declare a shape
        # it does not build. tsconfig.test.json re-includes the tree with four
        # index-access strictness flags relaxed; production src/ strictness is
        # unchanged and still enforced by the step above.
        run: npm run typecheck:tests

      - name: Typecheck scripts
        # scripts/tsconfig.json covers the scripts source and its __tests__
        # trees (#2836). Vitest strips types, so without this step a typo in a
        # scripts fixture is never caught. It also runs in `npm run typecheck`
        # (pre-commit); here it gets its own named step.
        run: npm run typecheck:scripts

      - name: Lint and Format Check
        id: lint
        run: |
          echo "Checking lint compliance..."
          npm run lint

          echo "Checking YAML lint compliance..."
          npm run lint:yaml

          echo "Checking code formatting..."
          npm run format
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Code formatting issues detected"
            echo "total_errors=1" >> $GITHUB_OUTPUT
            git diff
            exit 1
          else
            echo "total_errors=0" >> $GITHUB_OUTPUT
            echo "✅ All quality gates passed"
          fi

  # Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-26.04
    needs: quality-gates
    # security-events: write is what upload-sarif needs on a public repo;
    # actions: read is only for private repos (GitHub docs, "Uploading a
    # SARIF file to GitHub"). Third-party action below is SHA-pinned (#2861).
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          trivyignores: '.trivyignore.yaml'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Test Suite
  test:
    name: Test Suite
    runs-on: ubuntu-26.04
    needs: quality-gates
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build dependency packages
        run: |
          npm run build:shared-contracts
          npm run build:analytics-core
          npm run build:mcp-server

      - name: Run shared-contracts tests
        run: npm run test --workspace=@taverns-red/shared-contracts -- --coverage

      - name: Run analytics-core tests
        run: npm run test --workspace=@taverns-red/analytics-core -- --coverage

      - name: Run collector-cli tests
        run: npm run test --workspace=@taverns-red/collector-cli -- --coverage

      - name: Run mcp-server tests
        run: npm run test --workspace=@taverns-red/toast-stats-mcp -- --coverage

      - name: Run videos scenario-timing tests (#2293)
        # Unit tests for the how-to video scenario configs only. Captures and
        # renders are opt-in (`npm run videos:build`) and never run in CI.
        run: npm run test --workspace=@taverns-red/videos -- --coverage

      - name: Run mcp-server npm-pack smoke (#1163)
        # Packs the publishable tarball, installs it into a clean temp dir
        # (runtime deps resolve from the registry only), and boots the
        # installed bin over stdio against the committed CDN fixtures.
        run: npm run smoke:pack --workspace=@taverns-red/toast-stats-mcp

      - name: Check vitest project partition (#482)
        run: npm run test:projects:check --workspace=frontend

      - name: Check no unit test full-page-mounts (V12 / sprint 916)
        # A page mount in the fast unit project re-introduces the L53 contention
        # surface into the pre-push gate. Sourced from vitest's own unit-project
        # resolution, like the partition guard.
        run: npm run test:no-page-mounts:check --workspace=frontend

      - name: Check test quarantine is justified (#913)
        # Quarantine != skip (R1): fails only if an entry lacks a reason/issue
        # or the file is malformed. An empty list passes loudly.
        run: npm run test:quarantine:check

      - name: Run frontend tests
        run: npm run test --workspace=frontend -- --coverage

      - name: Check coverage denominator is exhaustive (#1536)
        # R20 applied to coverage: every git-tracked source file a workspace's
        # vitest coverage config keeps in scope must appear in that workspace's
        # coverage-final.json from the full-suite runs above. Exclusions are
        # read from each vitest config, never restated here.
        run: npm run test:coverage:denominator-check

      - name: Run scripts/lib tests
        run: npm run test:scripts

      - name: Runner toolchain probe (#1740)
        # The pipeline's coreutils/findutils/jq/gzip come from the runner
        # image, not a setup action. Ubuntu 26.04 ships uutils coreutils and
        # jq 1.8; this runs the exact command forms data-pipeline/deploy use
        # on the same label, so an image bump is proven here, pre-merge.
        run: scripts/runner-toolchain-probe.sh

  # agent-cli real-repo smoke (#2418): --help plus one real read-only call
  # per subcommand, so a CLI that drifts from the repo fails here. Kept out
  # of Test Suite so that job's token stays as it is; this one reads only.
  agent-cli-smoke:
    name: Agent CLI smoke
    runs-on: ubuntu-26.04
    needs: quality-gates
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run agent-cli against the real repo (#2418)
        run: scripts/agent-cli-smoke.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # Build Applications
  build:
    name: Build Applications
    runs-on: ubuntu-26.04
    needs: [quality-gates, test]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build dependency packages
        run: |
          npm run build:shared-contracts
          npm run build:analytics-core

      - name: Build frontend
        run: npm run build:frontend

      - name: Analyze bundle size
        run: |
          cd frontend/dist
          echo "## Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          for file in *.css *.js; do
            if [ -f "$file" ]; then
              size=$(du -h "$file" | cut -f1)
              echo "| $file | $size |" >> $GITHUB_STEP_SUMMARY
            fi
          done

  # Docs Gate for PRs (#2607). It used to be docs.yml's pull_request run;
  # that workflow is path-filtered, so its result could not be `needs:`-ed.
  # docs.yml keeps the push-to-main run. SYNC: keep the steps identical to
  # .github/workflows/docs.yml.
  docs-gate:
    name: Docs Gate
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Same token docs.yml gave this job.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: 'Check lessons INDEX.md generates (#1375, #2455)'
        env:
          LESSONS_DIR: tasks/lessons
        run: |
          bash scripts/lessons-index.sh
          bash scripts/lessons-index.sh --check

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Check markdown formatting (#1375)
        run: |
          version="$(node -p "require('./package.json').devDependencies.prettier")"
          echo "Using prettier@${version}"
          npx --yes "prettier@${version}" --check "**/*.md"

      - name: Check YAML lint (#1375)
        run: npm run lint:yaml

  # CI Gate: the SINGLE required check on `main` (#1216, #2607).
  #
  # It is the last job of this workflow and `needs:` every gated job, so it
  # decides from the run's own results and never polls the check-runs API.
  # This workflow has no pull_request path filter, so a `CI Gate` check exists
  # on every PR head. `always()` makes it run when a need failed, was
  # cancelled or was skipped; a skipped job counts as success to GitHub, so
  # scripts/lib/ciGateNeeds.ts fails any job the diff requires that is not
  # `success`. The name below is the required-check context in
  # .github/rulesets/main.json; rename both together.
  #
  # Security Scan and Agent CLI smoke are not gated, as before.
  gate:
    name: CI Gate
    needs: [changes, quality-gates, test, build, docs-gate]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    # Deliberate wait, not a slow-test mask (#2881): on a title/body-only edit
    # the gate polls until the head's earlier ci.yml run completes (CI takes
    # about 13 to 21 minutes). A normal run decides in seconds.
    timeout-minutes: 45
    # Scoped exception (#2607, COO-approved): only this job reads the head's
    # workflow runs and their jobs, on a title/body-only edit. It does not call
    # the check-runs API (#2881), so it holds no checks scope (#2886). The
    # workflow-level block is narrowed separately (#2861).
    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      # The squash subject becomes a changelog line. release-please decodes
      # `&lt;date&gt;` back to `<date>` and re-parses the notes as HTML, so a
      # tag-like `<x` swallows every later component's release (#2185: 2.62.0
      # released only the root; 2.63.0 overflowed 125k and skipped deploy).
      # The title goes through env, never inline, so it cannot inject shell.
      # Runs on every pull_request event including a title edit, so a rename
      # after the gate passed cannot slip through.
      - name: Release-notes-safe PR title (#2185)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          version="$(node -p "require('./package.json').devDependencies.tsx")"
          npx --yes "tsx@${version}" scripts/check-pr-title.ts

      - name: Decide from the needed jobs (#2607)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
          GATE_PR_NUMBER: ${{ github.event.pull_request.number }}
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GATE_NOOP: ${{ github.event.action == 'edited' && !github.event.changes.base }}
        run: |
          version="$(node -p "require('./package.json').devDependencies.tsx")"
          npx --yes "tsx@${version}" scripts/ci-gate-needs.ts
