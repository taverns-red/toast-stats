name: Lighthouse CI

# Runs once the PR is ready (#2101): a draft push skips the job, as does a
# `labeled` event for any label but `preview-smoke`, which forces a run on a
# draft. ready_for_review re-triggers it. Not a CI Gate check (ciGate.ts), so
# a draft-era skip cannot open the merge gate; prPreviewSmokeTrigger.test.ts.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'frontend/**'
      - 'lighthouserc.js'
      - '.github/workflows/lighthouse-ci.yml'
      - 'scripts/lighthouse-cdn-server.mjs' # lighthouserc.js starts it (#2000)
      # The bundle gates below run these; their logic lives in scripts/lib (#2005)
      - 'scripts/check-critical-path.ts'
      - 'scripts/check-map-route-budget.ts'
      - 'scripts/lib/criticalPath.ts'
      - 'scripts/lib/mapRouteBudget.ts'
      - '.nvmrc' # setup-node reads it (#2005)

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'preview-smoke')
      && (github.event.pull_request.draft == false
      || contains(github.event.pull_request.labels.*.name, 'preview-smoke'))
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build workspace dependencies
        run: |
          npm run build:shared-contracts
          npm run build:analytics-core

      - name: Build frontend
        # #915 (Sprint 4 V10): point the build at the local fixture server
        # (scripts/lighthouse-cdn-server.mjs, started by lighthouserc.js) so the
        # `/` page fetches committed CDN fixtures same-origin instead of the live
        # prod CDN. Decouples the CLS budget from network reachability — the gate
        # stops failing on luck when the CDN flakes (Lesson 125, deep-dive V10).
        run: npm run build:frontend
        env:
          VITE_CDN_BASE_URL: http://localhost:4173

      - name: Critical-path chunk check
        # #1830: route-only chunks (Recharts `charts-*`) must not be reachable
        # from index.html without a dynamic import — every route pays for them.
        run: npx tsx scripts/check-critical-path.ts frontend/dist

      - name: Map-route budget check
        # #1786 / ADR-016 D2 (Ron, 2026-10-12): on map routes, main-thread JS
        # must stay at or under 300 KB gzip and the MapLibre worker at or
        # under 150 KB gzip.
        run: npx tsx scripts/check-map-route-budget.ts frontend/dist

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.js'
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const resultsDir = '.lighthouseci';

            if (!fs.existsSync(resultsDir)) {
              console.log('No Lighthouse results found');
              return;
            }

            const manifests = fs.readdirSync(resultsDir)
              .filter(f => f.endsWith('.json') && f.startsWith('manifest'));

            if (manifests.length === 0) return;

            const manifest = JSON.parse(
              fs.readFileSync(path.join(resultsDir, manifests[0]), 'utf8')
            );

            let comment = '## 🏠 Lighthouse CI Results\n\n';
            comment += '| Metric | Score |\n|--------|-------|\n';

            for (const entry of manifest) {
              if (entry.summary) {
                const perf = Math.round((entry.summary.performance || 0) * 100);
                const a11y = Math.round((entry.summary.accessibility || 0) * 100);
                const bp = Math.round((entry.summary['best-practices'] || 0) * 100);
                comment += `| Performance | ${perf} |\n`;
                comment += `| Accessibility | ${a11y} |\n`;
                comment += `| Best Practices | ${bp} |\n`;
                break;
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });
