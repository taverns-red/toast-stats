# Unified Data Pipeline Workflow (#191)
#
# Modes:
#   daily    — scrape → transform → compute-analytics → upload ONE date (default, cron)
#   rebuild  — sync all raw-csv from GCS → rebuild ALL dates → upload ALL snapshots
#   rescrape — re-collect CSVs from the dashboard for specific dates or a program year
#   prune    — remove non-month-end dates from local cache and GCS staging;
#              with reconcile_prod=true, also reconcile production (#1133)
#   backfill-global-totals
#            — build snapshots/{date}/global-totals.json for already-published
#              historical dates, one date at a time (#1498)
#
# Prerequisites:
#   1. Run scripts/setup-wif.sh (one-time)
#   2. Add GitHub secrets: GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
#
# The collector uses Playwright (chromium) to scrape Toastmasters dashboards.
# Data is processed locally and uploaded to GCS for the frontend to consume.
#
# GCS CLI — `gcloud storage`, with `rsync` deliberately still on `gsutil` (#1412):
#   Google drops the bundled `gsutil` from the Cloud SDK in March 2027, and this
#   workflow never installs it explicitly (setup-gcloud@v3 gives us the default
#   bundle), so every call would break at once. `cp`/`ls`/`cat`/`rm` are migrated;
#   equivalence was verified command-by-command against the real staging bucket.
#   Two things a mechanical rewrite gets wrong:
#     * `-m` has NO equivalent — parallelism is the default in `gcloud storage`.
#     * BUNDLED SHORT FLAGS DO NOT PARSE. `gcloud storage cp -rZ` exits 2 with a
#       usage error; it must be written `-r -Z`. gsutil accepts both.
#   `rsync` is deliberately NOT migrated. `gcloud storage rsync` exists, but its
#   object-comparison defaults and `-x` exclude anchoring are not established as
#   byte-identical to gsutil's, and the destructive call sites (the `-x` keep-only
#   skeleton sync at prune time, and staging→prod promotion) are exactly where a
#   near-miss deletes retained data. Those move in their own PR with per-call-site
#   dry-run evidence — see #1412.

name: Data Pipeline

on:
  # The daily run is intentionally NOT scheduled here. GitHub's cron fires
  # late or drops events under load, which is unacceptable for the freshness-
  # critical daily pipeline (#1242). It is triggered on time by an external
  # launchd job on the operator Mac at 05:00 America/Toronto (DST-aware):
  #   gh workflow run data-pipeline.yml --ref main -f mode=daily
  # Runbook: docs/runbooks/local-daily-pipeline-trigger.md
  #
  # The quarterly-prune cron remains operator-gated (#1148) and is not wired
  # as a trigger yet; when flipped on it is matched by its exact expression in
  # the Determine-mode step below.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode'
        required: true
        type: choice
        options:
          - daily
          - rebuild
          - rescrape
          - rescrape-historical
          - prune
          - backfill-global-totals
        default: daily
      date:
        description: 'Target date (YYYY-MM-DD). Daily: scrape date. Rebuild: ignored unless dates specified.'
        required: false
        type: string
      dates:
        description: >-
          Rebuild/rescrape: comma-separated dates (default: all in raw-csv/ for rebuild).
          backfill-global-totals: comma-separated dates (default: the five PY-ends + five Mar-31s).
        required: false
        type: string
      program_year:
        description: 'Rescrape only: program year (e.g. 2025-2026). Generates monthly dates automatically.'
        required: false
        type: string
      districts:
        description: 'Comma-separated district IDs (e.g. 57,58,59), defaults to all'
        required: false
        type: string
      force:
        description: 'Force re-scrape/recompute even if cache exists'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Prune only: classify and report without deleting'
        required: false
        type: boolean
        default: false
      reconcile_prod:
        description: 'Prune only: also reconcile PRODUCTION — delete pruned prefixes + sync manifests (#1133, see runbook)'
        required: false
        type: boolean
        default: false
      allow_value_changes:
        description: 'Promote even if re-derived VALUES changed vs prod (review the value-diff first). For re-derive runs.'
        required: false
        type: boolean
        default: false
      allow_subtractive:
        description: 'Promote even if staging has FEWER districts/dates than prod (review the count diff first). For TI district consolidations.'
        required: false
        type: boolean
        default: false

# Prevent overlapping pipeline runs
concurrency:
  group: data-pipeline
  cancel-in-progress: false

env:
  # Daily pipeline writes to staging first; promotion copies to production (#316)
  GCS_BUCKET: 'toast-stats-data-staging'
  GCS_BUCKET_PRODUCTION: 'toast-stats-data-ca'

permissions:
  contents: read
  id-token: write # Required for Workload Identity Federation
  issues: write # File/refresh/close the promotion-held alert issue (#1073)

jobs:
  pipeline:
    name: "${{ inputs.mode || 'daily' }} pipeline"
    runs-on: ubuntu-latest
    # Rebuild needs more time (110+ dates × ~1 min each + GCS sync)
    timeout-minutes: ${{ (inputs.mode == 'rebuild' || inputs.mode == 'rescrape' || inputs.mode == 'rescrape-historical') && 240 || (inputs.mode == 'backfill-global-totals' && 120 || 30) }}

    # ── Job outputs (#1428) ──────────────────────────────────
    # The file's first job-level outputs block. It exists for one consumer:
    # the `place-reports` job below, which puts the daily-reports sidecars
    # into the snapshot directory THIS job just published.
    #
    # `snapshot_date` is the load-bearing one. It is PARSED out of the scraped
    # CSV's "As of" footer by ClosingPeriodDetector (post closing-period remap,
    # #309), so no sibling job can derive it without scraping — which is
    # exactly why `daily-reports` fetches into a raw-date-keyed staging prefix
    # and a trailing job does the placement. It is the empty string for every
    # non-daily mode, because the `[daily] Scrape & Transform` step never ran;
    # `place-reports` keys its whole existence off that.
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      raw_date: ${{ steps.daily-scrape.outputs.date }}
      snapshot_date: ${{ steps.daily-scrape.outputs.snapshot_date }}
      # Literally the string 'unknown' when a manual `districts` override
      # skipped discovery (#1343) — `place-reports` guards for it.
      program_year: ${{ steps.daily-config.outputs.program_year }}
      # Both promotion gates open ⇒ this run already rsynced staging → prod,
      # BEFORE the sidecars landed. `place-reports` mirrors them explicitly.
      promoted: ${{ steps.diff.outputs.promote == 'true' && steps.valuediff.outputs.value_promote == 'true' }}
      # #1419: 'none' | 'auto' | 'manual'. The `closing-registry-pr` job below
      # keys off 'auto'; the red-alert steps in this job key off 'manual'.
      registry_remediation: ${{ steps.registrycheck.outputs.remediation }}

    steps:
      # ── Setup ────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: |
          npm run build --workspace=@taverns-red/shared-contracts
          npm run build --workspace=@taverns-red/analytics-core
          npm run build --workspace=@taverns-red/collector-cli

      - name: Install Playwright browsers
        if: inputs.mode == 'daily' || inputs.mode == '' || github.event_name == 'schedule'
        run: npx playwright install chromium --with-deps

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Determine mode
        id: mode
        run: |
          MODE="${{ inputs.mode || 'daily' }}"
          # Scheduled events carry no inputs; the quarterly prune cron is
          # identified by its exact expression (#1148). Any other schedule
          # stays the daily default.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 6 25 2,5,8,11 *" ]; then
            MODE="prune"
          fi
          # Boolean inputs are BOOLEANS in the `inputs` expression context;
          # comparing one to the string 'true' in an `if:` coerces
          # true→1 vs 'true'→NaN and NEVER matches — the dry-run gate on
          # the GCS deletion step was inert (#1133). Normalize booleans to
          # step-output strings here, once; every `if:` compares strings.
          # Guarded by scripts/lib/workflowBooleanInputGuard.ts.
          DRY_RUN="${{ inputs.dry_run }}"
          RECONCILE_PROD="${{ inputs.reconcile_prod }}"
          if [ "${MODE}" = "prune" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled prunes always reconcile prod in the same run —
            # a staging-only scheduled prune would freeze promotion until
            # manual recovery (runbook Path B). Never dry-run on schedule.
            DRY_RUN="false"
            RECONCILE_PROD="true"
          fi
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN:-false}" >> "$GITHUB_OUTPUT"
          echo "reconcile_prod=${RECONCILE_PROD:-false}" >> "$GITHUB_OUTPUT"
          echo "## 🔧 Pipeline Mode: \`${MODE}\`" >> "$GITHUB_STEP_SUMMARY"

      # ════════════════════════════════════════════════════════
      # DAILY MODE
      # ════════════════════════════════════════════════════════

      # ── Daily Step 1: Discover districts + sync raw-csv cache ──
      - name: '[daily] Discover districts and sync raw-csv'
        if: steps.mode.outputs.mode == 'daily'
        id: daily-config
        run: |
          # Toastmasters dashboard is always one day behind — use yesterday
          TARGET_DATE="${{ inputs.date || '' }}"
          if [ -z "${TARGET_DATE}" ]; then
            TARGET_DATE=$(date -u -d '1 day ago' +%Y-%m-%d)
          fi
          echo "Target date: ${TARGET_DATE}"

          # If districts were manually specified, use them directly
          if [ -n "${{ inputs.districts }}" ]; then
            DISTRICTS="${{ inputs.districts }}"
            echo "Using manual district override: ${DISTRICTS}"
            # Discovery — and therefore program-year resolution — never ran, so
            # there is no verdict to judge. The rollover monitor skips rather
            # than alerting on a missing reason (#1343).
            DISCOVERED_REASON="skipped"
          else
            # Auto-discover districts, resolving the active program year by data
            # (#1284). At the July rollover the new PY has no dashboard yet, so
            # this falls back to the prior PY (June's close is still live there).
            echo "Discovering districts for ${TARGET_DATE}..."
            set +e
            DISCOVERY_JSON=$(npx collector-cli discover-districts --date "${TARGET_DATE}" --verbose)
            DISCOVERY_STATUS=$?
            set -e
            if [ ${DISCOVERY_STATUS} -ne 0 ]; then
              echo "::error::Failed to discover districts from Toastmasters CSV (exit ${DISCOVERY_STATUS})."
              echo "${DISCOVERY_JSON}"
              exit 1
            fi
            DISTRICTS=$(echo "${DISCOVERY_JSON}" | jq -r '.districts')
            DISCOVERED_PY=$(echo "${DISCOVERY_JSON}" | jq -r '.programYear')
            DISCOVERED_FELLBACK=$(echo "${DISCOVERY_JSON}" | jq -r '.fellBack')
            DISCOVERED_REASON=$(echo "${DISCOVERY_JSON}" | jq -r '.reason // "unknown"')

            if [ -z "${DISTRICTS}" ] || [ "${DISTRICTS}" = "null" ]; then
              echo "::error::Failed to discover districts from Toastmasters CSV."
              exit 1
            fi
            DISTRICT_COUNT=$(echo "${DISTRICTS}" | tr ',' '\n' | wc -l | tr -d ' ')
            echo "Discovered ${DISTRICT_COUNT} districts for PY ${DISCOVERED_PY} (fellBack=${DISCOVERED_FELLBACK}, reason=${DISCOVERED_REASON})"
          fi

          echo "districts=${DISTRICTS}" >> "$GITHUB_OUTPUT"
          echo "date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          # Carry the resolver's verdict to the rollover monitor (#1343). A
          # manual district override skips discovery, so default to 'unknown' —
          # the monitor alerts on anything it does not recognise rather than
          # assuming health.
          echo "program_year=${DISCOVERED_PY:-unknown}" >> "$GITHUB_OUTPUT"
          echo "rollover_reason=${DISCOVERED_REASON:-unknown}" >> "$GITHUB_OUTPUT"

          # Sync raw-csv cache for target date
          mkdir -p "./cache/raw-csv/${TARGET_DATE}"
          gsutil -m rsync -r \
            "gs://${GCS_BUCKET}/raw-csv/${TARGET_DATE}/" \
            "./cache/raw-csv/${TARGET_DATE}/" \
            2>&1 || echo "No existing raw-csv for ${TARGET_DATE} in GCS (first run)"

          echo "## ⏬ District Discovery & Raw CSV Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Districts**: ${DISTRICTS}" >> "$GITHUB_STEP_SUMMARY"
          FILE_COUNT=$(find "./cache/raw-csv/${TARGET_DATE}" -name '*.csv' 2>/dev/null | wc -l | tr -d ' ')
          echo "- **Date**: ${TARGET_DATE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **CSV files restored**: ${FILE_COUNT}" >> "$GITHUB_STEP_SUMMARY"

      # ── Daily Step 2: Scrape + Transform ──
      - name: '[daily] Scrape & Transform'
        if: steps.mode.outputs.mode == 'daily'
        id: daily-scrape
        env:
          TOASTMASTERS_DASHBOARD_URL: 'https://dashboards.toastmasters.org'
        run: |
          ARGS="--transform --verbose"
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.date }}"
          else
            ARGS="$ARGS --date $(date -u -d '1 day ago' +%Y-%m-%d)"
          fi
          DISTRICT_LIST="${{ steps.daily-config.outputs.districts }}"
          ARGS="$ARGS --districts ${DISTRICT_LIST}"
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          echo "Running: npx collector-cli scrape $ARGS"
          npx collector-cli scrape $ARGS | tee /tmp/scrape-output.json

          DATE=$(jq -r '.date' /tmp/scrape-output.json)
          # Snapshot date may differ from raw date after closing-period remap (#309)
          SNAPSHOT_DATE=$(jq -r '.snapshotDate // .date' /tmp/scrape-output.json)
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "snapshot_date=${SNAPSHOT_DATE}" >> "$GITHUB_OUTPUT"
          if [ "${DATE}" != "${SNAPSHOT_DATE}" ]; then
            echo "Closing period detected: raw date ${DATE} → snapshot ${SNAPSHOT_DATE}"
          fi

          echo "## 📥 Scrape Results" >> "$GITHUB_STEP_SUMMARY"
          SUCCEEDED=$(jq '.districts.succeeded' /tmp/scrape-output.json)
          FAILED=$(jq '.districts.failed' /tmp/scrape-output.json)
          echo "- **Date**: ${DATE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Districts succeeded**: ${SUCCEEDED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Districts failed**: ${FAILED}" >> "$GITHUB_STEP_SUMMARY"

      # ── Daily Step 3: Sync accumulated stores from GCS ──
      - name: '[daily] Sync time-series, club-trends, prev-year from GCS'
        if: steps.mode.outputs.mode == 'daily'
        run: |
          DATE="${{ steps.daily-scrape.outputs.date }}"

          # Time-series index (~344 KB)
          echo "Syncing time-series..."
          mkdir -p ./cache/time-series
          gsutil -m rsync -r "gs://${GCS_BUCKET}/time-series/" "./cache/time-series/" 2>&1 || true

          # Club-trends store (~50 KB/district)
          echo "Syncing club-trends..."
          mkdir -p ./cache/club-trends
          gsutil -m rsync -r "gs://${GCS_BUCKET}/club-trends/" "./cache/club-trends/" 2>&1 || true

          # District awards history store (~5 KB) (#333)
          echo "Syncing district-awards-history..."
          gcloud storage cp "gs://${GCS_BUCKET}/district-awards-history.json" \
            "./cache/district-awards-history.json" 2>/dev/null || true

          # Previous year snapshots for YoY comparison
          PREV_YEAR=$(date -d "${DATE} - 1 year" +%Y-%m-%d)
          echo "Syncing previous year snapshots (${PREV_YEAR})..."
          mkdir -p "./cache/snapshots/${PREV_YEAR}"
          gcloud storage cp "gs://${GCS_BUCKET}/snapshots/${PREV_YEAR}/district_*.json" \
            "./cache/snapshots/${PREV_YEAR}/" 2>/dev/null || true

          echo "## ⏬ Store Sync" >> "$GITHUB_STEP_SUMMARY"
          TS_COUNT=$(find ./cache/time-series -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          CT_COUNT=$(find ./cache/club-trends -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          PREV_COUNT=$(find "./cache/snapshots/${PREV_YEAR}" -name 'district_*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "- **Time-series files**: ${TS_COUNT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Club-trends files**: ${CT_COUNT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Prev-year snapshots**: ${PREV_COUNT}" >> "$GITHUB_STEP_SUMMARY"

      # ── Daily Step 3b: Find-A-Club enrichment fetch (#430) ──
      # Hits the public TI Find-A-Club Search endpoint per district and
      # writes raw JSON to ./cache/find-a-club/<date>/district_<id>.json.
      # Non-blocking — TI's endpoint is public/unauth'd and could change
      # or rate-limit at any time, so a failure here must NOT break the
      # daily snapshot. `--compare-snapshot-dir` surfaces the FAC-vs-
      # snapshot diff per district so we can watch for ATO/prospective
      # clubs (extraInFac > 0) and pipeline drift.
      # Snapshot merge + GCS upload are deliberate follow-up PRs after
      # we observe a week of clean runs.
      - name: '[daily] Fetch Find-A-Club enrichment'
        if: steps.mode.outputs.mode == 'daily'
        id: daily-fac-fetch
        continue-on-error: true
        run: |
          SNAPSHOT_DATE="${{ steps.daily-scrape.outputs.snapshot_date }}"
          if [ -z "${SNAPSHOT_DATE}" ]; then
            SNAPSHOT_DATE="${{ steps.daily-scrape.outputs.date }}"
          fi
          DISTRICT_LIST="${{ steps.daily-config.outputs.districts }}"
          ARGS="--districts ${DISTRICT_LIST} --include-undistricted --verbose"
          ARGS="$ARGS --date ${SNAPSHOT_DATE}"
          ARGS="$ARGS --compare-snapshot-dir ./cache/snapshots/${SNAPSHOT_DATE}"

          echo "Running: npx collector-cli fetch-find-a-club $ARGS"
          npx collector-cli fetch-find-a-club $ARGS | tee /tmp/fac-output.json

          echo "## 🔍 Find-A-Club Enrichment (#430)" >> "$GITHUB_STEP_SUMMARY"
          SUCCEEDED=$(jq -r '.succeeded' /tmp/fac-output.json)
          FAILED=$(jq -r '.failed' /tmp/fac-output.json)
          TOTAL_CLUBS=$(jq -r '.totalClubs' /tmp/fac-output.json)
          EXTRA_IN_FAC=$(jq -r '.compare.totalExtraInFac // "n/a"' /tmp/fac-output.json)
          SNAPSHOT_TOTAL=$(jq -r '.compare.totalSnapshotClubs // "n/a"' /tmp/fac-output.json)
          echo "- **Districts succeeded**: ${SUCCEEDED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Districts failed**: ${FAILED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **FAC clubs total**: ${TOTAL_CLUBS}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Snapshot clubs total**: ${SNAPSHOT_TOTAL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Extra in FAC** (ATO / prospective): ${EXTRA_IN_FAC}" >> "$GITHUB_STEP_SUMMARY"

          # Top 5 districts by extraInFac for quick visual scan.
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Top 5 districts by ATO/prospective surplus" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| District | FAC | Snapshot | Extra |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-----|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.results
            | map(select(.extraInFac != null))
            | sort_by(.extraInFac)
            | reverse
            | .[0:5][]
            | "| \(.districtId) | \(.clubCount) | \(.snapshotClubCount) | \(if .extraInFac > 0 then "+" else "" end)\(.extraInFac) |"' \
            /tmp/fac-output.json >> "$GITHUB_STEP_SUMMARY"

      # ── Daily Step 3c: Find-A-Club snapshot merge (#429) ──
      # Joins the raw FAC JSON written above into each district
      # snapshot (charterDate / coordinates / address / contact /
      # meeting fields). Idempotent — runs before Upload so the
      # published snapshots carry the enrichment. Non-blocking; a
      # merge failure must not stall the daily run because the
      # underlying snapshot is still valid without enrichment.
      # FAC-only clubs (ATOs / prospective — #489) are counted but
      # NOT merged into clubPerformance.
      - name: '[daily] Merge Find-A-Club into snapshots'
        if: steps.mode.outputs.mode == 'daily' && steps.daily-fac-fetch.outcome == 'success'
        id: daily-fac-merge
        continue-on-error: true
        run: |
          SNAPSHOT_DATE="${{ steps.daily-scrape.outputs.snapshot_date }}"
          if [ -z "${SNAPSHOT_DATE}" ]; then
            SNAPSHOT_DATE="${{ steps.daily-scrape.outputs.date }}"
          fi
          ARGS="--fac-dir ./cache/find-a-club/${SNAPSHOT_DATE}"
          ARGS="$ARGS --snapshot-dir ./cache/snapshots/${SNAPSHOT_DATE}"
          ARGS="$ARGS --verbose"

          echo "Running: npx collector-cli merge-find-a-club $ARGS"
          npx collector-cli merge-find-a-club $ARGS | tee /tmp/fac-merge-output.json

          echo "## 🔗 Find-A-Club Snapshot Merge (#429)" >> "$GITHUB_STEP_SUMMARY"
          MATCHED=$(jq -r '.totalMatched' /tmp/fac-merge-output.json)
          SNAP_ONLY=$(jq -r '.totalSnapshotOnly' /tmp/fac-merge-output.json)
          FAC_ONLY=$(jq -r '.totalFacOnly' /tmp/fac-merge-output.json)
          SUCCEEDED=$(jq -r '.succeeded' /tmp/fac-merge-output.json)
          FAILED=$(jq -r '.failed' /tmp/fac-merge-output.json)
          echo "- **Districts merged**: ${SUCCEEDED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Districts failed**: ${FAILED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Clubs enriched** (matched): ${MATCHED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Snapshot-only** (no FAC match — typically suspended; #490): ${SNAP_ONLY}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **FAC-only** (ATOs / prospective; #489): ${FAC_ONLY}" >> "$GITHUB_STEP_SUMMARY"

      # ── Daily Step 4: Compute Analytics ──
      - name: '[daily] Compute Analytics'
        if: steps.mode.outputs.mode == 'daily'
        run: |
          DATE="${{ steps.daily-scrape.outputs.date }}"
          if [ -z "${DATE}" ]; then
            DATE="${{ steps.daily-config.outputs.date }}"
            echo "::warning::Scrape step did not output a date; using config date: ${DATE}"
          fi
          DISTRICT_LIST="${{ steps.daily-config.outputs.districts }}"
          ARGS="--date ${DATE} --districts ${DISTRICT_LIST} --verbose"

          echo "Running: npx collector-cli compute-analytics $ARGS"
          npx collector-cli compute-analytics $ARGS | tee /tmp/analytics-output.json

          echo "## 📊 Analytics Results" >> "$GITHUB_STEP_SUMMARY"
          SUCCEEDED=$(jq '.districts.succeeded' /tmp/analytics-output.json)
          echo "- **Districts computed**: ${SUCCEEDED}" >> "$GITHUB_STEP_SUMMARY"

      # ── Daily Step 4.5: Snapshot schema gate (#1125) ──
      # The transform write path validates, but merge-find-a-club rewrites
      # snapshots in place WITHOUT re-validating — the exact path the #1096
      # FAC-enrichment drift took to prod. Validate the final on-disk files
      # against shared-contracts immediately before upload: fail-loud with
      # district + date, staging-side. Decision logic is unit-tested in
      # scripts/lib/__tests__/snapshotPublishGate.test.ts.
      - name: '[daily] Validate snapshots against shared contracts'
        if: steps.mode.outputs.mode == 'daily'
        run: |
          SNAPSHOT_DATE="${{ steps.daily-scrape.outputs.snapshot_date }}"
          if [ -z "${SNAPSHOT_DATE}" ]; then
            SNAPSHOT_DATE="${{ steps.daily-scrape.outputs.date }}"
          fi
          npx tsx scripts/validate-snapshots.ts "./cache/snapshots/${SNAPSHOT_DATE}"

      # ── Daily Step 5: Upload to GCS ──
      - name: '[daily] Upload to GCS'
        if: steps.mode.outputs.mode == 'daily'
        run: |
          DATE="${{ steps.daily-scrape.outputs.date }}"
          # Use the actual snapshot date (post closing-period remap) for snapshot upload (#309)
          SNAPSHOT_DATE="${{ steps.daily-scrape.outputs.snapshot_date }}"
          if [ -z "${SNAPSHOT_DATE}" ]; then
            SNAPSHOT_DATE="${DATE}"
          fi
          echo "Uploading daily data — raw=${DATE}, snapshot=${SNAPSHOT_DATE}"

          # Internal state: rsync (no CDN metadata needed)
          # raw-csv keyed by collection date (DATE), not snapshot date
          gsutil -m rsync -r "./cache/raw-csv/${DATE}/" "gs://${GCS_BUCKET}/raw-csv/${DATE}/"
          gsutil -m rsync -r "./cache/time-series/" "gs://${GCS_BUCKET}/time-series/"
          gsutil -m rsync -r "./cache/club-trends/" "gs://${GCS_BUCKET}/club-trends/"

          # District awards history (#333)
          if [ -f "./cache/district-awards-history.json" ]; then
            gcloud storage cp "./cache/district-awards-history.json" \
              "gs://${GCS_BUCKET}/district-awards-history.json"
          fi

          # Time-series: CDN-served overlay (mutable, short cache)
          # rsync above keeps internal state; `cp -r -Z` adds CDN headers + gzip
          # (parallelism is the default in `gcloud storage`, so `-m` has no equivalent).
          gcloud storage cp \
            --content-type="application/json" \
            --cache-control="public, max-age=3600" \
            -r -Z ./cache/time-series/* "gs://${GCS_BUCKET}/time-series/"

          # CDN-served: snapshots + analytics (immutable, gzipped)
          # Use SNAPSHOT_DATE for the actual snapshot directory (#309)
          gcloud storage cp \
            --content-type="application/json" \
            --cache-control="public, max-age=3600, must-revalidate" \
            -Z \
            "./cache/snapshots/${SNAPSHOT_DATE}"/*.json \
            "gs://${GCS_BUCKET}/snapshots/${SNAPSHOT_DATE}/"

          # Analytics subdirectory
          if [ -d "./cache/snapshots/${SNAPSHOT_DATE}/analytics" ]; then
            gcloud storage cp \
              --content-type="application/json" \
              --cache-control="public, max-age=3600, must-revalidate" \
              -Z \
              "./cache/snapshots/${SNAPSHOT_DATE}/analytics"/*.json \
              "gs://${GCS_BUCKET}/snapshots/${SNAPSHOT_DATE}/analytics/"
          fi

          echo "## ☁️ GCS Upload" >> "$GITHUB_STEP_SUMMARY"
          SNAPSHOT_COUNT=$(find "./cache/snapshots/${SNAPSHOT_DATE}" -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "- **Raw date**: ${DATE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Snapshot date**: ${SNAPSHOT_DATE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Snapshot/analytics files**: ${SNAPSHOT_COUNT}" >> "$GITHUB_STEP_SUMMARY"

      # ════════════════════════════════════════════════════════
      # CLOSING-DATE REGISTRY FRESHNESS (#1128, epic #1098)
      # The committed docs/month-end-closing-dates.json feeds historical
      # rescrapes and the rebuild's closing remap, and it went 3 months
      # stale with nothing watching (audit 2026-06-09 §9b). Compare it
      # against what raw-csv metadata proves and turn drift into a loud,
      # self-clearing `closing-registry-stale` issue. Decision logic is
      # unit-tested in scripts/lib/registryFreshness.ts; thin glue here.
      # Non-blocking by design: a stale doc file must not hold the data
      # publish hostage.
      # ════════════════════════════════════════════════════════
      - name: '[daily] Check closing-date registry freshness (#1128)'
        id: registrycheck
        if: steps.mode.outputs.mode == 'daily'
        # Non-blocking even on a module-load crash: the publish/promotion
        # steps that follow must never be skipped because a doc-file monitor
        # broke. On a crashed step both stale outputs are unset, so neither
        # alert step fires.
        continue-on-error: true
        run: npx tsx scripts/closing-registry-check.ts

      # ════════════════════════════════════════════════════════
      # PROGRAM-YEAR ROLLOVER ALERT (#1343, follows #1342)
      # The resolver's fallback to the prior program year is correct and
      # self-healing — and was entirely silent. That silence let #1342 (TI
      # moving the export URL) run for a month behind a green pipeline. Turn
      # a persistent fallback, and ANY upstream error, into a loud
      # self-clearing issue. Decision logic is unit-tested in
      # scripts/lib/rolloverAlert.ts; these steps are thin glue.
      # ════════════════════════════════════════════════════════
      - name: '[daily] Evaluate program-year rollover (#1343)'
        id: rollover
        if: steps.mode.outputs.mode == 'daily' && steps.daily-config.outputs.rollover_reason != 'skipped'
        # Non-blocking: a monitor must never take down the pipeline it watches.
        # The script itself fails loud (alert=true) rather than silent.
        continue-on-error: true
        env:
          ROLLOVER_REASON: ${{ steps.daily-config.outputs.rollover_reason }}
          ROLLOVER_PROGRAM_YEAR: ${{ steps.daily-config.outputs.program_year }}
          TARGET_DATE: ${{ steps.daily-config.outputs.date }}
        run: npx tsx scripts/rollover-alert.ts

      - name: '[daily] Ensure program-year-rollover-overdue label exists'
        if: steps.rollover.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create program-year-rollover-overdue \
            --color B60205 \
            --description "Collector is still falling back to the prior program year" \
            2>/dev/null || echo "Label already exists"

      - name: '[daily] File or refresh program-year-rollover-overdue issue'
        if: steps.rollover.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Env indirection: the summary embeds resolver output — never splice
          # it into shell text via ${{ }}.
          ALERT_SUMMARY: ${{ steps.rollover.outputs.summary }}
          ALERT_PY: ${{ steps.daily-config.outputs.program_year }}
          ALERT_REASON: ${{ steps.daily-config.outputs.rollover_reason }}
          ALERT_DAYS: ${{ steps.rollover.outputs.days }}
          ALERT_DATE: ${{ steps.daily-config.outputs.date }}
        run: |
          {
            echo "The collector is **not** scraping the calendar program year."
            echo
            echo "${ALERT_SUMMARY}"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| target date | \`${ALERT_DATE}\` |"
            echo "| scraping | \`${ALERT_PY}\` |"
            echo "| reason | \`${ALERT_REASON}\` |"
            echo "| days into program year | ${ALERT_DAYS} |"
            echo
            echo "\`upstream-error\` means the dashboard fetch **threw** — that never"
            echo "self-heals and needs a human. \`not-published\` past the grace window"
            echo "means TI's rollover is genuinely late, or our fetch path has moved"
            echo "again (cf. #1342)."
            echo
            echo "Verify directly:"
            echo '```bash'
            echo "npx collector-cli discover-districts --date ${ALERT_DATE} --verbose"
            echo '```'
            echo
            echo "This issue self-clears on the next daily run that resolves the"
            echo "calendar program year (#1343)."
          } > /tmp/rollover-alert.md

          EXISTING=$(gh issue list --label program-year-rollover-overdue --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            echo "Existing open alert #${EXISTING} — adding a refresh comment."
            gh issue comment "${EXISTING}" --body-file /tmp/rollover-alert.md
          else
            echo "No open alert — creating one."
            gh issue create \
              --title "🟥 program year not rolling over — scraping ${ALERT_PY} (${ALERT_REASON})" \
              --label program-year-rollover-overdue \
              --body-file /tmp/rollover-alert.md
          fi

      - name: '[daily] Auto-close program-year-rollover-overdue when resolved'
        if: steps.rollover.outputs.should_close == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The calendar program year resolved — the rollover completed. The
          # `concurrency: data-pipeline` group serializes runs, so a resolved
          # verdict can't race a concurrent falling-back one.
          OPEN=$(gh issue list --label program-year-rollover-overdue --state open \
            --json number --jq '.[].number')
          if [ -z "${OPEN}" ]; then
            echo "No open rollover alert to close."
          else
            for n in ${OPEN}; do
              echo "Closing rollover alert #${n} — program year resolved."
              gh issue close "${n}" \
                --comment "✅ The collector resolved the calendar program year; the rollover completed. Auto-closing (#1343)." \
                --reason completed
            done
          fi

      # #1419: gated on remediation == 'manual', NOT on stale == 'true'.
      # A stale-but-derivable registry is fixed by the `closing-registry-pr`
      # job instead of nagging a human daily. The blind/crashed cases still
      # land here and are exactly as loud as before (L107).
      - name: '[daily] Ensure closing-registry-stale label exists'
        if: steps.mode.outputs.mode == 'daily' && steps.registrycheck.outputs.remediation == 'manual'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create closing-registry-stale \
            --color B60205 \
            --description "docs/month-end-closing-dates.json is behind raw-csv metadata" \
            2>/dev/null || echo "Label already exists"

      - name: '[daily] File or refresh closing-registry-stale issue'
        if: steps.mode.outputs.mode == 'daily' && steps.registrycheck.outputs.remediation == 'manual'
        env:
          GH_TOKEN: ${{ github.token }}
          # Env indirection: the title embeds dataMonth strings read from GCS
          # metadata — never splice them into shell text via ${{ }}.
          ALERT_TITLE: ${{ steps.registrycheck.outputs.title }}
          ALERT_BODY_FILE: ${{ steps.registrycheck.outputs.body_file }}
        run: |
          # Deduplicate: one open alert at a time; refresh instead of spamming.
          EXISTING=$(gh issue list --label closing-registry-stale --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            echo "Existing open alert #${EXISTING} — adding a refresh comment."
            gh issue comment "${EXISTING}" --body-file "${ALERT_BODY_FILE}"
          else
            echo "No open alert — creating one."
            gh issue create \
              --title "${ALERT_TITLE}" \
              --label closing-registry-stale \
              --body-file "${ALERT_BODY_FILE}"
          fi

      - name: '[daily] Auto-close closing-registry-stale issue when fresh'
        if: steps.mode.outputs.mode == 'daily' && steps.registrycheck.outputs.stale == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Registry is fresh again — the committed fix landed. Close any open
          # alert; the `concurrency: data-pipeline` group serializes runs, so
          # a fresh verdict can't race a concurrent stale one.
          OPEN=$(gh issue list --label closing-registry-stale --state open \
            --json number --jq '.[].number')
          if [ -z "${OPEN}" ]; then
            echo "No open closing-registry-stale issue to close."
          else
            for n in ${OPEN}; do
              echo "Closing closing-registry-stale issue #${n} — registry fresh."
              gh issue close "${n}" \
                --comment "✅ The closing-date registry matches raw-csv metadata again. Auto-closing (#1128)." \
                --reason completed
            done
          fi

      # ════════════════════════════════════════════════════════
      # REBUILD MODE
      # ════════════════════════════════════════════════════════
      # Streams one date at a time to stay within runner disk
      # limits (~14 GB free). Each iteration: download raw-csv →
      # transform → compute → upload → cleanup.
      # Time-series + club-trends persist across iterations (small).

      # ── Rebuild Step 1: Sync small stores from GCS ──
      - name: '[rebuild] Sync time-series and club-trends from GCS'
        if: steps.mode.outputs.mode == 'rebuild'
        run: |
          # These are small (~344 KB + ~50 KB/district) and persist across dates
          echo "Syncing time-series..."
          mkdir -p ./cache/time-series
          gsutil -m rsync -r "gs://${GCS_BUCKET}/time-series/" "./cache/time-series/" 2>&1 || true

          echo "Syncing club-trends..."
          mkdir -p ./cache/club-trends
          gsutil -m rsync -r "gs://${GCS_BUCKET}/club-trends/" "./cache/club-trends/" 2>&1 || true

          # District awards history store (#333)
          echo "Syncing district-awards-history..."
          gcloud storage cp "gs://${GCS_BUCKET}/district-awards-history.json" \
            "./cache/district-awards-history.json" 2>/dev/null || true

          echo "## ⏬ Store Sync (rebuild)" >> "$GITHUB_STEP_SUMMARY"
          TS_COUNT=$(find ./cache/time-series -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          CT_COUNT=$(find ./cache/club-trends -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "- **Time-series files**: ${TS_COUNT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Club-trends files**: ${CT_COUNT}" >> "$GITHUB_STEP_SUMMARY"

      # ── Rebuild Step 2: Discover dates, then stream one-at-a-time ──
      - name: '[rebuild] Stream rebuild — one date at a time'
        if: steps.mode.outputs.mode == 'rebuild'
        run: |
          # Determine which dates to rebuild
          if [ -n "${{ inputs.dates }}" ]; then
            DATES=$(echo "${{ inputs.dates }}" | tr ',' '\n' | sort)
            echo "Rebuilding specific dates: ${{ inputs.dates }}"
          else
            # Discover all dates from GCS raw-csv/
            DATES=$(gcloud storage ls "gs://${GCS_BUCKET}/raw-csv/" | grep -oP '\d{4}-\d{2}-\d{2}' | sort -u)
            echo "Discovered dates from GCS raw-csv/"
          fi

          DATE_COUNT=$(echo "${DATES}" | wc -l | tr -d ' ')
          echo "Total dates to rebuild: ${DATE_COUNT}"
          echo "## 🔨 Rebuild (streaming)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dates to process**: ${DATE_COUNT}" >> "$GITHUB_STEP_SUMMARY"

          SUCCEEDED=0
          FAILED=0
          INDEX=0

          for DATE in ${DATES}; do
            INDEX=$((INDEX + 1))
            echo ""
            echo "═══════════════════════════════════════"
            echo "[${INDEX}/${DATE_COUNT}] Processing ${DATE}"
            echo "═══════════════════════════════════════"

            # 1. Download this date's raw-csv from GCS
            mkdir -p "./cache/raw-csv/${DATE}"
            gsutil -m rsync -r \
              "gs://${GCS_BUCKET}/raw-csv/${DATE}/" \
              "./cache/raw-csv/${DATE}/" 2>&1 || true

            # 2. Download previous-year snapshot for YoY (if needed)
            PREV_YEAR_DATE=$(date -d "${DATE} - 1 year" +%Y-%m-%d 2>/dev/null || echo "")
            if [ -n "${PREV_YEAR_DATE}" ] && [ ! -d "./cache/snapshots/${PREV_YEAR_DATE}" ]; then
              mkdir -p "./cache/snapshots/${PREV_YEAR_DATE}"
              gcloud storage cp \
                "gs://${GCS_BUCKET}/snapshots/${PREV_YEAR_DATE}/district_*.json" \
                "./cache/snapshots/${PREV_YEAR_DATE}/" 2>/dev/null || true
            fi

            # 3. Snapshot existing dirs before transform (#193)
            BEFORE_DIRS=$(ls -d ./cache/snapshots/????-??-?? 2>/dev/null | sort || true)

            # 4. Transform raw-csv → snapshots
            echo "Transforming ${DATE}..."
            if ! npx collector-cli transform --date "${DATE}" --force --verbose 2>&1; then
              echo "::warning::Transform failed for ${DATE}"
              FAILED=$((FAILED + 1))
              rm -rf "./cache/raw-csv/${DATE}"
              continue
            fi

            # 5. Detect actual snapshot date (#193)
            # The transformer remaps dates via the CSV "As of" header, so the
            # snapshot directory may differ from the raw-csv date.
            AFTER_DIRS=$(ls -d ./cache/snapshots/????-??-?? 2>/dev/null | sort || true)
            ACTUAL_DATE=$(comm -13 <(echo "$BEFORE_DIRS") <(echo "$AFTER_DIRS") \
                          | head -1 | grep -oP '\d{4}-\d{2}-\d{2}' || true)
            ACTUAL_DATE="${ACTUAL_DATE:-$DATE}"
            if [ "$ACTUAL_DATE" != "$DATE" ]; then
              echo "Date remapped: ${DATE} → ${ACTUAL_DATE}"
            fi

            # 6. Compute analytics (using actual snapshot date)
            echo "Computing analytics for ${ACTUAL_DATE}..."
            if ! npx collector-cli compute-analytics --date "${ACTUAL_DATE}" --force-analytics --verbose 2>&1; then
              echo "::warning::Compute failed for ${ACTUAL_DATE}"
              FAILED=$((FAILED + 1))
              # Still upload whatever snapshots were generated
            fi

            # 7. Upload this date's snapshots + analytics to GCS
            SNAPSHOT_DIR="./cache/snapshots/${ACTUAL_DATE}"
            if [ -d "${SNAPSHOT_DIR}" ]; then
              FILE_COUNT=$(find "${SNAPSHOT_DIR}" -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
              echo "Uploading snapshots/${ACTUAL_DATE}/ (${FILE_COUNT} files)..."
              gcloud storage cp \
                --content-type="application/json" \
                --cache-control="public, max-age=3600, must-revalidate" \
                -Z \
                "${SNAPSHOT_DIR}"/*.json \
                "gs://${GCS_BUCKET}/snapshots/${ACTUAL_DATE}/"

              if [ -d "${SNAPSHOT_DIR}/analytics" ]; then
                gcloud storage cp \
                  --content-type="application/json" \
                  --cache-control="public, max-age=3600, must-revalidate" \
                  -Z \
                  "${SNAPSHOT_DIR}/analytics"/*.json \
                  "gs://${GCS_BUCKET}/snapshots/${ACTUAL_DATE}/analytics/"
              fi
              SUCCEEDED=$((SUCCEEDED + 1))
            else
              echo "::warning::No snapshot directory found for ${DATE} (expected ${ACTUAL_DATE})"
            fi

            # 8. Cleanup to free disk (keep time-series + club-trends)
            # Also remove previous-year snapshot dir to prevent orphan dirs
            # from polluting LATEST_DATE resolution (#295)
            rm -rf "./cache/raw-csv/${DATE}" "./cache/snapshots/${ACTUAL_DATE}" \
              ${PREV_YEAR_DATE:+"./cache/snapshots/${PREV_YEAR_DATE}"}

            # Report disk usage every 10 dates
            if [ $((INDEX % 10)) -eq 0 ]; then
              echo "Disk usage after ${INDEX} dates: $(df -h . | tail -1 | awk '{print $3 " used / " $4 " free"}')"
            fi
          done

          # Sync accumulated stores back to GCS
          echo "Syncing time-series and club-trends back to GCS..."
          gsutil -m rsync -r "./cache/time-series/" "gs://${GCS_BUCKET}/time-series/"
          gsutil -m rsync -r "./cache/club-trends/" "gs://${GCS_BUCKET}/club-trends/"

          # District awards history (#333)
          if [ -f "./cache/district-awards-history.json" ]; then
            echo "Syncing district-awards-history back to GCS..."
            gcloud storage cp "./cache/district-awards-history.json" \
              "gs://${GCS_BUCKET}/district-awards-history.json"
          fi

          # Time-series: CDN-served overlay (mutable, short cache)
          echo "Uploading time-series with CDN headers..."
          gcloud storage cp \
            --content-type="application/json" \
            --cache-control="public, max-age=3600" \
            -r -Z ./cache/time-series/* "gs://${GCS_BUCKET}/time-series/"

          echo "- **Dates succeeded**: ${SUCCEEDED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dates failed**: ${FAILED}" >> "$GITHUB_STEP_SUMMARY"

          if [ "${FAILED}" -gt 0 ]; then
            echo "::warning::${FAILED} dates failed during rebuild"
          fi

      # ════════════════════════════════════════════════════════
      # BACKFILL GLOBAL TOTALS MODE (#1498, epic #1496)
      # ════════════════════════════════════════════════════════
      # The daily `compute-analytics` step writes global-totals.json
      # from now on. Historical dates will never be recomputed, so
      # this dispatch builds the same artifact for the dates the
      # 5-year worldwide history (Sprint 3) reads.
      #
      # Streams ONE date at a time and deletes each after upload:
      # a year-end snapshot directory is ~500 MB and the runner has
      # ~14 GB free (the same constraint the rebuild mode streams for).
      #
      # Source is PRODUCTION — that is where the archive lives; staging
      # only carries recent dates. Output goes to STAGING with the same
      # CDN headers the snapshots get, and reaches production through
      # the ordinary gated promotion at the end of this job. The value
      # gate reads all-districts-rankings.json only, which this mode
      # never writes, so an additive file cannot trip it.
      - name: '[backfill] Build global-totals.json one date at a time'
        if: steps.mode.outputs.mode == 'backfill-global-totals'
        run: |
          set -uo pipefail

          # The required minimum set (#1498): five program-year ends, which
          # the year-over-year history needs, plus five March 31s, which are
          # the TI-comparable membership dates.
          DEFAULT_DATES="2022-06-30 2023-06-30 2024-06-30 2025-06-30 2026-06-30 2022-03-31 2023-03-31 2024-03-31 2025-03-31 2026-03-31"
          if [ -n "${{ inputs.dates }}" ]; then
            DATES=$(echo "${{ inputs.dates }}" | tr ',' '\n' | tr -d ' ' | sort -u)
          else
            DATES=$(echo "${DEFAULT_DATES}" | tr ' ' '\n' | sort -u)
          fi

          DATE_COUNT=$(echo "${DATES}" | grep -c . || echo 0)
          echo "## 🌍 Worldwide rollup backfill (#1498)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dates to build**: ${DATE_COUNT}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Date | Districts | Clubs | Payments | Members | Excluded | Dup clubs |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          SUCCEEDED=0
          FAILED=0

          for DATE in ${DATES}; do
            echo "═══ ${DATE} ═══"
            SNAPSHOT_DIR="./cache/snapshots/${DATE}"
            mkdir -p "${SNAPSHOT_DIR}"

            # R2: the runner starts empty. Pull exactly what the rollup reads
            # — the district files and the date's OWN district set.
            gcloud storage cp \
              "gs://${GCS_BUCKET_PRODUCTION}/snapshots/${DATE}/all-districts-rankings.json" \
              "${SNAPSHOT_DIR}/" 2>/dev/null || true
            gcloud storage cp \
              "gs://${GCS_BUCKET_PRODUCTION}/snapshots/${DATE}/district_*.json" \
              "${SNAPSHOT_DIR}/" 2>/dev/null || true

            if [ ! -f "${SNAPSHOT_DIR}/all-districts-rankings.json" ]; then
              echo "::warning::${DATE} has no all-districts-rankings.json — skipping (no district set to scope to)"
              echo "| ${DATE} | — | — | — | — | — | skipped: no rankings file |" >> "$GITHUB_STEP_SUMMARY"
              FAILED=$((FAILED + 1))
              rm -rf "${SNAPSHOT_DIR}"
              continue
            fi

            if npx tsx scripts/build-global-totals.ts \
                 --snapshot-dir "${SNAPSHOT_DIR}" --date "${DATE}" \
                 > /tmp/global-totals-summary.json; then
              # Same CDN headers as every other published snapshot object.
              gcloud storage cp \
                --content-type="application/json" \
                --cache-control="public, max-age=3600, must-revalidate" \
                -Z \
                "${SNAPSHOT_DIR}/global-totals.json" \
                "gs://${GCS_BUCKET}/snapshots/${DATE}/global-totals.json"

              ROW=$(jq -r '"| \(.date) | \(.districts) | \(.clubs) | \(.payments) | \(.membership) | \(.excludedDistricts) | \(.duplicateClubs) |"' \
                    /tmp/global-totals-summary.json)
              echo "${ROW}" >> "$GITHUB_STEP_SUMMARY"
              SUCCEEDED=$((SUCCEEDED + 1))
            else
              echo "::warning::Rollup build failed for ${DATE}"
              echo "| ${DATE} | — | — | — | — | — | build failed |" >> "$GITHUB_STEP_SUMMARY"
              FAILED=$((FAILED + 1))
            fi

            # Free the ~500 MB before the next date.
            rm -rf "${SNAPSHOT_DIR}"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dates succeeded**: ${SUCCEEDED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dates failed**: ${FAILED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Uploaded to \`${GCS_BUCKET}\`; the promotion step below carries it to production." >> "$GITHUB_STEP_SUMMARY"

          if [ "${SUCCEEDED}" -eq 0 ]; then
            echo "::error::No dates were backfilled"
            exit 1
          fi

      # ════════════════════════════════════════════════════════
      # RESCRAPE MODE
      # ════════════════════════════════════════════════════════
      # Re-collects CSVs from the Toastmasters dashboard for
      # specified dates (or generates monthly dates from a
      # program year). Then transforms, computes, and uploads.

      # ── Rescrape Step 1: Sync small stores from GCS ──
      - name: '[rescrape] Sync time-series and club-trends from GCS'
        if: steps.mode.outputs.mode == 'rescrape'
        run: |
          mkdir -p ./cache/time-series ./cache/club-trends
          gsutil -m rsync -r "gs://${GCS_BUCKET}/time-series/" "./cache/time-series/" 2>&1 || true
          gsutil -m rsync -r "gs://${GCS_BUCKET}/club-trends/" "./cache/club-trends/" 2>&1 || true

          # District awards history store (~5 KB) (#1111): pull before push, or
          # the end-of-run push back (DistrictAwardsHistoryStore starts empty
          # when absent) clobbers the accumulated multi-PY GCS store with a
          # single-PY partial. Mirrors the daily/rebuild sync steps.
          echo "Syncing district-awards-history..."
          gcloud storage cp "gs://${GCS_BUCKET}/district-awards-history.json" \
            "./cache/district-awards-history.json" 2>/dev/null || true

          echo "## ⏬ Store Sync (rescrape)" >> "$GITHUB_STEP_SUMMARY"

      # ── Rescrape Step 2: Scrape → transform → compute → upload ──
      - name: '[rescrape] Re-collect and process dates'
        if: steps.mode.outputs.mode == 'rescrape'
        run: |
          # Determine dates to rescrape
          if [ -n "${{ inputs.dates }}" ]; then
            DATES=$(echo "${{ inputs.dates }}" | tr ',' ' ')
          elif [ -n "${{ inputs.program_year }}" ]; then
            # Generate monthly dates for the program year
            PY="${{ inputs.program_year }}"
            START_YEAR=$(echo "$PY" | cut -d'-' -f1)
            DATES=$(node -e "
              const sy = parseInt('${START_YEAR}', 10);
              const dates = [];
              // Jul through Dec of start year, Jan through Jun of end year
              for (let m = 6; m < 18; m++) {
                const year = sy + Math.floor(m / 12);
                const month = m % 12;
                // Use the 15th of each month as a representative date
                const d = new Date(year, month, 15);
                dates.push(d.toISOString().split('T')[0]);
              }
              process.stdout.write(dates.join(' '));
            ")
            echo "Generated dates from program year ${PY}: ${DATES}"
          else
            echo "::error::rescrape mode requires either 'dates' or 'program_year' input"
            exit 1
          fi

          DATE_COUNT=$(echo "$DATES" | wc -w | tr -d ' ')
          echo "## 🔄 Rescrape" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dates to rescrape**: ${DATE_COUNT}" >> "$GITHUB_STEP_SUMMARY"
          echo "Rescraping ${DATE_COUNT} dates..."

          # Discover districts (same approach as daily mode)
          if [ -n "${{ inputs.districts }}" ]; then
            DISTRICTS="${{ inputs.districts }}"
            echo "Using manual district override: ${DISTRICTS}"
          else
            # Use the first date to discover districts, resolving the active
            # program year by data (#1284) — falls back to the prior PY at the
            # July rollover when the new year's dashboard isn't published yet.
            FIRST_DATE=$(echo "$DATES" | awk '{print $1}')
            echo "Discovering districts for ${FIRST_DATE}..."
            set +e
            DISCOVERY_JSON=$(npx collector-cli discover-districts --date "${FIRST_DATE}" --verbose)
            DISCOVERY_STATUS=$?
            set -e
            if [ ${DISCOVERY_STATUS} -ne 0 ]; then
              echo "::error::Failed to discover districts from Toastmasters CSV (exit ${DISCOVERY_STATUS})."
              echo "${DISCOVERY_JSON}"
              exit 1
            fi
            DISTRICTS=$(echo "${DISCOVERY_JSON}" | jq -r '.districts')
            DISCOVERED_PY=$(echo "${DISCOVERY_JSON}" | jq -r '.programYear')

            if [ -z "${DISTRICTS}" ] || [ "${DISTRICTS}" = "null" ]; then
              echo "::error::Failed to discover districts from Toastmasters CSV."
              exit 1
            fi
            DISTRICT_COUNT=$(echo "${DISTRICTS}" | tr ',' '\n' | wc -l | tr -d ' ')
            echo "Discovered ${DISTRICT_COUNT} districts for PY ${DISCOVERED_PY}"
          fi
          echo "- **Districts**: $(echo "${DISTRICTS}" | tr ',' '\n' | wc -l | tr -d ' ')" >> "$GITHUB_STEP_SUMMARY"

          SUCCEEDED=0
          FAILED=0
          INDEX=0

          for DATE in ${DATES}; do
            INDEX=$((INDEX + 1))
            echo ""
            echo "═══════════════════════════════════════"
            echo "[${INDEX}/${DATE_COUNT}] Rescraping ${DATE}"
            echo "═══════════════════════════════════════"

            # 1. Snapshot existing dirs before scrape+transform
            BEFORE_DIRS=$(ls -d ./cache/snapshots/????-??-?? 2>/dev/null | sort || true)

            # 2. Scrape from dashboard + transform in one step
            echo "Scraping and transforming ${DATE}..."
            SCRAPE_ARGS="--date ${DATE} --transform --force --verbose --districts ${DISTRICTS}"
            if ! npx collector-cli scrape ${SCRAPE_ARGS} 2>&1; then
              echo "::warning::Scrape/transform failed for ${DATE}"
              FAILED=$((FAILED + 1))
              continue
            fi

            # 3. Detect actual snapshot date (same as rebuild #193)
            AFTER_DIRS=$(ls -d ./cache/snapshots/????-??-?? 2>/dev/null | sort || true)
            ACTUAL_DATE=$(comm -13 <(echo "$BEFORE_DIRS") <(echo "$AFTER_DIRS") \
                          | head -1 | grep -oP '\d{4}-\d{2}-\d{2}' || true)
            ACTUAL_DATE="${ACTUAL_DATE:-$DATE}"
            if [ "$ACTUAL_DATE" != "$DATE" ]; then
              echo "Date remapped: ${DATE} → ${ACTUAL_DATE}"
            fi

            # 4. Compute analytics
            echo "Computing analytics for ${ACTUAL_DATE}..."
            if ! npx collector-cli compute-analytics --date "${ACTUAL_DATE}" --force-analytics --verbose 2>&1; then
              echo "::warning::Compute failed for ${ACTUAL_DATE}"
              FAILED=$((FAILED + 1))
            fi

            # 5. Upload snapshots + analytics to GCS
            SNAPSHOT_DIR="./cache/snapshots/${ACTUAL_DATE}"
            if [ -d "${SNAPSHOT_DIR}" ]; then
              FILE_COUNT=$(find "${SNAPSHOT_DIR}" -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
              echo "Uploading snapshots/${ACTUAL_DATE}/ (${FILE_COUNT} files)..."
              gcloud storage cp \
                --content-type="application/json" \
                --cache-control="public, max-age=3600, must-revalidate" \
                -Z \
                "${SNAPSHOT_DIR}"/*.json \
                "gs://${GCS_BUCKET}/snapshots/${ACTUAL_DATE}/"

              if [ -d "${SNAPSHOT_DIR}/analytics" ]; then
                gcloud storage cp \
                  --content-type="application/json" \
                  --cache-control="public, max-age=3600, must-revalidate" \
                  -Z \
                  "${SNAPSHOT_DIR}/analytics"/*.json \
                  "gs://${GCS_BUCKET}/snapshots/${ACTUAL_DATE}/analytics/"
              fi
              SUCCEEDED=$((SUCCEEDED + 1))
            else
              echo "::warning::No snapshot directory found for ${DATE} (expected ${ACTUAL_DATE})"
            fi

            # 6. Upload raw-csv to GCS (replace old corrupt data)
            RAW_CSV_DIR="./cache/raw-csv/${DATE}"
            if [ -d "${RAW_CSV_DIR}" ]; then
              echo "Uploading raw-csv/${DATE}/..."
              gsutil -m rsync -r "${RAW_CSV_DIR}/" "gs://${GCS_BUCKET}/raw-csv/${DATE}/"
            fi

            # 7. Cleanup to free disk
            rm -rf "./cache/raw-csv/${DATE}" "./cache/snapshots/${ACTUAL_DATE}"

            if [ $((INDEX % 5)) -eq 0 ]; then
              echo "Disk usage after ${INDEX} dates: $(df -h . | tail -1 | awk '{print $3 " used / " $4 " free"}')"
            fi
          done

          # Sync accumulated stores back to GCS
          echo "Syncing time-series and club-trends back to GCS..."
          gsutil -m rsync -r "./cache/time-series/" "gs://${GCS_BUCKET}/time-series/"
          gsutil -m rsync -r "./cache/club-trends/" "gs://${GCS_BUCKET}/club-trends/"


          # District awards history (#333)
          if [ -f "./cache/district-awards-history.json" ]; then
            echo "Syncing district-awards-history back to GCS..."
            gcloud storage cp "./cache/district-awards-history.json" \
              "gs://${GCS_BUCKET}/district-awards-history.json"
          fi
          # Time-series: CDN-served overlay (mutable, short cache)
          echo "Uploading time-series with CDN headers..."
          gcloud storage cp \
            --content-type="application/json" \
            --cache-control="public, max-age=3600" \
            -r -Z ./cache/time-series/* "gs://${GCS_BUCKET}/time-series/"

          echo "- **Dates succeeded**: ${SUCCEEDED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dates failed**: ${FAILED}" >> "$GITHUB_STEP_SUMMARY"

          if [ "${FAILED}" -gt 0 ]; then
            echo "::warning::${FAILED} dates failed during rescrape"
          fi

      # ════════════════════════════════════════════════════════
      # RESCRAPE-HISTORICAL MODE (#205)
      # One-time: re-download ALL historical CSVs from the dashboard
      # using the 4-segment URL format, then rebuild everything.
      # ════════════════════════════════════════════════════════

      - name: '[rescrape-historical] Download historical CSVs'
        if: steps.mode.outputs.mode == 'rescrape-historical'
        run: |
          echo "## 📥 Historical Rescrape (#205)" >> "$GITHUB_STEP_SUMMARY"

          # Clean slate — remove any old raw-csv data so rebuild has no stale dirs
          echo "Cleaning cache/raw-csv for a fresh start..."
          rm -rf ./cache/raw-csv
          mkdir -p ./cache/raw-csv

          echo "Downloading month-specific CSVs using 4-segment URL format..."

          YEAR_FLAG=""
          if [ -n "${{ inputs.program_year }}" ]; then
            YEAR_FLAG="--year ${{ inputs.program_year }}"
            echo "- **Program year filter**: ${{ inputs.program_year }}" >> "$GITHUB_STEP_SUMMARY"
          fi

          npx tsx scripts/rescrape-historical.ts \
            --execute \
            --cache-dir ./cache \
            --rate 8 \
            ${YEAR_FLAG}

          DATE_COUNT=$(find ./cache/raw-csv -maxdepth 1 -type d -name '????-??-??' | wc -l | tr -d ' ')
          echo "- **Raw-csv dates downloaded**: ${DATE_COUNT}" >> "$GITHUB_STEP_SUMMARY"

      - name: '[rescrape-historical] Rebuild from fresh CSVs'
        if: steps.mode.outputs.mode == 'rescrape-historical'
        run: |
          echo "Rebuilding all derived data from fresh CSVs..."
          npx collector-cli rebuild --verbose

      - name: '[rescrape-historical] Nuke stale GCS data'
        if: steps.mode.outputs.mode == 'rescrape-historical' && inputs.program_year == ''
        run: |
          echo "## 🗑️ GCS Cleanup (pre-upload, full rescrape only)" >> "$GITHUB_STEP_SUMMARY"
          echo "Deleting stale time-series from GCS..."
          gcloud storage rm -r "gs://${GCS_BUCKET}/time-series/" 2>&1 || echo "(no time-series to delete)"
          echo "Deleting stale snapshots from GCS..."
          gcloud storage rm -r "gs://${GCS_BUCKET}/snapshots/" 2>&1 || echo "(no snapshots to delete)"
          echo "Deleting stale club-trends from GCS..."
          gcloud storage rm -r "gs://${GCS_BUCKET}/club-trends/" 2>&1 || echo "(no club-trends to delete)"
          echo "- **Stale GCS data deleted** ✓" >> "$GITHUB_STEP_SUMMARY"

      - name: '[rescrape-historical] Upload rebuilt data to GCS'
        if: steps.mode.outputs.mode == 'rescrape-historical'
        run: |
          echo "## ⬆️ Upload Fresh Data" >> "$GITHUB_STEP_SUMMARY"

          # Upload snapshots with immutable CDN headers
          echo "Uploading snapshots..."
          gcloud storage cp \
            --content-type="application/json" \
            --cache-control="public, max-age=3600, must-revalidate" \
            -r -Z ./cache/snapshots/* "gs://${GCS_BUCKET}/snapshots/"

          # Upload time-series with short cache
          echo "Uploading time-series..."
          gcloud storage cp \
            --content-type="application/json" \
            --cache-control="public, max-age=3600" \
            -r -Z ./cache/time-series/* "gs://${GCS_BUCKET}/time-series/"

          # Upload club-trends
          echo "Uploading club-trends..."
          gcloud storage cp \
            --content-type="application/json" \
            --cache-control="public, max-age=3600" \
            -r -Z ./cache/club-trends/* "gs://${GCS_BUCKET}/club-trends/"

          # Upload raw-csv
          echo "Uploading raw-csv..."
          gsutil -m rsync -r "./cache/raw-csv/" "gs://${GCS_BUCKET}/raw-csv/"

          SNAP_COUNT=$(find ./cache/snapshots -maxdepth 1 -type d -name '????-??-??' | wc -l | tr -d ' ')
          TS_COUNT=$(find ./cache/time-series -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "- **Snapshots uploaded**: ${SNAP_COUNT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Time-series files**: ${TS_COUNT}" >> "$GITHUB_STEP_SUMMARY"

      # ════════════════════════════════════════════════════════
      # PRUNE MODE
      # ════════════════════════════════════════════════════════

      # ── Prune Step 1: Skeleton sync from GCS (#1175) ──
      # Classification needs only the raw-csv date-dir SET plus each date's
      # metadata.json; the previous full-content rsync outgrew the runner's
      # disk after #1147 (run 27393189818: No space left on device). The
      # skeleton sync materializes EVERY date dir from the listing first —
      # a metadata-less dir must stay VISIBLE for the #1131 protection —
      # then overlays metadata.json files only.
      - name: '[prune] Skeleton sync from GCS (listings + metadata.json)'
        if: steps.mode.outputs.mode == 'prune'
        run: |
          echo "Skeleton sync from GCS for pruning (listings + metadata.json only)..."
          mkdir -p ./cache/raw-csv ./cache/snapshots

          gcloud storage ls "gs://${GCS_BUCKET}/raw-csv/" > /tmp/prune-raw-listing.txt
          gcloud storage ls "gs://${GCS_BUCKET}/snapshots/" > /tmp/prune-snapshot-listing.txt

          # Materialize ALL date dirs (fails closed on a zero-date raw-csv
          # listing — classifying an empty cache would silently prune nothing)
          npx tsx scripts/prune-skeleton-sync.ts \
            --raw-listing /tmp/prune-raw-listing.txt \
            --snapshot-listing /tmp/prune-snapshot-listing.txt \
            --cache-dir ./cache

          # Overlay metadata.json files only (exclude regex is single-sourced
          # from the tested scripts/lib constant; rsync never downloads CSVs)
          EXCLUDE_REGEX=$(npx tsx scripts/prune-skeleton-sync.ts --print-exclude-regex)
          # STILL gsutil, deliberately (#1412). This is a KEEP-ONLY exclude: a
          # regex that anchors differently under `gcloud storage rsync --exclude`
          # silently drops metadata.json files, and the prune classifier then
          # deletes the dates it could not see. Migrate only with a proven-
          # equivalent match set per lesson `a-keep-only-rsync-exclude-...`.
          gsutil -m rsync -r -x "${EXCLUDE_REGEX}" \
            "gs://${GCS_BUCKET}/raw-csv/" "./cache/raw-csv/"

          echo "## ⏬ Skeleton Sync for Prune (#1175)" >> "$GITHUB_STEP_SUMMARY"
          DATE_COUNT=$(find ./cache/raw-csv -maxdepth 1 -type d -name '????-??-??' | wc -l | tr -d ' ')
          META_COUNT=$(find ./cache/raw-csv -mindepth 2 -maxdepth 2 -name 'metadata.json' | wc -l | tr -d ' ')
          CACHE_SIZE=$(du -sh ./cache | cut -f1)
          echo "- **Raw-csv dates**: ${DATE_COUNT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **metadata.json overlaid**: ${META_COUNT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Metadata-less (protected #1131)**: $((DATE_COUNT - META_COUNT))" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Local cache size**: ${CACHE_SIZE} (<1 GB acceptance bound, #1175)" >> "$GITHUB_STEP_SUMMARY"

      # ── Prune Step 2: Run collector-cli prune ──
      - name: '[prune] Identify and remove non-month-end dates'
        if: steps.mode.outputs.mode == 'prune'
        id: prune
        run: |
          # Without pipefail, `| tee` masks a non-zero prune exit and Step 3
          # would consume a partial-failure artifact as if it were clean (#1131)
          set -o pipefail

          DRY_RUN_FLAG=""
          if [ "${{ steps.mode.outputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "::notice::Dry-run mode — no data will be deleted"
          fi

          echo "Running: npx collector-cli prune --verbose ${DRY_RUN_FLAG}"
          npx collector-cli prune --verbose ${DRY_RUN_FLAG} | tee /tmp/prune-output.json

          echo "## 🧹 Prune Results" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/prune-output.json | jq '.' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # ── Prune Step 3: Delete pruned dates from GCS ──
      - name: '[prune] Delete pruned dates from GCS'
        if: steps.mode.outputs.mode == 'prune' && steps.mode.outputs.dry_run != 'true'
        run: |
          echo "Deleting pruned dates from GCS..."

          # Deletions are keyed by the prune classification output (#1131):
          # raw-csv/ by COLLECTION date, snapshots/ by SNAPSHOT date. The
          # previous local-vs-GCS snapshot-date diff orphaned remapped
          # raw-csv dirs (collection date ≠ snapshot date) forever. The
          # script fails closed: malformed output fails this step before
          # any `gcloud storage rm` runs.
          npx tsx scripts/prune-gcs-deletions.ts /tmp/prune-output.json > /tmp/prune-gcs-paths.txt

          DELETED=0
          while IFS= read -r PREFIX; do
            echo "Deleting gs://${GCS_BUCKET}/${PREFIX}/..."
            gcloud storage rm -r "gs://${GCS_BUCKET}/${PREFIX}/" || true
            DELETED=$((DELETED + 1))
          done < /tmp/prune-gcs-paths.txt

          echo "## 🗑️ GCS Cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Prefixes deleted from GCS**: ${DELETED}" >> "$GITHUB_STEP_SUMMARY"

      # ════════════════════════════════════════════════════════
      # SHARED: CDN Manifests (daily + rebuild)
      # ════════════════════════════════════════════════════════

      # `backfill-global-totals` is excluded from all three shared manifest
      # steps below (#1498). Every one of them is derived from district
      # snapshots — v1/latest.json + v1/dates.json from the bucket's snapshot
      # listing, district-snapshot-index and club-index from district_*.json —
      # and that mode publishes exactly one ADDITIVE file per date and no
      # district snapshot at all. Leaving it in was not merely wasteful: the
      # index step's `else` is the DAILY merge branch, so it ran with an empty
      # DATE and DISTRICT_LIST and wrote a phantom `"": [""]` entry straight
      # into config/district-snapshot-index.json, which promotion rsyncs to
      # production wholesale. R17 — every conditional needs an explicit case
      # for every value, including the mode you just added.
      - name: Generate CDN manifests
        if: >-
          (steps.mode.outputs.mode != 'prune' || steps.mode.outputs.dry_run != 'true')
          && steps.mode.outputs.mode != 'backfill-global-totals'
        run: |
          # Determine the latest date from local snapshots (falls back to GCS
          # listing when local cache is empty, e.g. after a rebuild that deletes
          # each snapshot post-upload to conserve disk).
          # Only consider snapshot dirs that contain actual JSON files (#295).
          # Orphan empty dirs (from previous-year YoY fetches) must not
          # be picked up as the latest date.
          LATEST_DATE=$(find ./cache/snapshots -maxdepth 1 -type d -name '????-??-??' \
            -exec sh -c 'ls "$1"/*.json >/dev/null 2>&1 && basename "$1"' _ {} \; \
            | sort | tail -1)
          if [ -z "${LATEST_DATE}" ]; then
            echo "Local snapshot cache empty — checking GCS for latest date..."
            LATEST_DATE=$(gcloud storage ls "gs://${GCS_BUCKET}/snapshots/" \
              | grep -oP '\d{4}-\d{2}-\d{2}' | sort -u | tail -1)
          fi
          if [ -z "${LATEST_DATE}" ]; then
            echo "::warning::No snapshot dates found locally or in GCS, skipping manifests"
            exit 0
          fi
          echo "Latest snapshot date: ${LATEST_DATE}"

          # v1/latest.json (short TTL, 5 min)
          node -e "
            const fs = require('fs');
            const manifest = {
              _format: { version: '1.0.0', type: 'manifest' },
              latestSnapshotDate: '${LATEST_DATE}',
              generatedAt: new Date().toISOString()
            };
            fs.writeFileSync('/tmp/latest.json', JSON.stringify(manifest, null, 2));
            console.log('Generated v1/latest.json for ${LATEST_DATE}');
          "
          gcloud storage cp \
            --content-type="application/json" \
            --cache-control="public, max-age=300" \
            /tmp/latest.json "gs://${GCS_BUCKET}/v1/latest.json"

          # v1/dates.json (medium TTL, 15 min)
          gcloud storage ls "gs://${GCS_BUCKET}/snapshots/" | \
            grep -oP '\d{4}-\d{2}-\d{2}' | sort -u > /tmp/all-dates.txt
          node -e "
            const fs = require('fs');
            const dates = fs.readFileSync('/tmp/all-dates.txt', 'utf-8')
              .trim().split('\n').filter(Boolean);
            const data = {
              _format: { version: '1.0.0', type: 'dates-index' },
              dates, count: dates.length,
              generatedAt: new Date().toISOString()
            };
            fs.writeFileSync('/tmp/dates.json', JSON.stringify(data, null, 2));
            console.log('Generated v1/dates.json with ' + dates.length + ' dates');
          "
          gcloud storage cp \
            --content-type="application/json" \
            --cache-control="public, max-age=900" \
            /tmp/dates.json "gs://${GCS_BUCKET}/v1/dates.json"

          # v1/rankings.json (short TTL, 5 min)
          # In rebuild mode, local snapshots are cleaned per-date — fetch from GCS
          RANKINGS_SRC="./cache/snapshots/${LATEST_DATE}/all-districts-rankings.json"
          if [ ! -f "${RANKINGS_SRC}" ]; then
            mkdir -p "./cache/snapshots/${LATEST_DATE}"
            gcloud storage cp "gs://${GCS_BUCKET}/snapshots/${LATEST_DATE}/all-districts-rankings.json" \
              "${RANKINGS_SRC}" 2>/dev/null || true
          fi
          if [ -f "${RANKINGS_SRC}" ]; then
            node -e "
              const fs = require('fs');
              const src = JSON.parse(fs.readFileSync('${RANKINGS_SRC}', 'utf-8'));
              const data = {
                _format: { version: '1.0.0', type: 'rankings' },
                rankings: src.rankings,
                date: src.metadata.sourceCsvDate || '${LATEST_DATE}',
                generatedAt: new Date().toISOString()
              };
              fs.writeFileSync('/tmp/rankings.json', JSON.stringify(data, null, 2));
              console.log('Generated v1/rankings.json with ' + src.rankings.length + ' districts');
            "
            gcloud storage cp \
              --content-type="application/json" \
              --cache-control="public, max-age=300" \
              /tmp/rankings.json "gs://${GCS_BUCKET}/v1/rankings.json"
          else
            echo "::warning::all-districts-rankings.json not found, skipping v1/rankings.json"
          fi

          # v1/rank-history/{districtId}.json
          # Issue #186: Download rankings into date-prefixed filenames
          # to avoid overwriting (all files are named all-districts-rankings.json)
          echo "Building per-district rank history..."
          mkdir -p /tmp/rank-history-src /tmp/rank-history-out
          gcloud storage ls "gs://${GCS_BUCKET}/snapshots/*/all-districts-rankings.json" \
            2>/dev/null | while IFS= read -r gcs_path; do
            DATE_DIR=$(echo "${gcs_path}" | grep -oP '\d{4}-\d{2}-\d{2}')
            if [ -n "${DATE_DIR}" ]; then
              gcloud storage cp "${gcs_path}" \
                "/tmp/rank-history-src/${DATE_DIR}.json" 2>/dev/null || true
            fi
          done

          RANK_FILE_COUNT=$(ls /tmp/rank-history-src/*.json 2>/dev/null | wc -l | tr -d ' ')
          echo "Downloaded ${RANK_FILE_COUNT} historical rankings files"

          if [ "${RANK_FILE_COUNT}" -gt "0" ]; then
            node -e "
              const fs = require('fs');
              const path = require('path');
              const srcDir = '/tmp/rank-history-src';
              const outDir = '/tmp/rank-history-out';
              const index = new Map();
              const files = fs.readdirSync(srcDir).filter(f => f.endsWith('.json'));
              for (const file of files) {
                try {
                  const data = JSON.parse(fs.readFileSync(path.join(srcDir, file), 'utf-8'));
                  // Use the snapshot date (filename) not sourceCsvDate (raw-csv date) (#302)
                  const date = path.basename(file, '.json');
                  if (!date || !data.rankings) continue;
                  for (const r of data.rankings) {
                    if (!index.has(r.districtId)) {
                      index.set(r.districtId, { districtId: r.districtId, districtName: r.districtName, history: [] });
                    }
                    const entry = index.get(r.districtId);
                    if (entry.districtName === 'District ' + r.districtId) entry.districtName = r.districtName;
                    entry.history.push({
                      date, aggregateScore: r.aggregateScore,
                      clubsRank: r.clubsRank, paymentsRank: r.paymentsRank,
                      distinguishedRank: r.distinguishedRank,
                      totalDistricts: data.metadata.totalDistricts,
                      overallRank: r.overallRank ?? 0
                    });
                  }
                } catch (e) { console.error('Skipping ' + file + ': ' + e.message); }
              }
              let totalPoints = 0;
              for (const [id, entry] of index) {
                entry.history.sort((a, b) => a.date.localeCompare(b.date));
                const seen = new Set();
                entry.history = entry.history.filter(p => { if (seen.has(p.date)) return false; seen.add(p.date); return true; });
                totalPoints += entry.history.length;
                fs.writeFileSync(path.join(outDir, id + '.json'), JSON.stringify(entry));
              }
              console.log('Generated rank history for ' + index.size + ' districts (' + totalPoints + ' total points)');
            "
            gcloud storage cp \
              --content-type="application/json" \
              --cache-control="public, max-age=300" \
              -r "/tmp/rank-history-out/*.json" \
              "gs://${GCS_BUCKET}/v1/rank-history/"
          fi

          echo "## 📋 CDN Manifests" >> "$GITHUB_STEP_SUMMARY"
          echo "- **v1/latest.json**: ${LATEST_DATE}" >> "$GITHUB_STEP_SUMMARY"
          DATE_COUNT=$(wc -l < /tmp/all-dates.txt | tr -d ' ')
          echo "- **v1/dates.json**: ${DATE_COUNT} dates" >> "$GITHUB_STEP_SUMMARY"

      # ── Shared: Generate v1/global-history.json (#1499, epic #1496) ──
      # One worldwide row per COMPLETED program year, so /history renders the
      # five-year scoreboard from one fetch. Thin glue around the unit-tested
      # scripts/lib/globalHistory.ts (Lesson 107 pattern). `v1/` is
      # prune-exempt by location and the staging→prod `v1/` rsync below
      # promotes whatever lands here.
      - name: Generate global-history manifest
        if: >-
          (steps.mode.outputs.mode != 'prune' || steps.mode.outputs.dry_run != 'true')
          && steps.mode.outputs.mode != 'backfill-global-totals'
        run: |
          # No `set -o pipefail` here: `gsutil ls | grep -oP` legitimately
          # exits non-zero on an empty bucket and would abort the step before
          # the emptiness check below can report it (R14).
          gsutil ls "gs://${GCS_BUCKET}/snapshots/" 2>/dev/null \
            | grep -oP '\d{4}-\d{2}-\d{2}' | sort -u > /tmp/gh-all-dates.txt
          if [ ! -s /tmp/gh-all-dates.txt ]; then
            echo "::warning::No snapshot dates in GCS, skipping v1/global-history.json"
            exit 0
          fi

          # Pass 1 — which dates does the series need, and what for? The
          # object set is derived from the dates listing, so it cannot be
          # hardcoded without going stale at the next program-year close.
          mkdir -p /tmp/gh-src
          npx tsx scripts/build-global-history.ts --plan \
            --dates-file /tmp/gh-all-dates.txt > /tmp/gh-plan.txt

          # R2: the runner starts empty — every input is explicitly synced.
          # Per-object `gcloud storage cp`, NEVER `gsutil cp -I` (#1469): the
          # latter silently truncates its stdin source list to two entries and
          # exits 0, which shipped two wrong production indexes. #1412 prefers
          # `gcloud storage` for new code regardless.
          # Fail-soft PER OBJECT on purpose: a date whose rollup was never
          # backfilled is a row the assembler omits loudly, not a reason to
          # take v1/latest.json and v1/dates.json down with it.
          while IFS=$'\t' read -r GH_DATE GH_ROLE; do
            [ -n "${GH_DATE}" ] || continue
            mkdir -p "/tmp/gh-src/${GH_DATE}"
            gcloud storage cp \
              "gs://${GCS_BUCKET}/snapshots/${GH_DATE}/global-totals.json" \
              "/tmp/gh-src/${GH_DATE}/" 2>/dev/null \
              || echo "::warning::${GH_DATE} (${GH_ROLE}): no global-totals.json — backfill-global-totals it"
            if [ "${GH_ROLE}" = "year-end" ]; then
              # The date's OWN district set. Education is scoped to it and is
              # refused rather than summed over a directory that can hold
              # districts the date never had (#1465/#1466).
              gcloud storage cp \
                "gs://${GCS_BUCKET}/snapshots/${GH_DATE}/all-districts-rankings.json" \
                "/tmp/gh-src/${GH_DATE}/" 2>/dev/null \
                || echo "::warning::no all-districts-rankings.json at ${GH_DATE} — education left null"
              gcloud storage cp \
                "gs://${GCS_BUCKET}/snapshots/${GH_DATE}/district_*_reports.json" \
                "/tmp/gh-src/${GH_DATE}/" 2>/dev/null \
                || echo "::notice::no district_*_reports.json at ${GH_DATE} — education published as null, not zero"
            fi
          done < /tmp/gh-plan.txt

          # Pass 2 — assemble from what actually arrived.
          npx tsx scripts/build-global-history.ts \
            --dates-file /tmp/gh-all-dates.txt \
            --source-dir /tmp/gh-src \
            --out /tmp/global-history.json > /tmp/gh-summary.json

          # Same TTL class as v1/rankings.json above.
          gcloud storage cp \
            --content-type=application/json \
            --cache-control="public, max-age=300" \
            /tmp/global-history.json "gs://${GCS_BUCKET}/v1/global-history.json"

          echo "## 🌍 Global History (#1499)" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- **Program years**: \(.years) — \(.programYears | join(", "))"' \
            /tmp/gh-summary.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- **Years omitted (missing rollup)**: \(.omitted)"' \
            /tmp/gh-summary.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- **Years with education data**: " +
                 (if (.educationYears | length) == 0 then "none"
                  else (.educationYears | join(", ")) end)' \
            /tmp/gh-summary.json >> "$GITHUB_STEP_SUMMARY"

      # ── Shared: Update district-snapshot-index ──
      - name: Update district-snapshot-index
        if: >-
          (steps.mode.outputs.mode != 'prune' || steps.mode.outputs.dry_run != 'true')
          && steps.mode.outputs.mode != 'backfill-global-totals'
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          INDEX_PATH="gs://${GCS_BUCKET}/config/district-snapshot-index.json"

          if [ "${MODE}" = "rebuild" ] || [ "${MODE}" = "prune" ]; then
            # Rebuild/prune: regenerate from the GCS listing so the index only
            # lists dates whose district_*.json files actually still exist.
            # Prune deletes snapshot prefixes from GCS; merging (the daily path)
            # would write the stale index back unchanged and keep advertising
            # the just-deleted dates → change-digest 404s (#1279).
            echo "Generating snapshot index from GCS..."
            gcloud storage ls "gs://${GCS_BUCKET}/snapshots/*/district_*.json" \
              > /tmp/snapshot-files.txt 2>/dev/null || true
            node -e "
              const fs = require('fs');
              const lines = fs.readFileSync('/tmp/snapshot-files.txt', 'utf-8').trim().split('\n').filter(Boolean);
              const index = {};
              // Parse GCS paths: gs://bucket/snapshots/YYYY-MM-DD/district_XX.json
              for (const line of lines) {
                // The /^[A-Z0-9]+$/i guard is load-bearing, not decorative: `\w`
                // includes `_`, so without it the daily-reports sidecar
                // `district_61_reports.json` enters the index as a phantom
                // district `61_reports` (#1428). Equivalent to
                // DISTRICT_SNAPSHOT_OBJECT_PATTERN in
                // @taverns-red/shared-contracts src/naming/snapshotFileNames.ts,
                // which inline JS in YAML cannot import. Do not drop it.
                const match = line.match(/snapshots\/(\d{4}-\d{2}-\d{2})\/district_(\w+)\.json$/);
                if (match && match[1] && match[2] && /^[A-Z0-9]+$/i.test(match[2])) {
                  const [, date, id] = match;
                  if (!index[id]) index[id] = [];
                  if (!index[id].includes(date)) index[id].push(date);
                }
              }
              for (const id of Object.keys(index)) index[id].sort();
              const dates = [...new Set(lines.map(l => l.match(/snapshots\/(\d{4}-\d{2}-\d{2})\//)?.[1]).filter(Boolean))];
              const out = { generatedAt: new Date().toISOString(), districts: index };
              fs.writeFileSync('/tmp/district-snapshot-index.json', JSON.stringify(out, null, 2));
              console.log('Generated snapshot index: ' + Object.keys(index).length + ' districts, ' + dates.length + ' dates');
            "
          else
            # Daily: merge today's snapshot date into existing index
            # Use snapshot_date (post closing-period remap) not raw date (#309)
            DATE="${{ steps.daily-scrape.outputs.snapshot_date || steps.daily-scrape.outputs.date || steps.daily-config.outputs.date }}"
            DISTRICT_LIST="${{ steps.daily-config.outputs.districts }}"

            gcloud storage cp "${INDEX_PATH}" /tmp/district-snapshot-index.json 2>/dev/null || \
              echo '{"generatedAt":"","districts":{}}' > /tmp/district-snapshot-index.json

            node -e "
              const fs = require('fs');
              const raw = JSON.parse(fs.readFileSync('/tmp/district-snapshot-index.json', 'utf-8'));
              // Normalize: old flat format → new nested format
              const districts = (raw.districts && typeof raw.districts === 'object' && !Array.isArray(raw.districts))
                ? raw.districts : raw;
              const date = '${DATE}';
              for (const id of '${DISTRICT_LIST}'.split(',').map(d => d.trim())) {
                const dateSet = new Set(districts[id] || []);
                dateSet.add(date);
                districts[id] = [...dateSet].sort();
              }
              // Always write new nested format
              const out = { generatedAt: new Date().toISOString(), districts };
              fs.writeFileSync('/tmp/district-snapshot-index.json', JSON.stringify(out, null, 2));
              console.log('Updated index for ' + Object.keys(districts).length + ' districts with date ' + date);
            "
          fi

          gcloud storage cp \
            --content-type="application/json" \
            --cache-control="public, max-age=300" \
            /tmp/district-snapshot-index.json "${INDEX_PATH}"

          echo "## 📋 District Snapshot Index" >> "$GITHUB_STEP_SUMMARY"
          DISTRICT_COUNT=$(jq '.districts | keys | length' /tmp/district-snapshot-index.json)
          echo "- **Districts in index**: ${DISTRICT_COUNT}" >> "$GITHUB_STEP_SUMMARY"

      # ── Shared: Generate club-index.json (#320, rebuilt #1469) ──
      # Built by the unit-tested scripts/lib/clubIndex.ts (thin-glue step,
      # Lesson 107). This was inline `node -e` until #1469, which is why it
      # could carry a hand copy of normalizeClubId and ship an index covering
      # 2 of 94 districts unnoticed. Promotion rsyncs config/ wholesale.
      - name: Generate club-index
        if: >-
          (steps.mode.outputs.mode != 'prune' || steps.mode.outputs.dry_run != 'true')
          && steps.mode.outputs.mode != 'backfill-global-totals'
        run: |
          set -o pipefail
          LATEST_DATE=$(gcloud storage cat "gs://${GCS_BUCKET}/v1/latest.json" 2>/dev/null \
            | jq -r '.latestSnapshotDate' || echo "")
          if [ -z "${LATEST_DATE}" ]; then
            echo "::warning::No latest date found, skipping club-index"
            exit 0
          fi
          echo "Building club-index from snapshots/${LATEST_DATE}/..."

          # R2: explicitly sync the district files this step reads. The
          # sidecar district_{id}_reports.json shares the prefix (#1428) and
          # `gcloud storage cp` has no exclude flag, so list first, then filter.
          mkdir -p /tmp/club-index-src
          gcloud storage ls "gs://${GCS_BUCKET}/snapshots/${LATEST_DATE}/district_*.json" \
            | grep -v '_reports\.json$' > /tmp/club-index-srcs.txt
          EXPECTED=$(wc -l < /tmp/club-index-srcs.txt | tr -d ' ')
          echo "Listed ${EXPECTED} district files"

          # `gcloud storage cp`, NOT `gsutil cp -I` (#1469): gsutil silently
          # consumes only the first two stdin source URLs and exits 0, which
          # is how this index ran at 2 of 94 districts. Errors are NOT
          # discarded here — that suppression is what hid the defect.
          if [ -s /tmp/club-index-srcs.txt ]; then
            gcloud storage cp -I /tmp/club-index-src/ < /tmp/club-index-srcs.txt
          fi

          # Fails the step when nothing synced, or when fewer files arrived
          # than were listed — a partial index must never overwrite a
          # complete one.
          npx tsx scripts/build-club-index.ts \
            --src /tmp/club-index-src \
            --out /tmp/club-index.json \
            --snapshot-date "${LATEST_DATE}" \
            --expect "${EXPECTED}"

          gcloud storage cp \
            --content-type="application/json" \
            --cache-control="public, max-age=300" \
            /tmp/club-index.json "gs://${GCS_BUCKET}/config/club-index.json"

          echo "## 📋 Club Index" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- **Clubs indexed**: \(.totalClubs)"' /tmp/club-index.json \
            >> "$GITHUB_STEP_SUMMARY"

      # ── Shared: Generate divisions-areas-index.json (#1134, epic #1101) ──
      # Mirror of club-index for divisions/areas, built by the unit-tested
      # scripts/lib/divisionsAreasIndex.ts (thin-glue step, Lesson 107).
      # Promotion rsyncs config/ wholesale, so this reaches prod with the run.
      - name: Generate divisions-areas index
        if: steps.mode.outputs.mode != 'prune' || steps.mode.outputs.dry_run != 'true'
        run: |
          set -o pipefail
          LATEST_DATE=$(gcloud storage cat "gs://${GCS_BUCKET}/v1/latest.json" 2>/dev/null \
            | jq -r '.latestSnapshotDate' || echo "")
          if [ -z "${LATEST_DATE}" ]; then
            echo "::warning::No latest date found, skipping divisions-areas index"
            exit 0
          fi
          echo "Building divisions-areas index from snapshots/${LATEST_DATE}/..."

          # R2: explicitly sync the district files this step reads.
          # Same sidecar exclusion as club-index above (#1428) — this glob is
          # what fed `district_{id}_reports.json` to the index builder and
          # produced its `Skipping corrupt file:` noise on every run.
          mkdir -p /tmp/divisions-areas-src
          gcloud storage ls "gs://${GCS_BUCKET}/snapshots/${LATEST_DATE}/district_*.json" \
            | grep -v '_reports\.json$' > /tmp/divisions-areas-srcs.txt
          EXPECTED=$(wc -l < /tmp/divisions-areas-srcs.txt | tr -d ' ')
          echo "Listed ${EXPECTED} district files"

          # `gcloud storage cp`, NOT `gsutil cp -I` (#1469) — see the
          # club-index step above. This index shipped at 2 of 94 districts
          # for the same reason, silently degrading omni-search.
          if [ -s /tmp/divisions-areas-srcs.txt ]; then
            gcloud storage cp -I /tmp/divisions-areas-src/ < /tmp/divisions-areas-srcs.txt
          fi

          # Fails the step when no district files were synced, or when fewer
          # arrived than were listed — a partial index must never overwrite a
          # complete one.
          npx tsx scripts/build-divisions-areas-index.ts \
            --src /tmp/divisions-areas-src \
            --out /tmp/divisions-areas-index.json \
            --snapshot-date "${LATEST_DATE}" \
            --expect "${EXPECTED}"

          gcloud storage cp \
            --content-type="application/json" \
            --cache-control="public, max-age=300" \
            /tmp/divisions-areas-index.json "gs://${GCS_BUCKET}/config/divisions-areas-index.json"

          echo "## 🗺️ Divisions/Areas Index" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- **Divisions indexed**: \(.totalDivisions)\n- **Areas indexed**: \(.totalAreas)"' \
            /tmp/divisions-areas-index.json >> "$GITHUB_STEP_SUMMARY"

      # ════════════════════════════════════════════════════════
      # PRUNE MODE: PROD RECONCILIATION (#1133)
      # Prune deletes only from staging; promotion rsync has no -d, so a
      # staging-only prune leaves staging < prod and the count gate freezes
      # promotion. The plan is the prod-minus-staging diff of dated dirs
      # (fail-closed in scripts/lib/pruneProdReconcile.ts), which also
      # sweeps stragglers from earlier staging-only prunes. These steps run
      # AFTER the shared manifest regeneration above, so the v1/ rsync
      # copies the post-prune dates.json — rsyncing the stale manifest
      # would re-freeze the count gate the mechanism exists to unfreeze.
      # Runbook: docs/runbooks/prune-prod-reconciliation.md
      # ════════════════════════════════════════════════════════

      - name: '[prune] Plan prod reconciliation'
        if: steps.mode.outputs.mode == 'prune' && steps.mode.outputs.reconcile_prod == 'true'
        run: |
          set -o pipefail
          gcloud storage ls "gs://${GCS_BUCKET}/snapshots/" > /tmp/ls-staging-snapshots.txt
          gcloud storage ls "gs://${GCS_BUCKET}/raw-csv/" > /tmp/ls-staging-rawcsv.txt
          gcloud storage ls "gs://${GCS_BUCKET_PRODUCTION}/snapshots/" > /tmp/ls-prod-snapshots.txt
          # Promotion never syncs raw-csv, so prod may legitimately lack it.
          gcloud storage ls "gs://${GCS_BUCKET_PRODUCTION}/raw-csv/" > /tmp/ls-prod-rawcsv.txt \
            || : > /tmp/ls-prod-rawcsv.txt

          # In a dry run staging is untouched: the prune output's pending
          # deletions are previewed as already gone. In a real run staging
          # is already pruned and the subtraction is a no-op.
          npx tsx scripts/prune-prod-reconcile.ts \
            --staging-snapshots /tmp/ls-staging-snapshots.txt \
            --staging-rawcsv /tmp/ls-staging-rawcsv.txt \
            --prod-snapshots /tmp/ls-prod-snapshots.txt \
            --prod-rawcsv /tmp/ls-prod-rawcsv.txt \
            --prune-output /tmp/prune-output.json > /tmp/prod-reconcile-paths.txt

          COUNT=$(wc -l < /tmp/prod-reconcile-paths.txt | tr -d ' ')
          echo "## 🔁 Prod Reconcile Plan (#1133)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Prod-only prefixes to delete**: ${COUNT}" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- `/; s/$/`/' /tmp/prod-reconcile-paths.txt >> "$GITHUB_STEP_SUMMARY"

      - name: '[prune] Reconcile production'
        if: >-
          steps.mode.outputs.mode == 'prune' &&
          steps.mode.outputs.reconcile_prod == 'true' &&
          steps.mode.outputs.dry_run != 'true'
        run: |
          DELETED=0
          while IFS= read -r PREFIX; do
            echo "Deleting gs://${GCS_BUCKET_PRODUCTION}/${PREFIX}/..."
            gcloud storage rm -r "gs://${GCS_BUCKET_PRODUCTION}/${PREFIX}/" || true
            DELETED=$((DELETED + 1))
          done < /tmp/prod-reconcile-paths.txt

          # Sync the regenerated manifests so the next daily's count gate
          # compares like with like (prod's v1/dates.json would otherwise
          # still list the pruned dates and freeze promotion).
          gsutil -m rsync -r "gs://${GCS_BUCKET}/v1/" "gs://${GCS_BUCKET_PRODUCTION}/v1/"
          gsutil -m rsync -r "gs://${GCS_BUCKET}/config/" "gs://${GCS_BUCKET_PRODUCTION}/config/"

          echo "## ✅ Prod Reconciliation Complete (#1133)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Prefixes deleted from prod**: ${DELETED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Manifests (v1/, config/) synced staging → prod" >> "$GITHUB_STEP_SUMMARY"

      # ════════════════════════════════════════════════════════
      # STAGING → PRODUCTION PROMOTION (#316)
      # ════════════════════════════════════════════════════════

      - name: Diff staging vs production
        id: diff
        if: steps.mode.outputs.mode != 'prune'
        env:
          ALLOW_SUBTRACTIVE: ${{ inputs.allow_subtractive }}
        run: |
          echo "Comparing staging vs production buckets..."

          # Count files in each bucket's key directories
          STAGING_SNAPSHOTS=$(gcloud storage ls "gs://${GCS_BUCKET}/snapshots/" 2>/dev/null | grep -c '/$' || echo 0)
          PROD_SNAPSHOTS=$(gcloud storage ls "gs://${GCS_BUCKET_PRODUCTION}/snapshots/" 2>/dev/null \
            | grep -c '/$' || echo 0)

          STAGING_LATEST=$(gcloud storage cat "gs://${GCS_BUCKET}/v1/latest.json" 2>/dev/null | jq -r '.latestSnapshotDate' || echo "unknown")
          PROD_LATEST=$(gcloud storage cat "gs://${GCS_BUCKET_PRODUCTION}/v1/latest.json" 2>/dev/null | jq -r '.latestSnapshotDate' || echo "unknown")

          STAGING_DATES=$(gcloud storage cat "gs://${GCS_BUCKET}/v1/dates.json" 2>/dev/null | jq '.count' || echo 0)
          PROD_DATES=$(gcloud storage cat "gs://${GCS_BUCKET_PRODUCTION}/v1/dates.json" 2>/dev/null \
            | jq '.count' || echo 0)

          STAGING_RANKINGS=$(gcloud storage cat "gs://${GCS_BUCKET}/v1/rankings.json" 2>/dev/null | jq '.rankings | length' || echo 0)
          PROD_RANKINGS=$(gcloud storage cat "gs://${GCS_BUCKET_PRODUCTION}/v1/rankings.json" 2>/dev/null | jq '.rankings | length' || echo 0)

          echo "## 🔍 Staging vs Production Diff" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Staging | Production | Delta |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|---------|------------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Latest date | ${STAGING_LATEST} | ${PROD_LATEST} | $([ "$STAGING_LATEST" = "$PROD_LATEST" ] && echo '✓ same' || echo '⚠ changed') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Snapshot dirs | ${STAGING_SNAPSHOTS} | ${PROD_SNAPSHOTS} | $((STAGING_SNAPSHOTS - PROD_SNAPSHOTS)) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dates in index | ${STAGING_DATES} | ${PROD_DATES} | $((STAGING_DATES - PROD_DATES)) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Districts ranked | ${STAGING_RANKINGS} | ${PROD_RANKINGS} | $((STAGING_RANKINGS - PROD_RANKINGS)) |" >> "$GITHUB_STEP_SUMMARY"

          # Determine if promotion is safe (additive-only)
          PROMOTE="true"
          SUBTRACTIVE="false"
          if [ "$STAGING_RANKINGS" -lt "$PROD_RANKINGS" ] 2>/dev/null; then
            echo "::warning::SUBTRACTIVE: staging has fewer ranked districts than production"
            PROMOTE="false"
            SUBTRACTIVE="true"
          fi
          if [ "$STAGING_DATES" -lt "$PROD_DATES" ] 2>/dev/null; then
            echo "::warning::SUBTRACTIVE: staging has fewer dates than production"
            PROMOTE="false"
            SUBTRACTIVE="true"
          fi

          # Operator override for a REVIEWED subtractive change (#1350).
          # Toastmasters periodically consolidates districts — PY 2026-2027 cut
          # the roster 128 → 94 — which is a legitimate reduction the count gate
          # cannot distinguish from data loss. Mirrors allow_value_changes for
          # the value gate. Overriding is recorded loudly: it must never be
          # possible to discover after the fact that a gate was bypassed.
          if [ "$SUBTRACTIVE" = "true" ] && [ "${ALLOW_SUBTRACTIVE:-false}" = "true" ]; then
            echo "::warning::Count gate OVERRIDDEN by allow_subtractive — operator asserts this reduction is intended"
            PROMOTE="true"
            {
              echo "- **⚠️ Count gate OVERRIDDEN** (\`allow_subtractive=true\`)"
              echo "  - Ranked districts: ${PROD_RANKINGS} → ${STAGING_RANKINGS} ($((STAGING_RANKINGS - PROD_RANKINGS)))"
              echo "  - Dates: ${PROD_DATES} → ${STAGING_DATES} ($((STAGING_DATES - PROD_DATES)))"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "promote=${PROMOTE}" >> "$GITHUB_OUTPUT"
          echo "- **Promotion (count gate)**: $([ "$PROMOTE" = "true" ] && echo '✅ Safe (additive)' || echo '❌ Blocked (subtractive change detected)')" >> "$GITHUB_STEP_SUMMARY"

      # Value-aware gate (#1034, epic #1031). The count gate above is blind to a
      # re-derive that keeps the same dates/districts but changes VALUES (F2).
      # This step compares per-date district values over the overlap set and
      # blocks promotion until an operator reviews them (allow_value_changes).
      # Fail-closed: any error leaves value_promote=false.
      - name: Value diff staging vs production (#1034)
        id: valuediff
        if: steps.mode.outputs.mode != 'prune'
        env:
          ALLOW_VALUE_CHANGES: ${{ inputs.allow_value_changes }}
        run: |
          set -uo pipefail
          VALUE_PROMOTE="false"

          # Overlap = dates present in BOTH staging and prod indexes.
          gcloud storage cat "gs://${GCS_BUCKET}/v1/dates.json" 2>/dev/null \
            | jq -r '.dates[]?' | sort > /tmp/staging-dates.txt || true
          gcloud storage cat "gs://${GCS_BUCKET_PRODUCTION}/v1/dates.json" 2>/dev/null \
            | jq -r '.dates[]?' | sort > /tmp/prod-dates.txt || true
          comm -12 /tmp/staging-dates.txt /tmp/prod-dates.txt > /tmp/overlap-dates.txt || true
          OVERLAP_COUNT=$(wc -l < /tmp/overlap-dates.txt | tr -d ' ')
          echo "Overlap dates to value-compare: ${OVERLAP_COUNT}"

          # Pull each overlap date's all-districts-rankings.json from both buckets.
          # Parallelized (xargs -P): ~2 cp/date sequentially over ~100 dates is
          # ~200 round-trips dominated by CLI startup; running them concurrently
          # cuts wall time markedly. Each cp is fail-soft (a missing file just drops
          # that date from the compare — loadDateDigests skips dirs without the file).
          rm -rf /tmp/vd && mkdir -p /tmp/vd/staging /tmp/vd/prod
          xargs -P 16 -I {} bash -c '
            d="$1"; sb="$2"; pb="$3"
            mkdir -p "/tmp/vd/staging/${d}" "/tmp/vd/prod/${d}"
            gcloud storage cp "gs://${sb}/snapshots/${d}/all-districts-rankings.json" \
              "/tmp/vd/staging/${d}/all-districts-rankings.json" 2>/dev/null || true
            gcloud storage cp "gs://${pb}/snapshots/${d}/all-districts-rankings.json" \
              "/tmp/vd/prod/${d}/all-districts-rankings.json" 2>/dev/null || true
          ' _ {} "${GCS_BUCKET}" "${GCS_BUCKET_PRODUCTION}" < /tmp/overlap-dates.txt

          ALLOW_FLAG=""
          if [ "${ALLOW_VALUE_CHANGES:-false}" = "true" ]; then
            ALLOW_FLAG="--allow-value-changes"
          fi

          # R4: structured JSON on stdout, logs on stderr. Parse .promote from JSON
          # rather than the exit code so this step stays green and the gate flows
          # through the step output.
          npx collector-cli value-diff \
            --staging-dir /tmp/vd/staging \
            --prod-dir /tmp/vd/prod \
            ${ALLOW_FLAG} > /tmp/value-diff.json 2>/tmp/value-diff.log || true

          echo "## 🔬 Value Diff (staging vs production)" >> "$GITHUB_STEP_SUMMARY"
          if jq -e . /tmp/value-diff.json >/dev/null 2>&1; then
            VALUE_PROMOTE=$(jq -r '.promote' /tmp/value-diff.json)
            ADDED=$(jq -r '.report.added | length' /tmp/value-diff.json)
            REMOVED=$(jq -r '.report.removed | length' /tmp/value-diff.json)
            CHANGED=$(jq -r '.report.changed | length' /tmp/value-diff.json)
            echo "- Overlap dates: ${OVERLAP_COUNT}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Added: ${ADDED} · Removed: ${REMOVED} · **Changed: ${CHANGED}**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Value-gate promote: ${VALUE_PROMOTE}" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.reasons[]? | "  - " + .' /tmp/value-diff.json >> "$GITHUB_STEP_SUMMARY" || true
            jq -r '.report.changed[]? | "  - changed " + .date + " (" + (.changedDistricts | length | tostring) + " districts)"' \
              /tmp/value-diff.json >> "$GITHUB_STEP_SUMMARY" || true

            # Closing-Pinned Auto-Allow provenance (#1086, epic #1083) —
            # display only; the gate step keeps consuming .promote above.
            AUTO_ALLOWED=$(jq -r '.autoAllowed // empty' /tmp/value-diff.json)
            if [ -n "${AUTO_ALLOWED}" ]; then
              DERIVED_ONLY=$(jq -r '.derivedOnlyDistricts // 0' /tmp/value-diff.json)
              DELTA_COUNT=$(jq -r '.closingDeltas | length' /tmp/value-diff.json)
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "### 🔓 Closing-Pinned Auto-Allow (\`${AUTO_ALLOWED}\`)" >> "$GITHUB_STEP_SUMMARY"
              {
                echo "Routine month-end reconciliation auto-promoted (#1083)."
                echo "${DERIVED_ONLY} derived-only district(s) ignored."
              } >> "$GITHUB_STEP_SUMMARY"
              if [ "${DELTA_COUNT}" -gt 0 ] 2>/dev/null; then
                {
                  echo ""
                  echo "| Date | District | Field | Prod | Staging | Δ |"
                  echo "| --- | --- | --- | ---: | ---: | ---: |"
                } >> "$GITHUB_STEP_SUMMARY"
                jq -r '.closingDeltas[]?
                    | "| \(.date) | D\(.districtId) | \(.field) | \(.prod) "
                      + "| \(.staging) "
                      + "| \(if .delta >= 0 then "+" else "" end)\(.delta) |"' \
                  /tmp/value-diff.json >> "$GITHUB_STEP_SUMMARY" || true
              fi
            fi
          else
            echo "::warning::value-diff produced no parseable output — failing closed (no promote)"
            echo "- ⚠️ value-diff failed to produce output — **failing closed**" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/value-diff.log || true
          fi

          echo "value_promote=${VALUE_PROMOTE}" >> "$GITHUB_OUTPUT"

      - name: Promote staging to production
        if: steps.diff.outputs.promote == 'true' && steps.valuediff.outputs.value_promote == 'true' && steps.mode.outputs.mode != 'prune'
        run: |
          echo "Promoting staging → production..."

          # STILL gsutil, deliberately (#1412): these five writes ARE production.
          # `gcloud storage rsync`'s object-comparison defaults are not proven
          # byte-identical to gsutil's here, and a difference shows up as data
          # that silently did or did not promote. Migrate with a dry-run diff.

          # Sync manifests (v1/)
          gsutil -m rsync -r "gs://${GCS_BUCKET}/v1/" "gs://${GCS_BUCKET_PRODUCTION}/v1/"

          # Sync snapshots (only new/changed)
          gsutil -m rsync -r "gs://${GCS_BUCKET}/snapshots/" "gs://${GCS_BUCKET_PRODUCTION}/snapshots/"

          # Sync time-series
          gsutil -m rsync -r "gs://${GCS_BUCKET}/time-series/" "gs://${GCS_BUCKET_PRODUCTION}/time-series/"

          # Sync club-trends
          gsutil -m rsync -r "gs://${GCS_BUCKET}/club-trends/" "gs://${GCS_BUCKET_PRODUCTION}/club-trends/"

          # Sync config (snapshot index)
          gsutil -m rsync -r "gs://${GCS_BUCKET}/config/" "gs://${GCS_BUCKET_PRODUCTION}/config/"

          echo "## ✅ Promotion Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Staging data synced to production bucket." >> "$GITHUB_STEP_SUMMARY"

      # Purge the Cloud CDN edge so freshly-promoted data is served immediately
      # (#1294). Without this, cdn.taverns.red keeps the previous objects until
      # their max-age TTL expires (~1h), making a successful promotion look
      # stale. Non-fatal: a promotion must never be undone by an invalidation
      # hiccup, and the edge expires on its own TTL as a fallback. Note this
      # purges the EDGE only — an already-open browser tab still honours the
      # response's max-age until it reloads.
      - name: Invalidate CDN cache after promotion (#1294)
        if: steps.diff.outputs.promote == 'true' && steps.valuediff.outputs.value_promote == 'true' && steps.mode.outputs.mode != 'prune'
        continue-on-error: true
        run: |
          echo "Invalidating Cloud CDN cache (toast-stats-cdn-url-map, cdn.taverns.red)..."
          if gcloud compute url-maps invalidate-cdn-cache toast-stats-cdn-url-map \
               --path '/*' --async; then
            echo "## 🧹 CDN Cache Invalidated" >> "$GITHUB_STEP_SUMMARY"
            echo "Purged cdn.taverns.red edge — promoted data is served immediately." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::CDN invalidation failed — promotion succeeded, but the" \
              "edge may serve stale data until max-age expires (~1h). Grant the" \
              "pipeline SA 'compute.urlMaps.invalidateCache' (see #1294)."
          fi

      - name: Promotion blocked
        if: (steps.diff.outputs.promote == 'false' || steps.valuediff.outputs.value_promote == 'false') && steps.mode.outputs.mode != 'prune'
        run: |
          echo "::error::Promotion BLOCKED — count gate or value gate refused. Production data unchanged."
          echo "## ❌ Promotion Blocked" >> "$GITHUB_STEP_SUMMARY"
          echo "- Count gate (additive): **${{ steps.diff.outputs.promote }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Value gate: **${{ steps.valuediff.outputs.value_promote }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "Production data is **unchanged**. Review the diffs above." >> "$GITHUB_STEP_SUMMARY"
          echo "For a reviewed re-derive, re-run with **allow_value_changes = true**." >> "$GITHUB_STEP_SUMMARY"
          echo "For a reviewed district/date REDUCTION (e.g. a TI consolidation), re-run with **allow_subtractive = true**." >> "$GITHUB_STEP_SUMMARY"

      # ════════════════════════════════════════════════════════
      # PROMOTION-HELD ALERT (#1073, epic #1072)
      # A blocked promotion leaves prod serving stale content while the run
      # still reports success. Turn that silent state into a loud, self-
      # clearing `promotion-held` issue. Decision logic is unit-tested in
      # scripts/lib/promotionAlert.ts; these steps are thin glue.
      # ════════════════════════════════════════════════════════
      - name: Evaluate promotion alert (#1073)
        id: promoalert
        if: steps.mode.outputs.mode != 'prune'
        env:
          COUNT_PROMOTE: ${{ steps.diff.outputs.promote }}
          VALUE_PROMOTE: ${{ steps.valuediff.outputs.value_promote }}
          VALUE_DIFF_FILE: /tmp/value-diff.json
        run: npx tsx scripts/promotion-alert.ts

      - name: Ensure promotion-held label exists
        if: steps.promoalert.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create promotion-held \
            --color B60205 \
            --description "Staging→prod promotion is held; prod is serving stale content" \
            2>/dev/null || echo "Label already exists"

      - name: File or refresh promotion-held issue
        if: steps.promoalert.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deduplicate: one open alert at a time. Refresh (comment on) the
          # existing issue rather than spamming a new one each blocked run.
          EXISTING=$(gh issue list --label promotion-held --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            echo "Existing open alert #${EXISTING} — adding a refresh comment."
            gh issue comment "${EXISTING}" \
              --body-file "${{ steps.promoalert.outputs.body_file }}"
          else
            echo "No open alert — creating one."
            gh issue create \
              --title "${{ steps.promoalert.outputs.title }}" \
              --label promotion-held \
              --body-file "${{ steps.promoalert.outputs.body_file }}"
          fi

      - name: Auto-close promotion-held issue on a promoting run
        if: steps.promoalert.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A later run promoted — the held state cleared. Close every open
          # promotion-held issue with a note. The `concurrency: data-pipeline`
          # group (top of file) serializes pipeline runs, so a promoting run
          # can't race a concurrent blocking run — once we promote, any prior
          # held state is genuinely resolved regardless of which mode filed it.
          OPEN=$(gh issue list --label promotion-held --state open \
            --json number --jq '.[].number')
          if [ -z "${OPEN}" ]; then
            echo "No open promotion-held issue to close."
          else
            for n in ${OPEN}; do
              echo "Closing promotion-held issue #${n} — promotion succeeded."
              gh issue close "${n}" \
                --comment "✅ A subsequent pipeline run promoted staging → production; the held state has cleared. Auto-closing (#1073)." \
                --reason completed
            done
          fi

      # ── Summary ──
      - name: Pipeline summary
        if: always()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          MODE="${{ steps.mode.outputs.mode }}"
          TIMESTAMP=$(date -u +%H:%M' UTC')
          echo "🏁 **${MODE}** pipeline completed at ${TIMESTAMP}" >> "$GITHUB_STEP_SUMMARY"

  # ══════════════════════════════════════════════════════════
  # DAILY DISTRICT REPORTS — PARALLEL FETCH (#1428, epic #1062)
  #
  # `collector-cli fetch-daily-reports` writes the de-identified
  # `snapshots/{date}/district_{id}_reports.json` dataset that the #1069
  # closing-period club-status overlay reads. Nothing called it, so a shipped
  # feature had no data and failed silently (the overlay's null path is
  # indistinguishable from "no club needed promoting").
  #
  # It is ~10 reports × ~130 districts at a 1100 ms floor ≈ 24 minutes of
  # anonymous HTTP against a rate-sensitive TI endpoint. The `pipeline` job
  # has `timeout-minutes: 30` and recent daily runs land at 15–22 min (one was
  # cancelled at 30.4), so an inline step is a guaranteed timeout kill mid-run.
  # Operator ruling 2026-08-19: run it as a parallel job, and do NOT trim
  # IN_SCOPE_REPORT_GUIDS to make it fit.
  #
  # Deliberately NO `needs:` — this job starts at t = 0 alongside `pipeline`
  # and the two never block each other. A total TI reports outage leaves THIS
  # job red while the snapshot publish proceeds, unaware. That is strictly
  # stronger than a `continue-on-error` inline step, which would still burn 24
  # of the pipeline's 30 available minutes before failing.
  #
  # The pivot that makes independence possible: the SLOW part is
  # date-independent. The fetch is keyed by the raw collection date (knowable
  # up front) and lands in a run-scoped `incoming/` prefix; only the cheap
  # placement needs the snapshot date, and that is what `place-reports` does.
  # ══════════════════════════════════════════════════════════
  # ══════════════════════════════════════════════════════════
  # CLOSING-REGISTRY AUTO-REMEDIATION (#1419)
  # ══════════════════════════════════════════════════════════
  # Why this job exists: the freshness check (#1128) was DETECT-ONLY. Every
  # daily run derived the correct registry entry from GCS metadata, threw it
  # away, and filed a red issue asking a human to run the same derivation
  # locally and commit it. A TRUE positive therefore re-fired daily until
  # someone noticed — 19 days for 2026-07 (#1419), and the identical loop for
  # 2026-06 (#1348) and 2026-05. A monitor that nags daily about work a
  # machine can do trains everyone to ignore it.
  #
  # This is NOT the #1266 cry-wolf fix (a benign empty feed alerting
  # vacuously) and it does NOT relax fail-closed behaviour: `remediation` is
  # 'auto' only when the feed was READ SUCCESSFULLY and the derivation PROVED
  # the missing/mismatched months. Blind or crashed verdicts are 'manual' and
  # still file the red issue from the `pipeline` job (L107).
  #
  # It opens a PR — it never pushes to main. A human still reviews and merges;
  # the merge is what makes the next daily verdict fresh, which auto-closes
  # any open alert through the existing step.
  #
  # Least privilege: `contents: write` + `pull-requests: write` live HERE and
  # nowhere else. The `pipeline` job that runs Playwright against TI keeps
  # `contents: read`. Job-level permissions are the only granularity GitHub
  # offers, which is why this is a separate job rather than a step.
  closing-registry-pr:
    name: 'closing-registry auto-PR'
    runs-on: ubuntu-latest
    needs: pipeline
    # R17 — every value has an explicit outcome: 'auto' → run;
    # 'none' / 'manual' / '' (non-daily mode, or a crashed check step whose
    # outputs are unset) → skip.
    if: needs.pipeline.outputs.registry_remediation == 'auto'
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Workload Identity Federation for the GCS re-derive
      issues: write # Link the open alert to the PR, and the failure fallback

    env:
      REGISTRY_BRANCH: bot/closing-registry-update

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ClosingDateRegistry imports Logger from analytics-core. That import is
      # type-only (erased by tsx), but building keeps this job immune to it
      # becoming a value import later — R16 / Lesson 92.
      - name: Build packages
        run: |
          npm run build --workspace=@taverns-red/shared-contracts
          npm run build --workspace=@taverns-red/analytics-core

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # The same writer the operator runbook prescribes — derived entries only
      # (no --set). planRegistryUpdates still refuses to regress a later manual
      # outage entry, so this cannot silently undo hand-curated history.
      - name: Regenerate the closing-date registry from GCS metadata
        run: npx tsx scripts/update-closing-date-registry.ts

      - name: Open or update the registry PR
        id: registry-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet -- docs/month-end-closing-dates.json; then
            echo "Registry regenerated to an identical file — nothing to PR."
            echo "The check said 'auto' but the writer planned no change, so"
            echo "derive and plan disagree. Failing loudly rather than masking:"
            git status --porcelain
            exit 1
          fi

          echo "Registry diff to propose:"
          git --no-pager diff -- docs/month-end-closing-dates.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git checkout -B "${REGISTRY_BRANCH}"

          # Format before staging so husky's lint-staged prettier pass is a
          # no-op. The hook runs normally — we never pass --no-verify (R1).
          npx prettier --write docs/month-end-closing-dates.json

          git add docs/month-end-closing-dates.json
          git commit -m 'chore(data): record closing dates derived from raw-csv metadata (#1419)'

          # NOT --force-with-lease. actions/checkout fetches single-branch, so
          # `origin/$REGISTRY_BRANCH` never exists as a remote-tracking ref and
          # the lease is evaluated against a missing ref — every run after the
          # first is rejected with "stale info", turning the pipeline red while
          # the 'auto' verdict also suppresses the issue refresh. This job is
          # the only writer of this branch and always regenerates it from
          # scratch off main, so a plain force to the explicit refspec is both
          # correct and the only thing that works here.
          git push --force origin "HEAD:refs/heads/${REGISTRY_BRANCH}"

          # One open PR at a time; the force-push above already refreshed it.
          EXISTING=$(gh pr list --head "${REGISTRY_BRANCH}" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            echo "Refreshed existing registry PR #${EXISTING}."
            echo "pr_number=${EXISTING}" >> "$GITHUB_OUTPUT"
            echo "pr_created=false" >> "$GITHUB_OUTPUT"
          else
            # Plain #1419 — never `Closes`/`Fixes`. The alert issue is closed by
            # the pipeline's own auto-close step once the merge makes the next
            # daily verdict fresh, not by this PR merging.
            gh pr create \
              --head "${REGISTRY_BRANCH}" \
              --base main \
              --title 'chore(data): update closing-date registry from raw-csv metadata' \
              --body-file .github/registry-pr-body.md
            CREATED=$(gh pr list --head "${REGISTRY_BRANCH}" --state open \
              --json number --jq '.[0].number // empty')
            echo "Opened registry PR #${CREATED}."
            echo "pr_number=${CREATED}" >> "$GITHUB_OUTPUT"
            echo "pr_created=true" >> "$GITHUB_OUTPUT"
          fi

      # An open alert issue must never go silent while 'auto' suppresses its
      # daily refresh: point it at the PR that resolves it. Gated on
      # pr_created so this is ONE comment per PR, not a new daily nag.
      - name: Link the open alert issue to the registry PR
        if: steps.registry-pr.outputs.pr_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.registry-pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          OPEN=$(gh issue list --label closing-registry-stale --state open \
            --json number --jq '.[].number')
          if [ -z "${OPEN}" ]; then
            echo "No open closing-registry-stale issue to link."
          else
            for n in ${OPEN}; do
              gh issue comment "${n}" --body \
                "🤖 The pipeline derived these entries itself and opened #${PR_NUMBER}. Review and merge it; the next daily run then finds the registry fresh and auto-closes this issue. No local run needed (#1419)."
            done
          fi

      # Fail-closed escape hatch. The whole premise of #1419 is that the
      # monitor must not go blind — so if this remediation path itself breaks
      # (GCS auth, push rejected, gh outage), fall back to the loud human
      # alert rather than leaving a red run nobody reads.
      - name: Fall back to the human alert when auto-remediation fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create closing-registry-stale \
            --color B60205 \
            --description "docs/month-end-closing-dates.json is behind raw-csv metadata" \
            2>/dev/null || echo "Label already exists"

          BODY=$(printf '%s\n' \
            'The closing-date registry is stale in a way the pipeline believed it could fix itself, but the **auto-remediation job failed**.' \
            '' \
            "Run: ${RUN_URL}" \
            '' \
            'Falling back to manual remediation (L107 — a monitor that cannot complete its own fix must say so):' \
            '' \
            '```bash' \
            'npx tsx scripts/update-closing-date-registry.ts' \
            '```' \
            'then commit the updated `docs/month-end-closing-dates.json`.' \
            'This issue self-clears on the next daily run that finds the registry fresh (#1419).')

          EXISTING=$(gh issue list --label closing-registry-stale --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body "${BODY}"
          else
            gh issue create \
              --title '🟥 closing-date registry auto-remediation failed' \
              --label closing-registry-stale \
              --body "${BODY}"
          fi

  daily-reports:
    name: 'daily district reports fetch'
    runs-on: ubuntu-latest
    # Mirrors the daily gate on the Playwright step, minus the quarterly-prune
    # cron (#1148), which is the one scheduled event that is NOT a daily run.
    # R17: every value of `mode` has an explicit outcome — daily/'' → run,
    # rebuild/rescrape/rescrape-historical/prune → skip.
    if: >-
      (inputs.mode == 'daily' || inputs.mode == '' || github.event_name == 'schedule')
      && github.event.schedule != '0 6 25 2,5,8,11 *'
    # 24 min is the NO-RETRY floor. DailyReportFetcher retries with backoff
    # (maxRetries: 2), which pushes a flaky TI day past 30. 45 is the budget.
    timeout-minutes: 45

    outputs:
      raw_date: ${{ steps.reports-config.outputs.raw_date }}
      program_year: ${{ steps.reports-config.outputs.program_year }}
      districts: ${{ steps.reports-config.outputs.districts }}
      succeeded: ${{ steps.reports-fetch.outputs.succeeded }}
      failed: ${{ steps.reports-fetch.outputs.failed }}
      staged: ${{ steps.reports-stage.outputs.staged }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # collector-cli's own `tsc` resolves @taverns-red/shared-contracts and
      # @taverns-red/analytics-core from their built `dist/`, which is
      # gitignored and never auto-rebuilt (R16 / Lesson 92) — so all three,
      # same as `pipeline`.
      - name: Build packages
        run: |
          npm run build --workspace=@taverns-red/shared-contracts
          npm run build --workspace=@taverns-red/analytics-core
          npm run build --workspace=@taverns-red/collector-cli

      # NO `npx playwright install` here, deliberately. DailyReportFetcher is
      # plain anonymous HTTP against TI's report endpoints — no browser, no
      # dashboard login, no scrape state. Skipping it saves ~1-2 min and a
      # large apt install on every daily run.

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # ── Reports Step 1: raw date + districts + program year ──
      - name: '[reports] Resolve date, districts and program year'
        id: reports-config
        run: |
          # Same expression as the pipeline's own daily steps — the raw
          # COLLECTION date. TI's dashboard is always one day behind. This is
          # knowable without scraping, which is the whole point: it keys the
          # staging prefix. The SNAPSHOT date (post closing-period remap, #309)
          # is not knowable here and is never guessed.
          RAW_DATE="${{ inputs.date || '' }}"
          if [ -z "${RAW_DATE}" ]; then
            RAW_DATE=$(date -u -d '1 day ago' +%Y-%m-%d)
          fi
          echo "Raw collection date: ${RAW_DATE}"
          echo "raw_date=${RAW_DATE}" >> "$GITHUB_OUTPUT"

          # #1284: the active program year is resolved BY DATA, never by the
          # calendar. This job has no `needs:`, so it cannot read
          # `steps.daily-config.outputs.program_year` from `pipeline` and must
          # run the resolver a second time — which is exactly the "two
          # resolutions can disagree at the July boundary" hazard #1284 exists
          # to prevent. The mitigation is downstream and mandatory:
          # `place-reports` asserts this value equals the pipeline's before it
          # places anything, and refuses loudly if they differ.
          #
          # Discovery runs even when `districts` is overridden manually,
          # because the PROGRAM YEAR is not optional here (see the fetch step);
          # only the district LIST honours the override.
          echo "Discovering districts for ${RAW_DATE}..."
          set +e
          DISCOVERY_JSON=$(npx collector-cli discover-districts --date "${RAW_DATE}" --verbose)
          DISCOVERY_STATUS=$?
          set -e
          if [ ${DISCOVERY_STATUS} -ne 0 ]; then
            echo "::error::[reports] discover-districts failed (exit ${DISCOVERY_STATUS}) — refusing to fetch."
            echo "${DISCOVERY_JSON}"
            exit 1
          fi

          PROGRAM_YEAR=$(echo "${DISCOVERY_JSON}" | jq -r '.programYear')
          FELL_BACK=$(echo "${DISCOVERY_JSON}" | jq -r '.fellBack')
          if [ -z "${PROGRAM_YEAR}" ] || [ "${PROGRAM_YEAR}" = "null" ] || [ "${PROGRAM_YEAR}" = "unknown" ]; then
            echo "::error::[reports] discover-districts returned no program year — refusing to fetch (#1284)."
            exit 1
          fi

          if [ -n "${{ inputs.districts }}" ]; then
            DISTRICTS="${{ inputs.districts }}"
            echo "Using manual district override: ${DISTRICTS}"
          else
            DISTRICTS=$(echo "${DISCOVERY_JSON}" | jq -r '.districts')
          fi
          if [ -z "${DISTRICTS}" ] || [ "${DISTRICTS}" = "null" ]; then
            echo "::error::[reports] No districts to fetch reports for — refusing to fetch."
            exit 1
          fi

          echo "program_year=${PROGRAM_YEAR}" >> "$GITHUB_OUTPUT"
          echo "districts=${DISTRICTS}" >> "$GITHUB_OUTPUT"

          DISTRICT_COUNT=$(echo "${DISTRICTS}" | tr ',' '\n' | wc -l | tr -d ' ')
          {
            echo "## 📄 District Daily Reports — Config (#1428)"
            echo "- **Raw collection date**: ${RAW_DATE}"
            echo "- **Program year (resolved by data)**: ${PROGRAM_YEAR} (fellBack=${FELL_BACK})"
            echo "- **Districts**: ${DISTRICT_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Reports Step 2: the ~24-minute fetch ──
      - name: '[reports] Fetch district daily reports'
        id: reports-fetch
        # REQUIRED. The command exits 1 on partial failure and 2 on total
        # failure per district (both are normal weather for an unauth'd TI
        # endpoint). Without this the job goes red on a single bad district
        # and `place-reports` would then discard a perfectly good 129/130.
        continue-on-error: true
        env:
          # `fetch-daily-reports` has NO --cache-dir flag. CACHE_DIR is the
          # only way to steer where it writes; resolveConfiguration() reads it.
          CACHE_DIR: ./cache
        run: |
          RAW_DATE="${{ steps.reports-config.outputs.raw_date }}"
          PROGRAM_YEAR="${{ steps.reports-config.outputs.program_year }}"
          DISTRICT_LIST="${{ steps.reports-config.outputs.districts }}"

          # --districts is mandatory IN PRACTICE: without it the command reads
          # {CACHE_DIR}/config/districts.json, which does not exist on a fresh
          # runner and is synced by nothing (R2).
          #
          # --program-year is mandatory for CORRECTNESS: the CLI default is
          # calculateProgramYear(targetDate) (cli.ts), pure calendar
          # arithmetic that returns 2026-2027 on 2026-07-01 while the data
          # resolver returns 2025-2026 (#1284). Falling back to it would
          # request a program year with no data and write ~130 empty datasets.
          #
          # stdout is the structured JSON summary (R4); --verbose logs go to
          # stderr, so they stream live through the 24-minute wait.
          set +e
          npx collector-cli fetch-daily-reports \
            --date "${RAW_DATE}" \
            --districts "${DISTRICT_LIST}" \
            --program-year "${PROGRAM_YEAR}" \
            --verbose > /tmp/daily-reports-output.json
          FETCH_STATUS=$?
          set -e
          echo "fetch-daily-reports exited ${FETCH_STATUS} (0=all, 1=partial, 2=total failure)"

          SUCCEEDED=$(jq -r '.succeeded // 0' /tmp/daily-reports-output.json 2>/dev/null || echo 0)
          FAILED=$(jq -r '.failed // 0' /tmp/daily-reports-output.json 2>/dev/null || echo 0)
          echo "succeeded=${SUCCEEDED}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"

          {
            echo "## 📄 District Daily Reports — Fetch (#1428)"
            echo "- **Districts succeeded**: ${SUCCEEDED}"
            echo "- **Districts failed**: ${FAILED}"
            echo "- **Exit code**: ${FETCH_STATUS}"
          } >> "$GITHUB_STEP_SUMMARY"

          jq -r '.results[]? | select(.ok == false) | "  - district \(.districtId): \(.error)"' \
            /tmp/daily-reports-output.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

          # Surface the real verdict. `continue-on-error` absorbs it into a
          # red STEP inside a green JOB, so `place-reports` still gets its
          # chance at the partial result.
          exit ${FETCH_STATUS}

      # ── Reports Step 3: stage into the run-scoped incoming prefix ──
      - name: '[reports] Stage datasets to the incoming prefix'
        id: reports-stage
        run: |
          RAW_DATE="${{ steps.reports-config.outputs.raw_date }}"
          SRC_DIR="./cache/snapshots/${RAW_DATE}"
          INCOMING="gs://${GCS_BUCKET}/incoming/daily-reports/${RAW_DATE}"

          COUNT=$(find "${SRC_DIR}" -maxdepth 1 -name 'district_*_reports.json' 2>/dev/null \
            | wc -l | tr -d ' ')
          echo "staged=${COUNT}" >> "$GITHUB_OUTPUT"

          if [ "${COUNT}" -eq 0 ]; then
            echo "::warning::[reports] No district_*_reports.json produced —" \
              "nothing to stage. The snapshot publishes without the #1069 overlay."
            echo "- **Staged to \`incoming/\`**: 0 (nothing to place)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Clear leftovers first so a re-run for the same raw date can never
          # mix two runs' datasets in one prefix.
          gcloud storage rm -r "${INCOMING}/" 2>/dev/null || true

          # Internal hand-off only: plain objects, NO CDN headers and NO -Z.
          # `place-reports` re-uploads with the snapshot headers once it knows
          # the snapshot date, so the CDN-facing object is produced by exactly
          # the same command shape as the pipeline's own upload step.
          gcloud storage cp "${SRC_DIR}"/district_*_reports.json "${INCOMING}/"

          {
            echo "- **Staged to \`incoming/daily-reports/${RAW_DATE}/\`**: ${COUNT} datasets"
            echo "- Awaiting \`place-reports\` for the authoritative snapshot date."
          } >> "$GITHUB_STEP_SUMMARY"

  # ══════════════════════════════════════════════════════════
  # PLACE DAILY REPORTS INTO THE SNAPSHOT (#1428)
  #
  # The cheap, date-dependent half. ~1 minute: assert the two program-year
  # resolutions agree, copy the staged datasets into
  # `snapshots/<pipeline.snapshot_date>/`, mirror to prod if this run
  # promoted, drop the incoming prefix.
  #
  # `if: always()` because `pipeline` can finish with red steps (a blocked
  # promotion, a failed FAC merge) and still have published a perfectly good
  # snapshot — and because `daily-reports` may be red. The real scope guard is
  # `snapshot_date != ''`, which is only ever non-empty on a daily run whose
  # scrape parsed a date.
  # ══════════════════════════════════════════════════════════
  place-reports:
    name: 'place daily reports into the snapshot'
    runs-on: ubuntu-latest
    needs: [pipeline, daily-reports]
    if: always() && needs.pipeline.outputs.snapshot_date != ''
    timeout-minutes: 15

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # ── The #1284 cross-job assertion ──
      # `daily-reports` had to resolve the active program year a second time
      # (no `needs:` ⇒ no access to the pipeline's). Two independent
      # resolutions of the same thing is precisely what #1284 forbids leaving
      # unchecked, so they are compared here before a single byte is placed.
      # Every case is explicit (R17):
      #   pipeline not successful           → skip, warn      (no trustworthy snapshot)
      #   daily-reports not successful      → skip, warn      (no data to place)
      #   reports PY empty/unknown          → skip, ERROR     (should be impossible)
      #   pipeline PY empty/'unknown'       → skip, warn      (#1343 override)
      #   PYs differ                        → skip, ERROR     (the #1284 bug)
      #   PYs equal                         → place
      - name: '[reports] Assert both program-year resolutions agree (#1284)'
        id: py-assert
        run: |
          PIPELINE_PY="${{ needs.pipeline.outputs.program_year }}"
          REPORTS_PY="${{ needs.daily-reports.outputs.program_year }}"
          REPORTS_RESULT="${{ needs.daily-reports.result }}"
          PIPELINE_RESULT="${{ needs.pipeline.result }}"
          echo "pipeline  program_year = '${PIPELINE_PY}'  (job result: ${PIPELINE_RESULT})"
          echo "reports   program_year = '${REPORTS_PY}'  (job result: ${REPORTS_RESULT})"
          echo "place=false" >> "$GITHUB_OUTPUT"

          echo "## 🧷 Daily Reports Placement (#1428)" >> "$GITHUB_STEP_SUMMARY"

          # A red `pipeline` means the snapshot publish itself is not
          # trustworthy (the validate gate, the upload, the scrape). Dropping
          # sidecars into a directory whose district_*.json never landed
          # creates exactly the orphan `_reports`-only state this issue is
          # cleaning up after. Note a merely HELD promotion does not fail the
          # job — the "Promotion blocked" step only annotates — so this is
          # specifically "the run broke", not "the gates said no".
          if [ "${PIPELINE_RESULT}" != "success" ]; then
            echo "::warning::[reports] pipeline finished '${PIPELINE_RESULT}' —" \
              "the snapshot publish is not trustworthy, so nothing is placed."
            echo "- ⚠️ \`pipeline\` result: **${PIPELINE_RESULT}** — nothing placed." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${REPORTS_RESULT}" != "success" ]; then
            echo "::warning::[reports] daily-reports finished '${REPORTS_RESULT}' —" \
              "nothing to place. The snapshot publishes without the #1069" \
              "closing-period overlay."
            echo "- ⚠️ \`daily-reports\` result: **${REPORTS_RESULT}** — nothing placed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "${REPORTS_PY}" ] || [ "${REPORTS_PY}" = "unknown" ]; then
            echo "::error::[reports] daily-reports emitted no resolved program year — refusing to place (#1284)."
            echo "- ❌ reports program year missing — **refusing to place**." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -z "${PIPELINE_PY}" ] || [ "${PIPELINE_PY}" = "unknown" ]; then
            # A manual `districts` override skips the pipeline's discovery, so
            # its program_year is literally 'unknown' (#1343) and there is
            # nothing to assert against. Fail CLOSED: an unverified sidecar
            # written under the wrong program year is the silent-404 failure
            # mode this issue exists to fix. Re-run without the override to
            # get the overlay.
            echo "::warning::[reports] pipeline program year is '${PIPELINE_PY}'" \
              "(discovery skipped by a manual districts override, #1343) —" \
              "cannot assert agreement, refusing to place."
            echo "- ⚠️ pipeline program year **${PIPELINE_PY:-<empty>}** —" \
              "cannot assert, nothing placed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${PIPELINE_PY}" != "${REPORTS_PY}" ]; then
            echo "::error::[reports] PROGRAM-YEAR MISMATCH (#1284): pipeline" \
              "resolved '${PIPELINE_PY}' but the reports fetch resolved" \
              "'${REPORTS_PY}'. The two resolvers disagree — refusing to place." \
              "Snapshot publish is unaffected."
            {
              echo "- ❌ **PROGRAM-YEAR MISMATCH (#1284)** — nothing placed."
              echo "  - pipeline: \`${PIPELINE_PY}\`"
              echo "  - reports:  \`${REPORTS_PY}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "place=true" >> "$GITHUB_OUTPUT"
          echo "- ✅ Program year agreed: \`${PIPELINE_PY}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: '[reports] Place datasets into the snapshot directory'
        id: place
        if: steps.py-assert.outputs.place == 'true'
        run: |
          SNAPSHOT_DATE="${{ needs.pipeline.outputs.snapshot_date }}"
          RAW_DATE="${{ needs.daily-reports.outputs.raw_date }}"
          STAGED="${{ needs.daily-reports.outputs.staged }}"
          INCOMING="gs://${GCS_BUCKET}/incoming/daily-reports/${RAW_DATE}"

          if [ "${STAGED:-0}" -eq 0 ] 2>/dev/null; then
            echo "::warning::[reports] daily-reports staged 0 datasets — nothing to place."
            echo "- ⚠️ 0 datasets staged — nothing placed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${RAW_DATE}" != "${SNAPSHOT_DATE}" ]; then
            echo "Closing period: reports collected on ${RAW_DATE} → snapshot ${SNAPSHOT_DATE} (#309)"
          fi

          # Down-then-up rather than a GCS→GCS rewrite, deliberately: the
          # CDN-facing object must be byte-for-byte the same shape the
          # pipeline's own `[daily] Upload to GCS` step produces (gzipped via
          # -Z with the same two headers), and `cp -Z` is an UPLOAD-side flag.
          rm -rf /tmp/daily-reports && mkdir -p /tmp/daily-reports
          gcloud storage cp "${INCOMING}/district_*_reports.json" /tmp/daily-reports/
          COUNT=$(find /tmp/daily-reports -maxdepth 1 -name 'district_*_reports.json' \
            | wc -l | tr -d ' ')
          if [ "${COUNT}" -eq 0 ]; then
            echo "::warning::[reports] incoming prefix ${INCOMING}/ is empty — nothing placed."
            echo "- ⚠️ incoming prefix empty — nothing placed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Same headers as the pipeline's snapshot upload.
          gcloud storage cp \
            --content-type="application/json" \
            --cache-control="public, max-age=3600, must-revalidate" \
            -Z \
            /tmp/daily-reports/*.json \
            "gs://${GCS_BUCKET}/snapshots/${SNAPSHOT_DATE}/"

          {
            echo "- ✅ Placed **${COUNT}** datasets into \`staging:snapshots/${SNAPSHOT_DATE}/\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # ── PROD PATH — explicit mirror, chosen over the next-day rsync ──
          # This job runs AFTER `pipeline` has already promoted, so the
          # sidecars miss that run's `gsutil -m rsync -r snapshots/`. The
          # alternative — let tomorrow's promotion sweep them up — means the
          # frontend reads a day-old overlay, a miniature repeat of the silent
          # staleness this issue exists to fix. So mirror explicitly, gated on
          # the same two gates that let `pipeline` promote.
          if [ "${{ needs.pipeline.outputs.promoted }}" = "true" ]; then
            gcloud storage cp \
              --content-type="application/json" \
              --cache-control="public, max-age=3600, must-revalidate" \
              -Z \
              /tmp/daily-reports/*.json \
              "gs://${GCS_BUCKET_PRODUCTION}/snapshots/${SNAPSHOT_DATE}/"
            echo "- ✅ Mirrored to \`prod:snapshots/${SNAPSHOT_DATE}/\` (this run promoted)" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::[reports] This run did not promote, so the reports" \
              "stay staging-only. They reach prod with the next promoting run's" \
              "snapshots/ rsync."
            echo "- ⏸️ Promotion was held — reports are staging-only until the next promoting run." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # Best-effort teardown of the run-scoped hand-off prefix so `incoming/`
      # never accumulates. Runs on every path, including a refused placement:
      # the datasets are cheap to regenerate and a wrong-program-year set has
      # no forensic value.
      - name: '[reports] Clean up the incoming prefix'
        if: always()
        run: |
          RAW_DATE="${{ needs.daily-reports.outputs.raw_date }}"
          if [ -z "${RAW_DATE}" ]; then
            echo "No raw date from daily-reports — nothing to clean up."
            exit 0
          fi
          gcloud storage rm -r "gs://${GCS_BUCKET}/incoming/daily-reports/${RAW_DATE}/" 2>/dev/null \
            || echo "Nothing to clean up at incoming/daily-reports/${RAW_DATE}/"
