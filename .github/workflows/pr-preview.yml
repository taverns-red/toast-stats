# Per-PR Firebase Hosting preview channels (#554)
#
# Builds the frontend on every PR push and publishes it to a temporary
# Firebase Hosting preview channel under the `staging` site. Posts (or
# updates) a sticky PR comment with the live URL.
#
# Channels auto-expire after 7 days. Closed/merged PRs are also reaped
# explicitly on close by pr-preview-cleanup.yml (#741), so the staging
# site's ~50-channel quota frees immediately rather than waiting on TTL.
#
# Re-uses the same Workload Identity Federation credentials that
# .github/workflows/deploy.yml uses for production deploys, so no
# additional IAM setup is required.

name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - 'packages/shared-contracts/**'
      - 'packages/analytics-core/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/pr-preview.yml'
      - 'scripts/check-hosting-site.sh'

# Cancel an in-flight preview build when a new push to the same PR
# arrives — only the latest commit gets a deploy.
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # Required for Workload Identity Federation
  pull-requests: write # Required to post the preview-URL comment

jobs:
  preview:
    name: Deploy preview channel
    runs-on: ubuntu-26.04
    # Skip PRs from forks — WIF tokens are not issued to fork branches,
    # and we don't want to leak credentials to untrusted code anyway.
    # Fork contributors fall back to local-checkout for visual review.
    # Also skip Dependabot: its branches are intra-repo (so the fork guard
    # passes) but its runs get no access to the Actions secret store, so the
    # GCP auth step would fail. Dependency bumps have no UI to preview (#733).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build dependency packages
        run: |
          npm run build:shared-contracts
          npm run build:analytics-core

      - name: Build frontend
        run: npm run build:frontend
        env:
          # Preview channels point at the same data as staging; both
          # use the staging CDN bucket so the preview matches what the
          # post-merge staging deploy will look like.
          VITE_CDN_BASE_URL: https://storage.googleapis.com/toast-stats-data-staging

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          # Exact pin (#1720): `latest` resolves from setup-cloud-sdk's stale
          # manifest (568.0.0), whose rsync keeps gzip bytes (#1702). >= 576.
          version: '588.0.0'

      - name: Log Cloud SDK version
        run: gcloud version

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      # Fail fast with an actionable error if the staging site is missing
      # (new projects get no default Hosting site since 2026-10-15). Checks
      # only — never creates a site from CI (#1585).
      - name: Preflight — Hosting site exists
        run: scripts/check-hosting-site.sh staging
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy preview channel
        id: deploy
        # Use firebase-tools directly (matches deploy.yml) rather than
        # FirebaseExtended/action-hosting-deploy, which expects a JSON
        # service-account key — incompatible with our WIF-only setup.
        run: |
          set -o pipefail
          CHANNEL_ID="pr-${{ github.event.pull_request.number }}"

          # Capture stdout and stderr separately so that a non-zero exit
          # surfaces firebase's actual error message in the logs.
          # `--json` writes the result envelope to stdout on success.
          # NOTE: `firebase hosting:channel:deploy --only` takes the deploy
          # target name directly (e.g. `staging`), unlike `firebase deploy
          # --only` which expects `hosting:staging`. Mixing them up yields:
          #   "Hosting site or target hosting:staging not detected"
          if ! firebase hosting:channel:deploy "$CHANNEL_ID" \
              --only "staging" \
              --project "${{ secrets.GCP_PROJECT_ID }}" \
              --expires 7d \
              --json > /tmp/firebase-out.json 2> /tmp/firebase-err.log; then
            echo "::group::firebase stdout"
            cat /tmp/firebase-out.json || true
            echo "::endgroup::"
            echo "::group::firebase stderr"
            cat /tmp/firebase-err.log || true
            echo "::endgroup::"
            echo "::error::firebase hosting:channel:deploy failed"
            exit 1
          fi

          echo "::group::firebase output"
          jq . /tmp/firebase-out.json || cat /tmp/firebase-out.json
          echo "::endgroup::"

          URL=$(jq -r '.result.staging.url // empty' /tmp/firebase-out.json)
          EXPIRES=$(jq -r '.result.staging.expireTime // empty' /tmp/firebase-out.json)
          if [ -z "$URL" ]; then
            echo "::error::could not parse channel URL from firebase output"
            exit 1
          fi
          {
            echo "url=$URL"
            echo "expires=$EXPIRES"
          } >> "$GITHUB_OUTPUT"
          echo "Preview URL: $URL"
          echo "Expires: $EXPIRES"

      - name: Post sticky PR comment with preview URL
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-preview
          message: |
            ## 🚀 Preview deployed

            **Live URL:** ${{ steps.deploy.outputs.url }}

            _Channel expires: ${{ steps.deploy.outputs.expires }}_

            Updated on every push to this PR. The channel is removed
            automatically when this PR closes.

      # Lightweight cross-engine smoke against the freshly-deployed preview
      # (#713). #685 verified contrast in Chromium-at-rest only and missed a
      # Safari-visible regression (#710); running the legibility smoke in BOTH
      # the `smoke` (Chromium) and `webkit` (Safari) projects closes that blind
      # spot for every frontend PR. A declared-but-uninstalled engine is inert,
      # so install webkit explicitly before the run (cf. lesson 082).
      - name: Install Playwright browsers (chromium + webkit)
        run: npx playwright install --with-deps chromium webkit

      - name: Cross-engine legibility smoke against preview
        working-directory: frontend
        env:
          # Drive the actual deployed preview, not staging's default.
          BASE_URL: ${{ steps.deploy.outputs.url }}
        # No --project filter → runs every project (Chromium + WebKit). A
        # Safari-only rendering regression fails the webkit project while
        # Chromium stays green — exactly the #710 class.
        run: npx playwright test --config playwright.config.ts e2e/regions-legibility.smoke.ts

      # Dual-engine 44px touch-target tripwire (#887, epic #888 Sprint 3). Locks
      # in the #886 family-A/B/C fix: every interactive element on every routed
      # page must keep the 44px floor in BOTH engines. WebKit ignores min-height
      # on a native <select> without appearance:none (lesson 111), so a
      # Chromium-only check is blind — runs both projects like the smoke above.
      - name: Cross-engine 44px touch-target tripwire against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test --config playwright.config.ts e2e/touch-targets.smoke.ts

      # Breadcrumb baseline-alignment tripwire (#1387). The step above proves
      # the 44px floor is MET; this one proves the box it inflates does not
      # wreck the layout inside it. The crumb <a> is a flex item, so the floor
      # makes it a 48px box whose text painted at the TOP while the floor-free
      # `›` spans centred — a row on two visual baselines that no existing gate
      # could see (not a shift, not a contrast failure, not a sub-44 target).
      # Both engines: Chromium and WebKit resolve the text line box differently
      # (0.5px vs 0.0px residue), so only a cross-engine run proves the fix
      # holds in each.
      - name: Cross-engine breadcrumb alignment tripwire against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: >-
          npx playwright test --config playwright.config.ts
          e2e/breadcrumb-alignment.smoke.ts

      # Tooltip viewport-collision tripwire (#1405). The two shared tooltip
      # components centre a fixed-width panel on their trigger with no
      # collision handling, so a trigger in a card's leftmost column opened the
      # panel at left −67 and the landing page's rightmost table header ran to
      # right 1407 in a 1350px viewport. Nothing existing could see it: the
      # panel is visible, contrasty, above 44px and causes no shift — it is
      # simply half off-screen. Real geometry at 375/768/1350 in light and
      # dark, both engines, and the 44px trigger floor re-asserted so the
      # shrink-the-control "fix" cannot turn this green.
      - name: Cross-engine tooltip viewport-clip tripwire against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: >-
          npx playwright test --config playwright.config.ts
          e2e/tooltip-viewport-clip.smoke.ts

      # Mobile loading/error→loaded CLS guard (#922). The Lighthouse CLS gate
      # runs the desktop preset, where the landing header actions lay out
      # inline — it is blind to the mobile-only stack that pushed the KPI
      # strip down ~148px on loading→loaded at 390px. Bounding-box equality
      # across states (Lesson 134), both engines, against the real preview.
      - name: Cross-engine mobile CLS guard against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test --config playwright.config.ts e2e/landing-mobile-cls.smoke.ts

      # 375px CLS budget under real throttling (#1373). The guard above proves
      # loading→loaded geometry; this one measures the Core Web Vital itself,
      # which no existing gate can see: lighthouserc.js runs `preset: desktop`
      # (mobile is never sampled) against localhost:4173, and Chromium does not
      # throttle loopback — so a `display=swap` font reflow worth 0.151 at
      # 375px on main read ~0.00 everywhere and shipped. Cold cache + CDP
      # Fast-3G + a pre-navigation layout-shift observer, on the deployed
      # channel. Chromium-only by design: the webkit project skips itself,
      # because layout-shift and CDP throttling are both Chromium-only.
      - name: Mobile font-swap CLS budget against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test --config playwright.config.ts e2e/landing-font-swap-cls.smoke.ts

      # District overview CLS budget (#1647). lighthouserc.js only loads `/`,
      # so /district/:id carried CLS 0.25 (desktop) / 0.44 (mobile) with every
      # gate green: late inserts and skeleton→panel height mismatches in the
      # Overview stack. Cold cache, pre-navigation layout-shift observer, the
      # current and a past program year, 412px and 1350px, on the deployed
      # channel. Chromium-only: the webkit project skips itself.
      - name: District overview CLS budget against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test --config playwright.config.ts e2e/district-overview-cls.smoke.ts

      # District subpages CLS budget (#1837). The Overview gate above covers
      # /district/:id only; the eight routed subpages had none, and divisions,
      # analytics and action-list shipped at 0.20–0.30. Lighthouse mobile
      # throttling (150ms RTT, 1.6 Mbps, 4x CPU), cold cache, 375 and 1280,
      # on the deployed channel. Chromium-only: the webkit project skips.
      - name: District subpages CLS budget against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test --config playwright.config.ts e2e/district-subpages-cls.smoke.ts

      # No horizontal page scroll (#1651, #1655). The document's scrollWidth
      # must not exceed the viewport at 375/768/1280 in both themes on the
      # shell routes, /clubs, and /district/61 (+ Analytics) with real data, so
      # an overflow from any component fails the PR. Both engines.
      - name: Cross-engine no-horizontal-scroll guard against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test --config playwright.config.ts e2e/no-horizontal-scroll.smoke.ts

      # District KPI strip never pinned over the Overview on a phone (#1828,
      # mobile review S2). At 375 on /district/61 and /district/80 the strip
      # is in flow and not under the viewport centre at scroll 1200, and no
      # sticky/fixed element is taller than 64px; at 1280 it stays sticky
      # (#572). Both engines: position is width-driven, not touch-driven.
      - name: Cross-engine district KPI strip mobile guard against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test --config playwright.config.ts e2e/district-kpi-strip-mobile.smoke.ts

      # Phone context bar (#1831, mobile review §5.1). At 375/390 on all 9
      # district routes one sticky 44px bar replaces the header stack, the H1
      # stays in the DOM, and the section nav starts by 110px; the chip opens
      # a bottom sheet with 16px selects and PY round-trips through ?py=. At
      # 768/1280 the desktop header is unchanged. Both engines.
      - name: Cross-engine phone context bar guard against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test --config playwright.config.ts e2e/context-bar.smoke.ts

      # Landing first screen on phones (#1846, mobile review §7 item 19). At
      # 375/390, light and dark: the context bar replaces the header stack,
      # search precedes the first KPI, the first KPI starts by 300px, the
      # orientation copy is in the sheet, and each chip row fades only the
      # edges that still hide chips. 768/1280 keep the inline header.
      - name: Cross-engine landing first-screen guard against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test --config playwright.config.ts e2e/landing-first-screen.smoke.ts

      # Phone bottom section bar (#1832, mobile review §5.1). At 375/390 in
      # portrait, light and dark, on all 9 district routes: a 56px fixed bar
      # (4 routes + More), labels inside their 44px+ items, content under the
      # context bar by 110px and the page end clear of the bar; More opens
      # the shared sheet. Landscape, 768 and 1280 keep the scroll-row.
      - name: Cross-engine phone section bar guard against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test --config playwright.config.ts e2e/section-bar.smoke.ts

      # Self-hosted basemap (#1786, ADR-016). At 375, light and dark, on the
      # unlisted /dev/basemap page: MapLibre draws the Protomaps archive read
      # with HTTP range requests (served from the committed z0 fixture until
      # the real object is uploaded), inside the viewport with no sideways
      # scroll, ODbL credit visible and expanded, no CSP/worker error on the
      # deployed headers. Both engines.
      - name: Cross-engine basemap guard against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test --config playwright.config.ts e2e/basemap-375.smoke.ts

      # District Overview hub (#1842, mobile review §5.5). At 375, light and
      # dark: 2x2 KPI tiles (block <= 300px, was 860px) starting at the hub's
      # left edge (no side toggle), Needs attention above the section bar,
      # page <= 4,000px, no info tooltips; a tile opens its sheet; landscape
      # phones get 4x1; 1280 keeps the desktop strip. Both engines.
      - name: Cross-engine district Overview hub guard against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test --config playwright.config.ts e2e/district-overview-hub-mobile.smoke.ts

      # Safe-area + landscape (#1847, mobile review S11 / §4.2). viewport-fit
      # =cover; with iPhone insets emulated (Chromium CDP) the top bar clears
      # the notch, the section bar's targets and the sheets clear the home
      # indicator, sheets stay inside the visible viewport; at 812x375 and
      # iPhone landscape profiles the context bar replaces the header stack,
      # the top bar scrolls away, first data <= 200px. Light + dark, both
      # engines (WebKit at inset 0).
      - name: Cross-engine safe-area and landscape guard against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test --config playwright.config.ts e2e/safe-area-landscape.smoke.ts

      # Priority-column comparison tables (#1834, mobile review §5.2). At
      # 375/390, light and dark: identity + 2 chosen metrics, zero hidden
      # columns and zero document overflow with the body mask off, one-line
      # headers, 44px targets, 14px text, tier chips inside their cells by
      # bounding box; "Full table" opens a full-screen labelled region. 768
      # and 1280 keep the full table. Both engines.
      - name: Cross-engine priority-columns guard against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test --config playwright.config.ts e2e/priority-columns.smoke.ts

      # Phone clubs list as compact rows (#1833, mobile review §4.1). At 375,
      # light and dark: collapsed division groups with counts (page ≤ 2,500px),
      # every row 56–64px with its chip whole by bounding box, text ≥14px, no
      # contact details, zero overflow with the body mask off; the flat list
      # caps at 50 + "Show 25 more" (≤ 8,000px); ?open=, the FilterSheet's
      # status/sort and ?search= round-trip through a reload. 768 and 1280
      # keep the desktop table. Both engines.
      - name: Cross-engine phone clubs rows guard against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test --config playwright.config.ts e2e/clubs-mobile-rows.smoke.ts

      # Club grid on phones (#1845). At 375, light and dark: tiles are
      # buttons ≥44px that open the club sheet (name, status, link), the grid
      # has 0 title-only tooltips, legend chips are ≥14px and the document
      # does not overflow. At 1280 the tiles stay links (desktop unchanged).
      - name: Cross-engine phone club grid guard against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test --config playwright.config.ts e2e/club-grid-mobile.smoke.ts

      # Form controls ≥16px below 768 (#1838). Every input/select at 375 and
      # 767 (incl. the transparent chip-select overlays and the context-bar
      # and Filter & sort sheets) has a computed font-size ≥16px, so iOS
      # Safari does not zoom on focus; selects keep their 44px box. Both
      # engines (WebKit resolves form-control fonts differently, L111).
      - name: Cross-engine form-control 16px guard against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test --config playwright.config.ts e2e/form-controls-16px.smoke.ts

      # AA text contrast (#1839). 0 failures, light and dark, on the 404 page
      # (amber code, dark "Go home") and the club-history table at 768
      # (amber year links); the dark skip link is measured on both. Both
      # engines.
      - name: Cross-engine AA contrast guard against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test --config playwright.config.ts e2e/contrast-aa.smoke.ts

      # Phone type floor (#1840, mobile review §7). At 375 on the 23 routes
      # the review and the 2.48.0 prod sweep measured: ≤15% of visible
      # characters under 14px and nothing visible under 12px (12px is for
      # uppercase eyebrows only; sr-only text excluded). Both engines.
      - name: Cross-engine phone type floor guard against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test --config playwright.config.ts e2e/type-floor.smoke.ts

      # Landing scroll budget (#864, #1834). At 375/414, both engines, `/` must
      # stay ≤ 8,000px tall with the phone rankings in their default 25-row
      # reveal. It was a local-only smoke; running it here flags growth (more
      # districts, a new section) before it lands instead of after.
      - name: Cross-engine landing scroll budget against preview
        working-directory: frontend
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npx playwright test --config playwright.config.ts e2e/landing-mobile-scroll.smoke.ts

      # Lighthouse MOBILE gate (#1830, mobile epic #1827). lighthouserc.js is
      # desktop-only on `/` against localhost fixtures; this runs Lighthouse's
      # mobile profile (simulated 150 ms RTT / 1.6 Mbps / 4x CPU) on the five
      # #1830 routes against the deployed channel — real CSP, staging CDN data,
      # real fonts. Assertions are `warn` for the first green week, then
      # promoted to `error` (recorded on #1830); see lighthouserc.mobile.js for
      # the per-route budgets and their ratchet issue.
      - name: Lighthouse mobile gate against preview
        uses: treosh/lighthouse-ci-action@v12
        env:
          LHCI_BASE_URL: ${{ steps.deploy.outputs.url }}
        with:
          configPath: './lighthouserc.mobile.js'
          uploadArtifacts: true
          temporaryPublicStorage: true
