# Production Deployment Workflow
# Deploys frontend to Firebase Hosting on a release-please release
# (ADR-004). Production deploys are release-gated, not merge-gated:
# release-please.yml calls this workflow when a release PR is merged
# (releases_created == 'true'). workflow_dispatch is the manual/hotfix path.
#
# Full CI runs on PRs and on the release PR (a PR to main), so there is no
# redundant per-merge CI re-run here.
#
# Prerequisites:
#   1. Run scripts/setup-wif.sh (one-time)
#   2. Add GitHub secrets: GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
#
# Auto-rollback (#2492): the job records the live Hosting version before
# `firebase deploy`, smokes the core path for ~10 minutes after it, and on a
# failed smoke re-releases the recorded version, smokes that, files or
# updates a `hosting-rollback` issue and fails. Override: the
# skip_auto_rollback input, or the repo variable HOSTING_AUTO_ROLLBACK=off.
# Runbook: docs/runbooks/hosting-auto-rollback.md

name: Deploy

on:
  # Invoked by release-please.yml when a release is published. Secrets are
  # passed via `secrets: inherit` from the caller.
  workflow_call:
    inputs:
      skip_auto_rollback:
        description: 'Skip the automatic Hosting rollback after a failed smoke'
        required: false
        type: boolean
        default: false
  # Manual / emergency hotfix deploy from any state.
  workflow_dispatch:
    inputs:
      skip_auto_rollback:
        description: 'Skip the automatic Hosting rollback after a failed smoke'
        required: false
        type: boolean
        default: false

# Prevent concurrent deployments
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGION: 'northamerica-northeast1'
  GCS_BUCKET: 'toast-stats-data-ca'

# Least privilege for the deploy job. The redundant CI gate job (which
# needed packages / pull-requests / security-events) was removed in
# ADR-004, so those scopes are gone. When called from release-please.yml
# these are capped by that workflow's permissions; they apply directly on
# a workflow_dispatch run.
permissions:
  contents: write # version tags / git metadata
  id-token: write # Workload Identity Federation (GCP auth)
  issues: write # hosting-rollback alert issue (#2492)

jobs:
  # ──────────────────────────────────────────────
  # Deploy Frontend to Firebase Hosting
  # ──────────────────────────────────────────────
  # No CI gate job here: CI already ran on the PR and again on the
  # release PR (the integration gate). See ADR-004.
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-26.04
    # Build + deploy + ~10 min smoke + rollback + restored smoke (#2492).
    timeout-minutes: 45
    env:
      # 'off' skips the auto-rollback (the issue is still filed and the job
      # still fails). See docs/runbooks/hosting-auto-rollback.md.
      AUTO_ROLLBACK: ${{ (inputs.skip_auto_rollback || vars.HOSTING_AUTO_ROLLBACK == 'off') && 'off' || 'on' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build dependency packages
        run: |
          npm run build:shared-contracts
          npm run build:analytics-core

      - name: Read version from package.json
        id: pkg
        # Use jq instead of node -p to avoid YAML/shell quote-escaping
        # gymnastics that previously made the substitution silently fail
        # (`require(\"./package.json\")` was parsed as invalid JS, $()
        # returned empty, VITE_APP_VERSION became literal "v"). jq is
        # already on the runner, no escaping needed.
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved package version: ${VERSION}"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          # Exact pin (#1720): `latest` resolves from setup-cloud-sdk's stale
          # manifest (568.0.0), whose rsync keeps gzip bytes (#1702). >= 576.
          version: '588.0.0'

      - name: Log Cloud SDK version
        run: gcloud version

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      # Before the deploy: if the browser cannot be installed, nothing is
      # released, so a release is never left live without its smoke (#2492).
      - name: Install Chromium for the post-deploy smoke
        run: npx playwright install --with-deps chromium

      # Fail fast with an actionable error if the production site is missing
      # (new projects get no default Hosting site since 2026-10-15). Checks
      # only — never creates a site from CI (#1585).
      - name: Preflight — Hosting site exists
        run: scripts/check-hosting-site.sh production
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}

      # The version to restore if the new release fails its smoke (#2492).
      - name: Record the live Hosting version
        id: record
        run: npx tsx scripts/hosting-release.ts record production
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build and deploy production
        id: deploy
        run: |
          set -o pipefail
          npm run build:frontend
          # firebase-tools exits non-zero when the finalized version already IS the
          # live version (unchanged frontend content, or an internal retry re-issuing
          # the release after it already succeeded). Hosting then already serves the
          # intended build, so treat that one condition as a no-op success — the same
          # defensive pattern pr-preview-cleanup.yml uses to tolerate a 404 (#1250).
          if firebase deploy --only hosting:production --project ${{ secrets.GCP_PROJECT_ID }} 2>&1 | tee /tmp/deploy.log; then
            : # released a new version
          elif grep -qiE "is the current active version" /tmp/deploy.log; then
            echo "::notice::Hosting already serves this exact version — no-op success (#1250)"
          else
            echo "::error::firebase deploy failed"
            exit 1
          fi
          echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
        env:
          VITE_APP_VERSION: v${{ steps.pkg.outputs.version }}

      # ── Auto-rollback (#2492) ──────────────────────
      # Decisions live in scripts/lib/hostingRollback.ts (unit-tested); the
      # step order is pinned by hostingRollbackWorkflow.test.ts.
      - name: Smoke the new release
        id: smoke
        run: npx tsx scripts/hosting-smoke.ts
        env:
          BASE_URL: https://ts.taverns.red
          CDN_BASE_URL: https://cdn.taverns.red
          EXPECTED_INDEX_HTML: frontend/dist/index.html
          SMOKE_WINDOW_SECONDS: '600'

      # Runs when the smoke failed OR crashed (no `healthy` output).
      - name: Roll back to the recorded version
        id: rollback
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.smoke.outputs.healthy != 'true' && env.AUTO_ROLLBACK == 'on' }}
        run: npx tsx scripts/hosting-release.ts rollback production
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          PREVIOUS_VERSION: ${{ steps.record.outputs.version }}

      - name: Smoke the restored release
        id: restored_smoke
        if: ${{ !cancelled() && steps.rollback.outputs.rolled_back == 'true' }}
        run: npx tsx scripts/hosting-smoke.ts
        env:
          BASE_URL: https://ts.taverns.red
          CDN_BASE_URL: https://cdn.taverns.red
          SMOKE_WINDOW_SECONDS: '120'

      - name: Build the rollback report
        id: report
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.smoke.outputs.healthy != 'true' }}
        run: npx tsx scripts/hosting-release.ts report
        env:
          SITE: ${{ steps.record.outputs.site }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREVIOUS_VERSION: ${{ steps.record.outputs.version }}
          BAD_VERSION: ${{ steps.rollback.outputs.bad_version }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outputs.outcome }}
          ROLLED_BACK: ${{ steps.rollback.outputs.rolled_back }}
          RESTORED_HEALTHY: ${{ steps.restored_smoke.outputs.healthy }}
          SMOKE_RESULT_FILE: ${{ steps.smoke.outputs.result_file }}
          DEPLOYED_AT: ${{ steps.deploy.outputs.deployed_at }}
          SMOKE_FINISHED_AT: ${{ steps.smoke.outputs.finished_at }}
          ROLLBACK_STARTED_AT: ${{ steps.rollback.outputs.started_at }}
          ROLLBACK_FINISHED_AT: ${{ steps.rollback.outputs.finished_at }}
          RESTORED_FINISHED_AT: ${{ steps.restored_smoke.outputs.finished_at }}

      - name: Open or update the rollback issue
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.smoke.outputs.healthy != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.report.outputs.title || 'Hosting release failed its smoke (auto-rollback)' }}
          BODY_FILE: ${{ steps.report.outputs.body_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create hosting-rollback --color B60205 \
            --description "A production Hosting release failed its post-deploy smoke" \
            2>/dev/null || echo "Label already exists"
          if [ -z "${BODY_FILE}" ] || [ ! -f "${BODY_FILE}" ]; then
            BODY_FILE="${RUNNER_TEMP}/hosting-rollback-fallback.md"
            echo "Post-deploy smoke failed and the report step did not run: ${RUN_URL}" > "${BODY_FILE}"
          fi
          # One open alert at a time: comment on it rather than open another.
          EXISTING=$(gh issue list --label hosting-rollback --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body-file "${BODY_FILE}"
          else
            gh issue create --title "${TITLE}" --label hosting-rollback \
              --body-file "${BODY_FILE}"
          fi

      - name: Fail the deploy when the smoke failed
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.smoke.outputs.healthy != 'true' }}
        env:
          OUTCOME: ${{ steps.report.outputs.outcome || 'unknown' }}
        run: |
          echo "::error::Post-deploy smoke failed (rollback outcome: ${OUTCOME}). A hosting-rollback issue has been filed. See docs/runbooks/hosting-auto-rollback.md"
          exit 1

      - name: Record DORA deploy metrics
        if: success()
        run: |
          DEPLOY_TIME=$(date -u +%s)
          COMMIT_TIME=$(git log -1 --format=%ct)
          LEAD_TIME=$((DEPLOY_TIME - COMMIT_TIME))
          VERSION="${{ steps.pkg.outputs.version }}"
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          cat <<METRICS_EOF > /tmp/deploy-metrics.json
          {
            "timestamp": "${TIMESTAMP}",
            "commitSha": "${GITHUB_SHA}",
            "leadTimeSeconds": ${LEAD_TIME},
            "deploySuccess": true,
            "version": "v${VERSION}",
            "actor": "${GITHUB_ACTOR}",
            "runId": ${GITHUB_RUN_ID}
          }
          METRICS_EOF

          gcloud storage cp \
            --content-type="application/json" \
            /tmp/deploy-metrics.json \
            "gs://${{ env.GCS_BUCKET }}/metrics/deploys/$(date -u +%Y-%m-%d_%H%M%S).json"

          echo "## 📊 DORA Metrics" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Lead time**: ${LEAD_TIME}s (commit → deploy)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: v${VERSION}" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────
  # Post-Deployment Verification
  # ──────────────────────────────────────────────
  post-deploy-verify:
    name: Post-Deploy Verification
    runs-on: ubuntu-26.04
    needs: [deploy-frontend]

    steps:
      - name: Wait for services to stabilize
        run: sleep 30

      - name: Health check
        run: |
          echo "## Post-Deployment Verification" >> "$GITHUB_STEP_SUMMARY"

          # Check CDN is serving data
          CDN_URL="https://cdn.taverns.red"

          echo "Checking CDN at ${CDN_URL}/v1/latest.json..."
          RESPONSE=$(curl -sf --max-time 30 "${CDN_URL}/v1/latest.json" || true)

          if echo "${RESPONSE}" | grep -q 'latestSnapshotDate'; then
            echo "✅ CDN health check passed" >> "$GITHUB_STEP_SUMMARY"
            echo "Response: ${RESPONSE}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ CDN health check returned unexpected response" >> "$GITHUB_STEP_SUMMARY"
            echo "Response: ${RESPONSE:-'(no response)'}" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::CDN health check did not return expected response. Manual verification recommended."
          fi

      - name: Deployment summary
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "🚀 Deployment complete for commit \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Frontend**: https://${{ secrets.GCP_PROJECT_ID }}.web.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Triggered by**: @${GITHUB_ACTOR}" >> "$GITHUB_STEP_SUMMARY"
