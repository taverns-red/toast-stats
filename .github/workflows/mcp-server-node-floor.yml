# mcp-server on its published Node floor (#2857, follow-up to #2853).
#
# @taverns-red/toast-stats-mcp is published with engines.node ">=22", but every
# other job runs on .nvmrc (Node 26). Nothing else would notice an API that
# only newer Node has. This job builds and tests the package on the floor read
# from the package's own engines field (scripts/mcp-server-node-floor.mjs), so
# raising the floor in package.json moves this job with it.
#
# Runs only when mcp-server, the shared-contracts it imports, or this file
# change, plus weekly (Mondays) so a floor-breaking dependency bump is caught
# too. It is deliberately not a required check and not part of CI Gate.
# No secrets, no cloud auth, contents: read only.
#
# When Node 22 reaches end of life (2027-04-30), raise the floor on purpose:
# see "Node floor" in packages/mcp-server/README.md.
name: MCP Server Node Floor

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/mcp-server/**'
      - 'packages/shared-contracts/**'
      - 'scripts/mcp-server-node-floor.mjs'
      - 'package-lock.json'
      - '.github/workflows/mcp-server-node-floor.yml'
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: mcp-server-node-floor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  floor:
    name: mcp-server on engines.node floor
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the Node floor from mcp-server engines
        id: floor
        run: node scripts/mcp-server-node-floor.mjs >> "$GITHUB_OUTPUT"

      - name: Setup Node.js (the floor)
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.floor.outputs.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared-contracts and mcp-server
        run: |
          npm run build:shared-contracts
          npm run build:mcp-server

      - name: Run mcp-server tests
        run: npm run test --workspace=@taverns-red/toast-stats-mcp
