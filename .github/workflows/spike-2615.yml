name: Spike 2615 (temporary)

# #2615 spike: apt off the PR Preview hot path. Temporary; deleted before merge.
on:
  pull_request:
    paths:
      - '.github/workflows/spike-2615.yml'
      - '.nvmrc'
      - 'frontend/playwright.config.ts'
      - 'frontend/e2e/**'

permissions:
  contents: read

jobs:
  spike-host:
    name: Spike host baseline
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: install-deps (host baseline)
        run: npx playwright install-deps chromium webkit
      - name: install browsers (host baseline)
        run: npx playwright install chromium webkit
      - name: Dump fonts and packages
        run: |
          mkdir -p "$RUNNER_TEMP/fonts"
          fc-list : family style | sort > "$RUNNER_TEMP/fonts/fc-list.txt"
          dpkg-query -W -f='${Package} ${Version}\n' | sort > "$RUNNER_TEMP/fonts/dpkg.txt"
          cat /etc/os-release > "$RUNNER_TEMP/fonts/os-release.txt"
          wc -l "$RUNNER_TEMP"/fonts/*.txt
          for f in sans-serif serif monospace system-ui ui-sans-serif ui-monospace Arial Helvetica Menlo; do echo "FCMATCH $f => $(fc-match "$f")"; done
      - uses: actions/upload-artifact@v7
        with:
          name: spike-fonts-host
          path: ${{ runner.temp }}/fonts/
          retention-days: 3

  spike-container:
    name: Spike container
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-resolute
      options: --ipc=host --init
    env:
      BASE_URL: https://ts.taverns.red
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Pinned version equals image tag
        run: |
          v=$(npx playwright --version)
          echo "$v"
          [ "$v" = "Version 1.64.1" ]
      - name: Dump fonts and packages
        run: |
          mkdir -p "$RUNNER_TEMP/fonts"
          fc-list : family style | sort > "$RUNNER_TEMP/fonts/fc-list.txt"
          dpkg-query -W -f='${Package} ${Version}\n' | sort > "$RUNNER_TEMP/fonts/dpkg.txt"
          cat /etc/os-release > "$RUNNER_TEMP/fonts/os-release.txt"
          wc -l "$RUNNER_TEMP"/fonts/*.txt
          for f in sans-serif serif monospace system-ui ui-sans-serif ui-monospace Arial Helvetica Menlo; do echo "FCMATCH $f => $(fc-match "$f")"; done
      - uses: actions/upload-artifact@v7
        with:
          name: spike-fonts-container
          path: ${{ runner.temp }}/fonts/
          retention-days: 3
      - name: Smoke in the container
        working-directory: frontend
        run: npx playwright test --config playwright.config.ts e2e/staging.smoke.ts --project=smoke

  spike-apt-cold:
    name: Spike apt cache cold
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Download the debs
        run: |
          set -euo pipefail
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-debs
          sudo rm -f /var/cache/apt/archives/*.deb
          sudo apt-get update -q
          npx playwright install-deps chromium webkit
          mkdir -p ~/apt-debs
          sudo cp /var/cache/apt/archives/*.deb ~/apt-debs/
          sudo chown -R "$USER" ~/apt-debs
          du -sh ~/apt-debs
          ls ~/apt-debs | wc -l
      - name: Save the cache
        uses: actions/cache/save@v6
        with:
          path: ~/apt-debs
          key: spike-2615-apt-${{ github.run_id }}-${{ github.run_attempt }}

  spike-apt-warm:
    name: Spike apt cache warm
    needs: spike-apt-cold
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Restore the cache
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-debs
          key: spike-2615-apt-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Install from cached debs
        run: |
          set -euo pipefail
          du -sh ~/apt-debs
          sudo dpkg -i ~/apt-debs/*.deb
      - name: install-deps is now a no-op
        run: npx playwright install-deps chromium webkit
      - name: install browsers
        run: npx playwright install chromium webkit
      - name: Dump fonts and packages
        run: |
          mkdir -p "$RUNNER_TEMP/fonts"
          fc-list : family style | sort > "$RUNNER_TEMP/fonts/fc-list.txt"
          dpkg-query -W -f='${Package} ${Version}\n' | sort > "$RUNNER_TEMP/fonts/dpkg.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: spike-fonts-debcache
          path: ${{ runner.temp }}/fonts/
          retention-days: 3
