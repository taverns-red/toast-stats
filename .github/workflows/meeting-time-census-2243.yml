# TEMPORARY (#2243): one read-only census of meetingTime strings over the
# public prod CDN. No credentials, no GCS writes, no dispatch. Removed from
# the PR before it is marked ready.
name: Meeting-time census (#2243, temporary)

on:
  pull_request:
    paths:
      - scripts/meeting-time-census.ts
      - .github/workflows/meeting-time-census-2243.yml

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:shared-contracts
      - run: npx tsx scripts/meeting-time-census.ts census-out
      - uses: actions/upload-artifact@v7
        with:
          name: meeting-time-census-2243
          path: census-out/
          retention-days: 3
