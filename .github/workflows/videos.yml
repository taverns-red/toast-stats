# How-to video renders (#2293)
#
# Captures a scenario's walkthrough from the live site (ts.taverns.red) with
# Playwright and renders it with Remotion on the runner, then uploads the
# MP4s as an Actions artifact. Rendered videos are build outputs: they never
# enter the source tree, not even `.pr-assets` (Ron, PR #2295).
#
# Opt-in only:
#   - workflow_dispatch -> choose the scenario and desktop / mobile / both
#   - pull_request      -> only when videos/** (or this file) changes; renders
#                          every scenario file the PR adds or changes
#                          (videos/src/scenarios/v<N>.ts), or v2 when it
#                          changes none, in both formats, one matrix leg per
#                          scenario (#2353), plus a short audio preview of
#                          each music variant (a separate artifact, #2344),
#                          and posts a sticky comment that links them all.
#                          The path filter stays this wide on purpose: a
#                          dependency bump of videos/package.json (Playwright,
#                          Remotion) changes the capture and should render.
#                          Live-site timing no longer fails it: the capture
#                          waits for the scenario's ready element and the
#                          app's own data requests, not `networkidle` (#2410).
# Main CI runs only the scenario unit tests (ci.yml); it never renders.
#
# No cloud credentials: the capture reads the public site and the output goes
# to the artifact only. Publishing a reviewed render to the CDN is a separate,
# per-publish-approved workflow, videos-publish.yml (#2310).

name: Videos

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario id (e.g. v2)'
        required: true
        default: 'v2'
        type: string
      format:
        description: 'Form factor to render'
        required: true
        default: 'both'
        type: choice
        options:
          - desktop
          - mobile
          - both
  pull_request:
    paths:
      - 'videos/**'
      - '.github/workflows/videos.yml'
      - '.nvmrc' # setup-node reads it (#2005)

# One render per PR at a time; a new push cancels the in-flight one.
concurrency:
  group: videos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which scenarios to render: the dispatched one, or on a PR each scenario
  # file it adds or changes (v2 when none). The PR checkout is the merge
  # commit, so HEAD^1 is the base branch tip (fetch-depth 2).
  plan:
    name: Plan scenarios
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      scenarios: ${{ steps.plan.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Resolve the scenarios to render
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ids="$IN_SCENARIO"
          else
            git diff --name-only --diff-filter=d HEAD^1 HEAD -- videos/src/scenarios \
              > "$RUNNER_TEMP/changed.txt"
            ids=$(sed -nE 's#^videos/src/scenarios/(v[0-9]+)\.ts$#\1#p' \
              "$RUNNER_TEMP/changed.txt" | sort -u | tr '\n' ' ')
            if [ -z "${ids// /}" ]; then ids="v2"; fi
          fi
          read -ra list <<< "$ids"
          json=$(printf '%s\n' "${list[@]}" | jq -R . | jq -cs .)
          echo "Scenarios: $json"
          echo "scenarios=$json" >> "$GITHUB_OUTPUT"

  render:
    name: Capture and render (${{ matrix.scenario }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
    runs-on: ubuntu-26.04
    # A capture holds each beat in real time (~35 s per format) and a 30 s
    # render takes a few minutes on a runner; 30 min leaves room for both
    # formats plus installs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Resolve scenario and formats
        id: args
        env:
          IN_SCENARIO: ${{ matrix.scenario }}
          IN_FORMAT: ${{ inputs.format || 'both' }}
        run: |
          if ! printf '%s' "$IN_SCENARIO" | grep -Eq '^[a-z0-9-]+$'; then
            echo "::error::Invalid scenario id: $IN_SCENARIO"
            exit 1
          fi
          case "$IN_FORMAT" in
            both) FORMATS="desktop mobile" ;;
            desktop|mobile) FORMATS="$IN_FORMAT" ;;
            *) echo "::error::Invalid format: $IN_FORMAT"; exit 1 ;;
          esac
          {
            echo "scenario=$IN_SCENARIO"
            echo "formats=$FORMATS"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      # No apt (#2339): on 2026-10-26 azure.archive.ubuntu.com crawled at
      # ~120 kB/s and `apt-get install ffmpeg` timed the job out three times.
      # Take BtbN's static GPL build of the FFmpeg 8.1 release branch instead
      # (libx264, native aac, ebur128, ffprobe), from a month-end autobuild,
      # which BtbN keeps long-term, checked by SHA-256 (the hash GitHub and
      # the release's checksums.sha256 both publish). Keep the pin the same
      # in videos-publish.yml (scripts/lib/__tests__/videosFfmpegInstall.test.ts).
      - name: Install ffmpeg (pinned static build)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          url='https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1.tar.xz'
          sha='97ce978979194b5cf7e06a5e68020dbdaa7a4f3294c5452b6a1bc347100dbb79'
          dir="$HOME/.local/ffmpeg/bin"
          curl -fsSL --retry 3 --connect-timeout 20 -o "$RUNNER_TEMP/ffmpeg.tar.xz" "$url"
          echo "$sha  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p "$dir"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$dir" --strip-components=2 \
            --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          rm "$RUNNER_TEMP/ffmpeg.tar.xz"
          echo "$dir" >> "$GITHUB_PATH"
          export PATH="$dir:$PATH"
          # Read each output from a file: `head` or `grep -q` closing a pipe
          # early would fail the step under pipefail (R14).
          ffmpeg -hide_banner -version > "$RUNNER_TEMP/ffmpeg-version.txt"
          ffprobe -version > "$RUNNER_TEMP/ffprobe-version.txt"
          head -n 1 "$RUNNER_TEMP/ffmpeg-version.txt" "$RUNNER_TEMP/ffprobe-version.txt"
          ffmpeg -hide_banner -encoders > "$RUNNER_TEMP/ffmpeg-encoders.txt"
          ffmpeg -hide_banner -filters > "$RUNNER_TEMP/ffmpeg-filters.txt"
          for enc in libx264 aac; do
            grep -Eq "^ [A-Z.]{6} $enc " "$RUNNER_TEMP/ffmpeg-encoders.txt" \
              || { echo "::error::ffmpeg has no $enc encoder"; exit 1; }
          done
          grep -Eq '^ [A-Z.]{2,3} ebur128 ' "$RUNNER_TEMP/ffmpeg-filters.txt" \
            || { echo "::error::ffmpeg has no ebur128 filter"; exit 1; }

      # The runner image already ships every library Chromium needs; on
      # ubuntu-26.04 `--with-deps` only added fonts (CJK, unifont, freefont)
      # and libnss3/xvfb upgrades, through the same apt mirror (#2339). The
      # browser itself comes from Playwright's CDN, cached per version.
      - name: Resolve the Playwright version
        id: playwright
        run: |
          set -euo pipefail
          version=$(npx playwright --version)
          [[ "$version" =~ ^Version\ [0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::unexpected playwright --version: $version"; exit 1; }
          echo "version=${version#Version }" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: npx playwright install chromium

      # The live site's mobile rows use `system-ui, -apple-system, "Segoe UI",
      # Arial, sans-serif` with no web font, so on a bare runner Chromium
      # resolves them to DejaVu Sans, which is far wider than a phone's UI
      # font and truncates club names in the mobile capture. Install Inter
      # (Google Fonts' static 400/500/600/700 TTFs, pinned to release v20 and
      # checked by SHA-256) and make it the runner's system-ui / sans-serif.
      # The composition itself loads the app's own Inter and Montserrat woff2.
      - name: Install Inter as the system UI font
        run: |
          set -euo pipefail
          dir="$HOME/.local/share/fonts/inter"
          mkdir -p "$dir"
          base='https://fonts.gstatic.com/s/inter/v20'
          prefix='UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVu'
          while read -r sha suffix; do
            file="${prefix}${suffix}.ttf"
            curl -fsSL --retry 3 -o "$dir/$file" "$base/$file"
            echo "$sha  $dir/$file" | sha256sum -c -
          done <<'FONTS'
          1b08e7fc267a5c7e1d614100f604b83e7e8a0be241f0f288faa2b3ac93a683ba LyfMZg
          8c883f63b2c4157d997319f2c8bc6995ed4357ef371940d31ca159004a4aae63 I6fMZg
          e7a1aaf7eda9f2fad4131725fa556265ec75ca7b2d756260173a040363e8d4f7 GKYMZg
          b37284b5701b6b168dfc770aa1a4ac492106422fd3ba76bc7641e37434e8019c FuYMZg
          FONTS
          mkdir -p "$HOME/.config/fontconfig"
          cat > "$HOME/.config/fontconfig/fonts.conf" <<'CONF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias binding="strong">
              <family>system-ui</family><prefer><family>Inter</family></prefer>
            </alias>
            <alias binding="strong">
              <family>sans-serif</family><prefer><family>Inter</family></prefer>
            </alias>
            <alias binding="strong">
              <family>sans</family><prefer><family>Inter</family></prefer>
            </alias>
          </fontconfig>
          CONF
          fc-cache -f

      - name: Check Inter is installed and is the UI font
        run: |
          set -euo pipefail
          # Read fc-list once: `grep -q` closing the pipe early would fail
          # the step under pipefail (R14).
          fc-list : family style > "$RUNNER_TEMP/fonts.txt"
          grep -E '^Inter' "$RUNNER_TEMP/fonts.txt" | sort
          for weight in Regular Medium SemiBold Bold; do
            grep -q "^Inter.*$weight" "$RUNNER_TEMP/fonts.txt" \
              || { echo "::error::Inter $weight is not installed"; exit 1; }
          done
          # fc-match patterns treat '-' as a size separator, so escape it.
          for family in 'system\-ui' 'sans\-serif' 'sans' 'sans\-serif:semibold'; do
            match=$(fc-match "$family")
            echo "$family -> $match"
            case "$match" in
              *'"Inter"'*) ;;
              *) echo "::error::$family resolves to $match, not Inter"; exit 1 ;;
            esac
          done
          fc-match 'sans\-serif:semibold' | grep -q '"SemiBold"' \
            || { echo "::error::sans-serif semibold is not Inter SemiBold"; exit 1; }

      # The music generator's ffmpeg-backed tests (duration, -26 LUFS, true
      # peak, determinism, preview encoding). Main CI has no ffmpeg, so they
      # run here, before anything is rendered with the track (#2336).
      - name: Test the music generator (ffmpeg)
        run: npm run test:audio --workspace=@taverns-red/videos

      - name: Capture and render
        env:
          SCENARIO: ${{ steps.args.outputs.scenario }}
          FORMATS: ${{ steps.args.outputs.formats }}
        run: |
          for format in $FORMATS; do
            npm run videos:build -- "$SCENARIO" --format "$format"
          done
          ls -la videos/out/

      # Fails unless every MP4 is h264/yuv420p tagged bt709 (primaries,
      # transfer and matrix) with AAC audio (videos/src/output/encoding.ts).
      - name: Verify render encoding (ffprobe)
        run: npm run -s videos:verify -- videos/out/*.mp4

      # A 20-second AAC clip of every music variant, so the track can be
      # picked by ear; the MP4s above use the default variant (#2336).
      - name: Render music previews
        run: |
          npm run -s videos:music -- --seconds 20
          ls -la videos/out/music/

      - name: Upload videos artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: videos-${{ steps.args.outputs.scenario }}-${{ github.run_id }}
          path: videos/out/*.mp4
          if-no-files-found: error
          retention-days: 30

      # The music previews go in their own artifact (#2344): videos-publish.yml
      # downloads the videos artifact above and refuses any file that is not
      # one of the planned MP4s (scripts/lib/videoPublish.ts).
      - name: Upload music previews artifact
        id: upload-music
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: videos-music-${{ steps.args.outputs.scenario }}-${{ github.run_id }}
          path: videos/out/music/*.m4a
          if-no-files-found: error
          retention-days: 30

  comment:
    name: Link the render on the PR
    needs: [plan, render]
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # list this run's artifacts for the links (#2353)
      pull-requests: write
    steps:
      # One artifact pair per scenario (matrix leg), so a job output would
      # hold only the last leg's URL: list the run's artifacts instead and
      # write the comment body to a file.
      - name: Link each scenario's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SCENARIOS: ${{ needs.plan.outputs.scenarios }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | [.name, (.id | tostring)] | @tsv' \
            > "$RUNNER_TEMP/artifacts.tsv"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          link() {
            awk -F'\t' -v n="$1" '$1 == n { print $2 }' "$RUNNER_TEMP/artifacts.tsv"
          }
          body="$RUNNER_TEMP/videos-comment.md"
          cat > "$body" <<'HEAD'
          ## 🎬 How-to video render

          Each scenario is rendered desktop 16:9 and mobile 9:16 from the live site.

          HEAD
          for s in $(jq -r '.[]' <<< "$SCENARIOS"); do
            v=$(link "videos-$s-$GITHUB_RUN_ID")
            m=$(link "videos-music-$s-$GITHUB_RUN_ID")
            if [ -n "$v" ]; then
              echo "- **$s**: [videos artifact]($run_url/artifacts/$v) (MP4s only, kept 30 days) · [music previews]($run_url/artifacts/$m)" >> "$body"
            else
              echo "- **$s**: render failed, see the run log" >> "$body"
            fi
          done
          cat >> "$body" <<'TAIL'

          **Music:** the videos use the default generated track. The music
          previews hold a 20-second preview of each variant (`bright-pluck`,
          `light-pop`, `warm-strum`); render another with `--music <variant>`.

          Renders are build outputs and are never committed.
          TAIL
          echo "[Run log]($run_url)" >> "$body"
          cat "$body"

      - name: Post sticky PR comment with the artifact links
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: videos
          path: ${{ runner.temp }}/videos-comment.md
