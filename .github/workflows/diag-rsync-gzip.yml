name: 'diag: rsync gzip decode (#1717)'

# One-off, read-only diagnostic for incident #1702 Q1 / decision D2 (#1717).
# Question: why does `gcloud storage rsync` on the runner leave
# Content-Encoding: gzip objects compressed when `gcloud storage cp` on the
# same runner inflates them? Downloads ONE ~216 B staging object plus one
# 14-object district dir (< 4 KB) into runner temp. No GCS writes.
# Dispatched once, then deleted in a follow-up PR.
#
# The repo is public, so HTTP logging is reduced to request lines and an
# allow-list of response headers; Authorization and anything token-like is
# filtered out again after the allow-list.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Workload Identity Federation

concurrency:
  group: diag-rsync-gzip
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SRC: gs://toast-stats-data-staging/time-series/district_61/
      OBJ: index-metadata.json
      ALLOW: '^uri:|^status:|-encoding|range:|x-goog-stored|user-agent|api-client|grpc|decompress'
      DENY: 'authorization|bearer|ya29\.|token|secret|private_key|assertion'
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Environment
        run: |
          which -a gcloud
          gcloud version
          gcloud info --format='value(installation.sdk_root,basic.python_location)'
          gcloud config get storage/preferred_api 2>&1 || true
          gcloud config get storage/use_grpc_if_available 2>&1 || true
          gcloud config get core/log_http_redact_token 2>&1 || true
          env | grep -E '^CLOUDSDK_' | cut -d= -f1 | sort || true

      - name: Object metadata
        run: |
          gcloud storage objects describe "${SRC}${OBJ}" \
            --format='yaml(content_type,content_encoding,cache_control,size,generation)'

      - name: 'Probe A: rsync ONE object (response-header path)'
        run: |
          D="${RUNNER_TEMP}/a"
          mkdir -p "$D"
          gcloud storage rsync -r --exclude='^(?!index-metadata\.json$).*' \
            "$SRC" "$D/" --log-http --verbosity=debug 2>&1 \
            | grep -i -E "$ALLOW" | grep -v -i -E "$DENY" || true
          ls -l "$D"
          file "$D/$OBJ"
          head -c 16 "$D/$OBJ" | od -c | head -2

      - name: 'Probe B: cp the same object (metadata path, control)'
        run: |
          D="${RUNNER_TEMP}/b"
          mkdir -p "$D"
          gcloud storage cp "${SRC}${OBJ}" "$D/" --log-http 2>&1 \
            | grep -i -E "$ALLOW" | grep -v -i -E "$DENY" || true
          ls -l "$D"
          file "$D/$OBJ"
          head -c 16 "$D/$OBJ" | od -c | head -2

      - name: 'Probe C: rsync one district dir (14 objects, concurrency)'
        run: |
          D="${RUNNER_TEMP}/c"
          mkdir -p "$D"
          gcloud storage rsync -r "$SRC" "$D/" 2>&1 | tail -3
          for f in "$D"/*.json; do
            printf '%s ' "$(basename "$f")"
            head -c 2 "$f" | od -An -tx1
          done

      - name: Cleanup
        if: always()
        run: rm -rf "${RUNNER_TEMP}/a" "${RUNNER_TEMP}/b" "${RUNNER_TEMP}/c"
