name: Release Please

on:
  push:
    branches:
      - main

# No workflow-level grant (#2879): each job declares exactly what it needs.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-26.04
    # Scopes listed in the release-please-action README (Workflow
    # Permissions section).
    # No id-token: this job runs a third-party action and must not be able to
    # mint the deploy identity (#2879).
    permissions:
      contents: write # release-please tags + releases
      pull-requests: write # release-please PR
      issues: write # listed in the README's Workflow Permissions section
    outputs:
      # Aggregate boolean: 'true' when ANY component was released by this
      # run. Fires exactly once per release-PR merge regardless of how many
      # components released — collapses the multi-component tag fan-out and
      # still covers package-only changes that alter the deployed bundle.
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Gate production deploy on a release-please release (ADR-004), not on
  # every merge to main. The release PR gets full CI for free (it is a PR
  # to main) — that is the integration gate; this fires only on its merge.
  deploy:
    name: Deploy on release
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    # A called workflow's token permissions are capped by this job, so it
    # carries exactly the set deploy.yml's deploy-frontend job declares.
    permissions:
      contents: read # checkout and `git log` in deploy.yml
      id-token: write # WIF auth in deploy.yml
      issues: write # hosting-rollback alert in deploy.yml (#2492)
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
