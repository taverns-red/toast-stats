# Legacy suspension deadlines (#3103): one-off, manual dispatch only.
#
# The five-period reinstatement rule needs each closed club's suspension
# deadline. TI's suspend date reaches our data only from 2025-07-31, so for
# clubs suspended before that the deadline comes from status history: the
# Sep 30 or Mar 31 deadline on or before the first month-end snapshot of the
# club's last run of Club Status "Suspended" (Ron, 2026-11-20). This job
# derives it once from the program year 2024-25 district files and writes
# gs://toast-stats-data-staging/config/legacy-suspension-deadlines.json.
#
# It defaults to a dry run, and uploads only when the rows match the row
# count and checksum in scripts/legacy-suspension-deadlines.expected.json.
#
# The daily reads its config inputs from staging (sync-stores.sh
# legacy-suspension-deadlines), so nothing needs promoting. Without the file
# the daily still works: closed clubs with no TI date are listed with no
# inactive period.
#
# Reads: the 1,584 district_<id>.json objects dated 2024-07-31 to 2025-06-30
# in staging (US multi-region), about 26 MB stored, onto a GitHub-hosted
# runner. Measured 2026-11-20 with gcloud storage ls -l; the plan step
# prints the real count and bytes. The file expires on 2027-10-01; a
# follow-up issue removes it and its reader after that.
#
# Signs in as the pipeline identity (vars.GCP_PIPELINE_SA, #2960), as
# contact-strip.yml does. Shares the data-pipeline concurrency group, so it
# never overlaps a pipeline run.

name: Legacy Suspension Deadlines

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build and print the file, upload nothing'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  build:
    name: Build legacy suspension deadlines (staging)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      BUCKET: toast-stats-data-staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The script imports the schema from the workspace package, which
      # resolves to its built dist/ (R2: the runner starts empty).
      - name: Build shared contracts
        run: npm run build:shared-contracts

      # An empty pipeline variable must fail here, before auth: the auth action
      # given no service account would fall back to direct workload identity.
      - name: Require the pipeline identity variable
        env:
          PIPELINE_SA: ${{ vars.GCP_PIPELINE_SA }}
        run: |
          if [ -z "${PIPELINE_SA}" ]; then
            echo "::error title=Missing variable::the repository variable GCP_PIPELINE_SA is empty"
            exit 1
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PIPELINE_SA }}

      # The listing gives each object's stored size: what the download moves.
      - name: Plan the read
        run: |
          set -o pipefail
          gcloud storage ls -l \
            "gs://${BUCKET}/snapshots/2024-*/district_*.json" \
            "gs://${BUCKET}/snapshots/2025-0[1-6]-*/district_*.json" > listing.txt
          npx tsx scripts/build-legacy-suspension-deadlines.ts plan \
            --listing listing.txt --urls urls.txt | tee plan.json
          {
            echo "## Legacy suspension deadlines (#3103)"
            echo "- bucket: ${BUCKET}"
            echo "- objects to read: $(jq -r '.count' plan.json)"
            echo "- bytes to read: $(jq -r '.bytes' plan.json)"
            echo "- dates: $(jq -r '.dates | join(", ")' plan.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download the district files
        run: |
          set -euo pipefail
          for DATE in $(jq -r '.dates[]' plan.json); do
            mkdir -p "in/snapshots/${DATE}"
            grep "/snapshots/${DATE}/" urls.txt | gcloud storage cp -I "in/snapshots/${DATE}/"
          done
          echo "Downloaded $(find in -type f | wc -l | tr -d ' ') files"

      - name: Build the file
        run: |
          set -o pipefail
          npx tsx scripts/build-legacy-suspension-deadlines.ts build \
            --input in --out legacy-suspension-deadlines.json | tee build.json
          echo "Rows: $(jq -r '.rowCount' build.json)"
          echo "Rows sha256: $(jq -r '.rowsSha256' build.json)"
          {
            echo "- files read: $(jq -r '.filesRead' build.json)"
            echo "- rows: $(jq -r '.rowCount' build.json)"
            echo "- rows sha256: $(jq -r '.rowsSha256' build.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      # The upload gate: the rows must match the row count and checksum
      # committed with the script (#3109 review). Runs on a dry run too.
      - name: Check rows against the committed checksum
        run: |
          npx tsx scripts/build-legacy-suspension-deadlines.ts verify \
            --file legacy-suspension-deadlines.json \
            --expected scripts/legacy-suspension-deadlines.expected.json

      - name: Upload to staging
        if: ${{ !inputs.dry_run }}
        run: |
          gcloud storage cp legacy-suspension-deadlines.json \
            "gs://${BUCKET}/config/legacy-suspension-deadlines.json"
          echo "- uploaded: gs://${BUCKET}/config/legacy-suspension-deadlines.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the file as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-suspension-deadlines-${{ github.run_id }}
          path: legacy-suspension-deadlines.json
          if-no-files-found: warn
          retention-days: 90
