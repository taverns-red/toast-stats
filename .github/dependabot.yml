version: 2

updates:
  # Single lockfile at repo root (npm workspaces / single package-lock.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Toronto"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    versioning-strategy: "increase"
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      # Hold maplibre-gl at 6.14 (#2400): 6.15+ adds ~8.3 KB gzip and pushes
      # the map routes over the 300 KB budget (#1786). Lift by trimming
      # map-route code first, then removing this entry. Never raise the budget.
      - dependency-name: "maplibre-gl"
        versions: [">=6.15.0"]
    groups:
      patch-and-minor:
        applies-to: "version-updates"
        update-types: ["patch", "minor"]
      dev-deps:
        applies-to: "version-updates"
        dependency-type: "development"
      prod-deps:
        applies-to: "version-updates"
        dependency-type: "production"

  # Keep GitHub Actions up-to-date too
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "America/Toronto"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"
      include: "scope"
